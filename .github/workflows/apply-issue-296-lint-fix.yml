name: Apply issue 296 lint fix

on:
  push:
    branches:
      - agent/296-repository-name-collisions
    paths:
      - .github/workflows/apply-issue-296-lint-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/296-repository-name-collisions
          fetch-depth: 0
      - name: Apply lint correction
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/issue-296-lint.patch
          git apply --check /tmp/issue-296-lint.patch
          git apply /tmp/issue-296-lint.patch
          rm -f .github/workflows/apply-issue-296-lint-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix repository suggestion effect lint (#296)'
          git push origin HEAD:agent/296-repository-name-collisions
