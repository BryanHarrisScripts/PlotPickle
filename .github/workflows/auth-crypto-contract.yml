name: Auth Crypto Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "core/auth/**"
      - "docs/architecture/PLOTPICKLE-AUTH-*.md"
      - "scripts/benchmark-auth-crypto.mjs"
      - "scripts/package-platform.mjs"
      - "tests/issue-1138-auth-crypto-contract.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "SECURITY.md"
      - "LICENSES.md"
      - ".github/workflows/auth-crypto-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-crypto-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform-contract:
    name: ${{ matrix.label }} contract, benchmark, build and package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            arch: x64
            package_target: linux
          - label: Windows x64
            os: windows-latest
            arch: x64
            package_target: windows
          - label: macOS arm64
            os: macos-latest
            arch: arm64
            package_target: macos
          - label: macOS x64
            os: macos-15-intel
            arch: x64
            package_target: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Expected ' + process.env.EXPECTED_ARCH + ', received ' + process.arch)"
      - name: Install dependencies with normal lifecycle policy
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate Auth crypto contracts and portability vector
        run: npm run test:auth-crypto
      - name: Record target Argon2id benchmark
        run: npm run benchmark:auth-crypto -- --json
      - name: Production build
        run: npm run build
      - name: Stage platform package and credential audit
        run: npm run package:${{ matrix.package_target }}

  lifecycle-disabled-proof:
    name: Lifecycle-disabled dependency proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install with lifecycle scripts disabled
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Validate Auth crypto without lifecycle scripts
        run: npm run test:auth-crypto
      - name: Production build without lifecycle scripts
        run: npm run build
