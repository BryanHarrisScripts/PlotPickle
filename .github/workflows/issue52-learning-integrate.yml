name: Issue 52 learning integration

on:
  push:
    branches:
      - agent/issue-52-contributor-handbook
    paths:
      - .github/issue52-learning-ready

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-52-contributor-handbook
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Read and Learn integration
        run: node scripts/issue52-learning-integrate.mjs
      - name: Remove one-time integration files
        run: git rm scripts/issue52-learning-integrate.mjs .github/workflows/issue52-learning-integrate.yml .github/issue52-learning-ready
      - name: Commit integration
        run: |
          git config user.name "PlotPickle Actions"
          git config user.email "actions@users.noreply.github.com"
          git add app/collaboration-handbook/page.tsx app/learning-working-together.ts app/learning-studio.tsx tests/issue-52-contributor-handbook.test.mjs
          git commit -m "Add Working Together to Read and Learn"
          git push origin HEAD:agent/issue-52-contributor-handbook
