name: Capture Phase E validation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-e-page-to-production-017
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture validation output
        run: |
          set +e
          npm run lint > docs/phase-e-lint.log 2>&1
          echo $? > docs/phase-e-lint.exit
          npm test > docs/phase-e-test.log 2>&1
          echo $? > docs/phase-e-test.exit
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/phase-e-lint.log docs/phase-e-lint.exit docs/phase-e-test.log docs/phase-e-test.exit
          git commit -m "Capture Phase E validation diagnostics"
          git push origin HEAD:agent/phase-e-page-to-production-017
