name: Issue 57 integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-57-visual-reference-library
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Import verified WebP build artifact
        env:
          ASSET_URL: "https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-ae54-822f-9a18-bf6d72306c2d/raw?se=2026-07-25T00:27:42Z&sp=r&sv=2026-02-06&sr=b&scid=ed26970c-35eb-5507-8008-8376d86e470d&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-24T22:34:09Z&ske=2026-07-26T22:34:09Z&sks=b&skv=2026-02-06&sig=kslVrmdqXBwLbNM12mzID2AbPkWK5ECYNixXO1SxH0k%3D"
        run: |
          curl --fail --location "$ASSET_URL" --output /tmp/issue-57-assets.zip
          rm -rf public/visual-references
          mkdir -p public/visual-references
          unzip -q /tmp/issue-57-assets.zip -d public/visual-references
          rm -f public/visual-references/transfer.json
      - name: Apply product integration
        run: python scripts/issue-57-integrate.py
      - name: Install dependencies
        run: npm ci
      - name: Validate asset inventory
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('public/visual-references/manifest.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('public/visual-references/report.json', 'utf8'));
          if (manifest.length !== 62 || report.retainedCount !== 62 || report.derivativeCount !== 186 || report.failures.length) process.exit(1);
          for (const item of manifest) for (const variant of ['thumbnail','card','full']) {
            const file = `public${item.image[variant]}`;
            if (!fs.existsSync(file) || fs.statSync(file).size === 0) process.exit(1);
          }
          NODE
      - name: Validate application
        run: |
          npm run lint
          npm test
      - name: Commit clean integration
        run: |
          rm .github/workflows/issue-57-integrate.yml
          rm scripts/issue-57-integrate.py
          git config user.name "PlotPickle automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate offline Visual Reference Library"
          git push origin HEAD:agent/issue-57-visual-reference-library
