name: Regenerate TypeScript lockfile

on:
  push:
    branches:
      - agent/typescript-6-supported-upgrade
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/typescript-6-supported-upgrade

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/regenerate-typescript-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/regenerate-typescript-lock.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): regenerate TypeScript 6 lockfile"
          git push origin HEAD:agent/typescript-6-supported-upgrade
