name: Issue 49 diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Capture build and test output
        id: diagnostics
        shell: bash
        run: |
          set +e
          npm test > issue-49-ci.log 2>&1
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: issue-49-ci-log
          path: issue-49-ci.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve failure status
        if: steps.diagnostics.outputs.exit_code != '0'
        run: exit 1
