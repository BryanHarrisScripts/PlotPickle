name: Managed Cloud Compute Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - "core/node-boundary/identity-contract-validation.mjs"
      - "core/identity/remote-node-compute-core.mjs"
      - "core/identity/remote-node-compute.ts"
      - "core/cloud/managed-cloud-compute-core.mjs"
      - "core/cloud/managed-cloud-compute.ts"
      - "core/profiles/local-human-profile-core.mjs"
      - "core/profiles/local-human-profile.ts"
      - "lib/plotpickle-node-topology-core.mjs"
      - "lib/plotpickle-node-topology.ts"
      - "build/node-topology-gateway.ts"
      - "docs/architecture/PLOTPICKLE-NODE-TOPOLOGY.md"
      - "docs/architecture/TRUSTED-REMOTE-COMPUTE.md"
      - "tests/issue-1013-plotpickle-node-topology.test.mjs"
      - "tests/issue-1075-trusted-node-remote-compute.test.mjs"
      - "tests/issue-1135-canonical-node-buzz-boundary.test.mjs"
      - ".github/workflows/trusted-node-remote-compute.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-cloud-compute-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-node-cloud-boundary:
    name: Local Node privacy and managed cloud boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate Node/Community/resource separation and managed cloud contracts
        run: node --test tests/issue-1013-plotpickle-node-topology.test.mjs tests/issue-1075-trusted-node-remote-compute.test.mjs tests/issue-1135-canonical-node-buzz-boundary.test.mjs

      - name: Re-run identity, sync and BUZZ compatibility contracts
        run: node --test tests/issue-1072-identity-authority.test.mjs tests/issue-1073-avatar-recovery-learn-sync.test.mjs tests/issue-927-studio-identity.test.mjs tests/issue-928-playhouse-federation.test.mjs

      - name: Production build
        run: npm run build
