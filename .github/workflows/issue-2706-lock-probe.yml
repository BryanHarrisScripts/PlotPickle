name: Issue 2706 Lock Probe

on:
  push:
    branches:
      - issue-2706-braces-depth-guard

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Show braces resolution and lock diff
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          console.log('BRACES_ENTRY_START');
          console.log(JSON.stringify(lock.packages['node_modules/braces'], null, 2));
          console.log('BRACES_ENTRY_END');
          NODE
          echo 'LOCK_DIFF_START'
          git diff -- package-lock.json
          echo 'LOCK_DIFF_END'
