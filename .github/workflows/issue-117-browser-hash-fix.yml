name: Issue 117 browser hash patch

on:
  push:
    branches:
      - agent/issue-117-ai-human-review

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-117-ai-human-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Apply guarded browser-safe hash patch
        run: node scripts/issue-117-browser-hash-fix.mjs
      - name: Verify browser-safe source contract
        run: |
          ! grep -q 'node:crypto' lib/review-workflows.ts
          grep -q 'fnv1a-' lib/review-workflows.ts
      - name: Commit permanent patch and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/issue-117-browser-hash-fix.mjs .github/workflows/issue-117-browser-hash-fix.yml
          git add lib/review-workflows.ts
          git commit -m "Use browser-safe review prompt hashing"
          git push origin HEAD:agent/issue-117-ai-human-review
