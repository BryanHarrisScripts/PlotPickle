name: Agent Skill Trust

on:
  pull_request:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - "config/agent-skills.json"
      - "config/agent-skill-trust.json"
      - "scripts/agent-skills.mjs"
      - "scripts/agent-skill-procedures.mjs"
      - "scripts/agent-skill-trust.mjs"
      - "lib/agents/agent-profiles.ts"
      - "lib/agents/responsibility/connector-trust-policy.ts"
      - "lib/model-portability-evals.ts"
      - "tests/fixtures/agent-skills/**"
      - "tests/issue-913-agent-skills-migration.test.mjs"
      - "tests/issue-976-agent-skill-trust*.test.mjs"
      - "docs/research/agent-architecture/**"
      - ".github/workflows/agent-skill-trust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-skill-trust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trust:
    name: Trust records, quarantine and eval boundary
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate existing Agent Skills migration contract
        run: node --test tests/issue-913-agent-skills-migration.test.mjs

      - name: Run Agent Skill trust self-test
        run: node scripts/agent-skill-trust.mjs

      - name: Execute quarantine and hash invalidation tests
        run: node --test tests/issue-976-agent-skill-trust-runtime.test.mjs

      - name: Validate Skill supply-chain contract and research intake
        run: node --test tests/issue-976-agent-skill-trust.test.mjs

      - name: Recheck connector and portability boundaries
        run: node --test tests/issue-965-connector-trust-policy.test.mjs tests/issue-968-run-telemetry-evals.test.mjs
