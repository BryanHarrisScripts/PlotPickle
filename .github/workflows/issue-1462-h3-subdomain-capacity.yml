name: Issue 1462 H3 AI Subdomain Capacity

on:
  push:
    branches:
      - arch/1462-ai-h3-subdomain-capacity
    paths:
      - ".github/workflows/issue-1462-h3-subdomain-capacity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-h3-subdomain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/1462-ai-h3-subdomain-capacity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - run: npm ci --include=dev --no-audit --no-fund

      - name: Apply bounded H3 subdomain move
        run: python .github/scripts/issue-1462-h3-subdomain-capacity.py

      - name: Focused H3 and architecture regressions
        run: >-
          node --test
          tests/issue-1462-h3-native-gateway-move.test.mjs
          tests/issue-258-creative-compute-paths.test.mjs
          tests/issue-973-comfyui-api-readiness.test.mjs
          tests/issue-300-native-h3-credential-registry.test.mjs
          tests/comfyui-live-verification.test.mjs
          tests/issue-1461-repository-architecture-inventory.test.mjs
          tests/hardware-aware-local-ai-runtime.test.mjs

      - name: Production build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check

      - name: Commit permanent H3 subdomain move
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/issue-1462-h3-subdomain-capacity.py
          git add -A
          git commit -m "refactor(#1462): create H3 AI subdomain capacity"
          git push origin HEAD:arch/1462-ai-h3-subdomain-capacity

# retry 2: create target subdomain before git mv
