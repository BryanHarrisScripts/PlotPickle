name: UI/UX Dashboard command centre

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/dashboard-command-centre.tsx"
      - "app/dashboard-command-centre.module.css"
      - "app/setup-connections-dashboard.tsx"
      - "app/setup-connections-dashboard.module.css"
      - "lib/dashboard-command-centre.ts"
      - "config/ui-ux-screen-registry.json"
      - "docs/DASHBOARD-COMMAND-CENTRE-UX.md"
      - "tests/issue-355-dashboard-command-centre-ux.test.mjs"
      - ".github/workflows/ui-ux-dashboard-command-centre.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-ux-dashboard-command-centre-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-command-centre-contract:
    name: Dashboard command-centre contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: node --test tests/issue-355-dashboard-command-centre-ux.test.mjs tests/issue-113-dashboard-command-centre.test.mjs tests/issue-256-setup-connections-dashboard.test.mjs tests/issue-337-ui-ux-consistency-foundation.test.mjs
      - run: node --check tests/issue-355-dashboard-command-centre-ux.test.mjs
