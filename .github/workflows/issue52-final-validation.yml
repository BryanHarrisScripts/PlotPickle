name: Issue 52 final validation

on:
  push:
    branches:
      - issue-52-contributor-handbook
    paths:
      - .github/issue52-final-validate-ready

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-52-contributor-handbook
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run validation and capture result
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/issue52-final-lint.log 2>&1
          LINT_STATUS=$?
          npm test > /tmp/issue52-final-test.log 2>&1
          TEST_STATUS=$?
          {
            echo "lint_status=$LINT_STATUS"
            echo "test_status=$TEST_STATUS"
            echo ""
            echo "===== LINT OUTPUT ====="
            tail -n 180 /tmp/issue52-final-lint.log
            echo ""
            echo "===== TEST OUTPUT ====="
            tail -n 260 /tmp/issue52-final-test.log
          } > .github/issue52-final-validation-result.txt
          exit 0
      - name: Record and clean validation
        run: |
          git config user.name "PlotPickle Actions"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/issue52-final-validation.yml .github/issue52-final-validate-ready
          git add .github/issue52-final-validation-result.txt
          git commit -m "Record final issue 52 validation"
          git push origin HEAD:issue-52-contributor-handbook
