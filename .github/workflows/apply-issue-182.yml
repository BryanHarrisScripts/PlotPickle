name: Apply Issue 182 Collab workspace

on:
  push:
    branches:
      - agent/182-collab-workspace

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Add provider-neutral Collab workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/182-collab-workspace
          fetch-depth: 0
      - name: Apply reviewed Phase 1 patch
        shell: bash
        run: |
          set -euo pipefail
          for patch in scripts/issue-182-patches/*.patch; do
            git apply --check "$patch"
          done
          for patch in scripts/issue-182-patches/*.patch; do
            git apply "$patch"
          done
          rm -rf scripts/issue-182-patches
          rm -f .github/workflows/apply-issue-182.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add provider-neutral Collab workspace"
          git push origin HEAD:agent/182-collab-workspace
