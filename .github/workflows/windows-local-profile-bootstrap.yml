name: Windows Local Profile Bootstrap

on:
  pull_request:
    paths:
      - "app/api/auth/profile/route.ts"
      - "core/auth/server-session/server-session-boundary-core.mjs"
      - "tests/issue-1192-windows-local-profile-bootstrap.test.mjs"
      - ".github/workflows/windows-local-profile-bootstrap.yml"

permissions:
  contents: read

jobs:
  profile-bootstrap:
    name: ${{ matrix.name }} local first-profile and build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22.19
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate installed-machine first-profile boundary
        run: >-
          node --test
          tests/issue-1192-windows-local-profile-bootstrap.test.mjs
          tests/issue-1142-server-session-boundary.test.mjs
          tests/issue-1143-profile-experience.test.mjs
          tests/issue-1146-auth-full-verification.test.mjs
      - name: Production build
        run: npm run build
