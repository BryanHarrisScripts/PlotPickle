name: Web Anywhere

on:
  pull_request:
    branches: [main]
    paths:
      - "core/identity/web-anywhere-core.mjs"
      - "core/identity/web-anywhere.ts"
      - "tests/issue-1077-web-anywhere.test.mjs"
      - ".github/workflows/web-anywhere.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-anywhere-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase-e-web-anywhere:
    name: Web identity, LEARN, Community and remote dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate web-anywhere contract
        run: node --test tests/issue-1077-web-anywhere.test.mjs

      - name: Re-run identity, sync and remote-compute contracts
        run: node --test tests/issue-1072-identity-authority.test.mjs tests/issue-1073-avatar-recovery-learn-sync.test.mjs tests/issue-1075-trusted-node-remote-compute.test.mjs

      - name: Production build
        run: npm run build
