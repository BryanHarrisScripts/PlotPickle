name: PR Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install PlotPickle dependencies once
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate PR verification topology
        run: node --test tests/issue-1747-ci-two-gates.test.mjs tests/issue-538-ci-consolidation.test.mjs tests/issue-1949-merge-authority.test.mjs tests/issue-1951-retire-legacy-gates.test.mjs

      - name: Validate development convergence contract
        run: node --test tests/issue-1899-development-convergence.test.mjs

      - name: Validate development run ledger contract
        run: node --test tests/issue-1903-development-run-ledger.test.mjs

      - name: Validate PlotPickle Score contract
        run: node --test tests/issue-1905-plotpickle-score.test.mjs

      - name: Validate DraftLens Reader Simulation Harness
        run: node --test tests/issue-1908-draftlens-reader-simulation-harness.test.mjs tests/issue-1908-score-and-fingerprint-regression.test.mjs tests/issue-978-resident-writer-specialists.test.mjs

      - name: Validate development convergence
        run: node scripts/run-development-convergence.mjs

      - name: Validate seven-layer verification contracts
        run: |
          node scripts/validate-verification-phase-1.mjs
          node --test tests/issue-1926-verification-schemas.test.mjs

      - name: Validate seven-layer verification core and merge authority
        run: node --test tests/issue-1938-verification-core.test.mjs tests/issue-1941-seven-shadow-checks.test.mjs tests/issue-1943-shadow-equivalence.test.mjs tests/issue-1947-live-evidence-selection.test.mjs tests/issue-1949-merge-authority.test.mjs tests/issue-1951-retire-legacy-gates.test.mjs

      - name: Validate current Experience architecture boundary
        run: node --test tests/issue-1754-story-workspace-boundary.test.mjs tests/issue-1647-universal-lifecycle-contract.test.mjs tests/issue-1754-skin-v1-logon.test.mjs tests/community-skin-v1-navigation.test.mjs tests/community-agent-roster.test.mjs tests/issue-1788-webmcp-surface-visual-uat.test.mjs tests/issue-1793-startup-webmcp-uat.test.mjs tests/issue-1815-locked-visual-baselines.test.mjs tests/issue-1881-visual-compute-harness.test.mjs tests/issue-1883-dashboard-visual-director.test.mjs tests/issue-1885-webmcp-visual-director-startup.test.mjs tests/issue-1847-1849-cloud-agents-settings.test.mjs tests/issue-1897-skin-v1-typography-consistency.test.mjs tests/issue-1901-story-mode-connections.test.mjs tests/local-ai-video-default.test.mjs

      - name: Validate Skin V1 Dashboard navigation repair
        run: node --test tests/issue-1915-skin-v1-dashboard-navigation.test.mjs tests/issue-1920-profile-webmcp-readiness.test.mjs tests/issue-1923-profile-control-height.test.mjs tests/issue-1927-node-semantic-identity.test.mjs tests/issue-1932-writer-craft-webmcp-selector.test.mjs tests/issue-1935-writer-craft-selected-row.test.mjs

      - name: Validate LEARN #1918 Phase 0 baseline
        run: |
          node scripts/validate-learn-curriculum.mjs
          node scripts/validate-learn-journey-baseline.mjs
          node --test tests/issue-1918-learn-journey-baseline.test.mjs

      - name: Validate Pi 0.85.1 / GPT-6 Astra evaluation contract
        run: node --test tests/issue-1709-pi-0851-astra-evaluation.test.mjs

      - name: Validate Sequence Evidence
        run: node --test tests/issue-1889-sequence-evidence.test.mjs tests/sequence-director-24-96-2400.test.mjs

      - name: Validate current security closeout
        run: node --test tests/issue-1228-security-closeout.test.mjs tests/issue-1571-autonomous-qa-targeted-fix-trigger.test.mjs tests/issue-1827-codeql-second-pass.test.mjs tests/issue-1833-codeql-data-flow-closeout.test.mjs tests/issue-1837-codeql-zero-closeout.test.mjs tests/issue-1840-codeql-casebook-text-boundary.test.mjs tests/issue-503-windows-mcp-spawn.test.mjs tests/issue-1185-pi-managed-install.test.mjs tests/issue-104-windows-paths.test.mjs tests/issue-483-feedback-studio.test.mjs tests/issue-88-visual-board-navigation.test.mjs

      - name: Validate OSS and third-party registry
        run: node --test tests/issue-1892-oss-third-party-registry.test.mjs tests/issue-1895-oss-influence-attribution.test.mjs

      - name: Validate living architecture documentation
        run: node --test tests/architecture-blueprint-generator.test.mjs tests/issue-1909-living-architecture.test.mjs

      - name: Validate universal local voice input
        run: node --test tests/issue-1910-local-voice-input.test.mjs

      - name: Validate core auth and storage contracts
        run: |
          npm run test:plotpickle-auth
          npm run audit:credentials
          node --test tests/issue-1142-server-session-boundary.test.mjs tests/issue-1122-library-persistence.test.mjs

      - name: Validate bundled local video setup
        run: node --test tests/ltx-bundled-default.test.mjs

      - name: Production web build
        run: npm run build

      - name: Upload PR Gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-${{ github.run_id }}
          path: |
            .artifacts/
          if-no-files-found: warn
          retention-days: 7
