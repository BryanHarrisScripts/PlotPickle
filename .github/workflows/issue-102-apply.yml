name: Apply issue 102 marketing splash

on:
  push:
    branches:
      - agent/issue-102-marketing-splash

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-102-marketing-splash
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Connect approved splash to startup
        run: |
          node scripts/issue-102-apply.mjs
          rm scripts/issue-102-apply.mjs
          rm .github/workflows/issue-102-apply.yml
      - name: Commit product integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate approved whole-film marketing splash"
          git push origin HEAD:agent/issue-102-marketing-splash
