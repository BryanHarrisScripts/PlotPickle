name: Issue 116 guarded integration

on:
  push:
    branches:
      - agent/issue-116-feedback-workspace
    paths:
      - .github/workflows/issue-116-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-116-feedback-workspace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Apply guarded integration
        run: node scripts/apply-issue-116-feedback-workspace.mjs
      - name: Validate focused source contracts
        run: node --test tests/issue-116-unified-feedback.test.mjs
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit permanent integration only
        shell: bash
        run: |
          git rm scripts/apply-issue-116-feedback-workspace.mjs .github/workflows/issue-116-integration.yml
          git config user.name "PlotPickle Integration"
          git config user.email "actions@users.noreply.github.com"
          git add app lib tests
          git commit -m "Complete unified Feedback workspace integration"
          git push origin HEAD:agent/issue-116-feedback-workspace
