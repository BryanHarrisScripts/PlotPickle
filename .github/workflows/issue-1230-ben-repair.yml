name: Issue 1230 BEN Repair

on:
  push:
    branches:
      - fix/full-verification-closeout
    paths:
      - ".github/workflows/issue-1230-ben-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded BEN repair
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`${path}: expected source fragment not found`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceExact(
            'scripts/verify-pi-repair-worker.mjs',
            `  try {\n    await runPiSmoke({ command: pi.command, runtime, purpose: "repair", timeout: PI_SMOKE_TIMEOUT_MS });\n  } catch (error) {\n    throw new Error(\`Pi local-model readiness probe failed. \${safePiFailure(error)}\`, { cause: error });\n  }`,
            `  await runPiSmoke({ command: pi.command, runtime, purpose: "repair", timeout: PI_SMOKE_TIMEOUT_MS });`
          );

          replaceExact(
            'scripts/verify-pi-repair-worker.mjs',
            `main().catch((error) => {\n  console.error(error instanceof Error ? error.stack || error.message : String(error));\n  process.exitCode = 1;\n});`,
            `main().catch((error) => {\n  const detail = safePiFailure(error);\n  const message = error instanceof Error ? error.stack || error.message : String(error);\n  console.error(\`\${message}\\nPi process evidence: \${detail}\`);\n  process.exitCode = 1;\n});`
          );

          replaceExact(
            'scripts/exhaustive-ui-control-audit.mjs',
            `      interactions += 1;\n      status(\n        \`Exhaustive UAT · \${screen.label}\`,\n        "WORKING",\n        \`\${interactions}/\${interactionLimit} · \${control.role} · \${String(control.label).slice(0, 120)}\`,\n      );\n      try {`,
            `      interactions += 1; status(\`Exhaustive UAT · \${screen.label}\`, "WORKING", \`\${interactions}/\${interactionLimit} · \${control.role} · \${String(control.label).slice(0, 120)}\`);\n      try {`
          );
          NODE
      - name: Remove one-shot helper and commit
        shell: bash
        run: |
          git config user.name "PlotPickle"
          git config user.email "bryan@bryanharris.ca"
          git rm .github/workflows/issue-1230-ben-repair.yml
          git add scripts/verify-pi-repair-worker.mjs scripts/exhaustive-ui-control-audit.mjs
          git commit -m "#1230 preserve Pi evidence and BEN fingerprints"
          git push origin HEAD:${GITHUB_REF_NAME}
