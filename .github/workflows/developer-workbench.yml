name: Developer Workbench

on:
  pull_request:
    paths:
      - "Utilities/DeveloperWorkbench/**"
      - "scripts/pi-work-item-review.mjs"
      - "tests/issue-1349-developer-workbench.test.mjs"
      - "tests/issue-1373-workbench-canonical-pi-readiness.test.mjs"
      - "tests/issue-1382-workbench-pi-stdin-eof.test.mjs"
      - "tests/issue-1448-developer-workbench-local-reviewers.test.mjs"
      - ".github/workflows/developer-workbench.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare Workbench build identity
        shell: pwsh
        run: |
          $sha = "${{ github.event.pull_request.head.sha }}"
          if ([string]::IsNullOrWhiteSpace($sha)) {
            $sha = "${{ github.sha }}"
          }
          $shortSha = if ($sha.Length -gt 12) { $sha.Substring(0, 12) } else { $sha }
          $build = "${{ github.run_number }}"
          "PLOTPICKLE_WORKBENCH_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PLOTPICKLE_WORKBENCH_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WORKBENCH_SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WORKBENCH_ARTIFACT_NAME=PlotPickle-Developer-Workbench-win-x64-build-$build-$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Contract regression
        run: node --test tests/issue-1349-developer-workbench.test.mjs tests/issue-1373-workbench-canonical-pi-readiness.test.mjs tests/issue-1382-workbench-pi-stdin-eof.test.mjs tests/issue-1448-developer-workbench-local-reviewers.test.mjs

      - name: Build Windows Workbench
        shell: pwsh
        run: dotnet build Utilities/DeveloperWorkbench/DeveloperWorkbench.csproj --configuration Release "-p:PlotPickleWorkbenchBuild=$env:PLOTPICKLE_WORKBENCH_BUILD" "-p:PlotPickleWorkbenchSha=$env:WORKBENCH_SHORT_SHA"

      - name: Publish Workbench package
        shell: pwsh
        run: ./Utilities/DeveloperWorkbench/build.ps1

      - name: Upload Windows Workbench
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WORKBENCH_ARTIFACT_NAME }}
          path: Utilities/DeveloperWorkbench/dist/win-x64/
          if-no-files-found: error

  product-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Production build
        run: npm run build
