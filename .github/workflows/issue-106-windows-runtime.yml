name: Issue 106 Windows cmd quoting

on:
  push:
    branches:
      - agent/issue-106-cmd-quoting
  pull_request:
    branches:
      - main

jobs:
  windows-cmd-quoting:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
          persist-credentials: false
      - name: Execute npm.cmd and spaced-path commands
        run: node --test tests/issue-104-windows-paths.test.mjs
