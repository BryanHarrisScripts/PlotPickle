name: Apply Phase 7B compatibility labels

on:
  push:
    branches:
      - agent/graphic-novel-phase-7b

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Restore established viewer and export labels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          viewer = Path('app/graphic-novel-viewer.tsx')
          text = viewer.read_text()
          text = text.replace(
              '<span>Phase 7B · Complete reader and lettering</span>',
              '<span>Phase 7B · Complete Graphic Novel Viewer</span>',
          )
          text = text.replace(
              '<div><span>Phase 7B · Read, edit and export</span><h2 id="graphic-novel-viewer-title">Complete Graphic Novel Viewer</h2><p>',
              '<div><span>Phase 7B · Complete Graphic Novel Viewer</span><h2 id="graphic-novel-viewer-title">Full-screen Graphic Novel viewer and bubble editor</h2><p>',
          )
          viewer.write_text(text)

          workspace = Path('app/ai-pitch-deck-workspace.tsx')
          text = workspace.read_text().replace(
              '>Download interactive HTML</button>',
              '>Download self-contained HTML</button>',
          )
          workspace.write_text(text)
          PY
          rm .github/workflows/phase7b-label-fix.yml
          git config user.name "PlotPickle Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Preserve Graphic Novel compatibility labels"
          git push
