name: PR Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install PlotPickle dependencies once
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate consolidated CI contracts and audit safeguards
        run: node --test tests/issue-1747-ci-two-gates.test.mjs tests/issue-538-ci-consolidation.test.mjs tests/issue-1571-autonomous-qa-continuous-runtime.test.mjs tests/ui-ux-code-audit-runner.test.mjs tests/ui-ux-code-audit-contradictions.test.mjs

      - name: Validate LEARN, navigation, workspace and PPF contracts
        run: |
          npm run validate:learn
          node --test tests/guided-progression-engine.test.mjs tests/issue-1030-visual-writer-progression.test.mjs tests/issue-1080-marquee-marketing-reference.test.mjs tests/foundations-build-visual-workshop.test.mjs tests/issue-1030b-foundations-wireframe.test.mjs tests/issue-1030c-world-vertical-slice.test.mjs tests/issue-1030d-avery-dashboard-frontier.test.mjs tests/issue-653-writer-in-residence.test.mjs tests/issue-1029-avery-progressive-session-history.test.mjs tests/workspace-navigation-contract.test.mjs tests/issue-544-ui-continuity-agent.test.mjs tests/issue-964-revision-aware-ppf.test.mjs tests/afterglow-revision-ppf.test.mjs

      - name: Validate headless Experience and Skin V1 contracts
        run: node --test tests/issue-1754-skin-v1-logon.test.mjs tests/issue-1754-story-workspace-boundary.test.mjs tests/issue-1754-startup-no-legacy-flash.test.mjs

      - name: Validate story, BUILD and decision contracts
        run: node --test tests/issue-1338-progressive-build-story-model.test.mjs tests/issue-1416-story-workflow-engine.test.mjs tests/issue-967-safe-graph-workflows.test.mjs tests/issue-989-verification-execution-graph.test.mjs tests/issue-999-story-knowledge-graph.test.mjs tests/issue-968-run-telemetry-evals.test.mjs tests/issue-1420-visible-story-decisions.test.mjs tests/issue-1420-targeted-script-staleness.test.mjs

      - name: Validate auth, profile and private-storage contracts
        run: |
          npm run test:plotpickle-auth
          npm run audit:credentials
          node --test tests/issue-299-local-credential-audit.test.mjs tests/issue-1200-scoped-memory-contract.test.mjs tests/issue-1201-memory-persistence-isolation.test.mjs tests/issue-1202-bounded-memory-retrieval.test.mjs tests/issue-1203-sage-avery-memory-continuity.test.mjs tests/issue-1122-library-persistence.test.mjs

      - name: Validate Agent Skill, trust and BUZZ contracts
        run: node --test tests/issue-913-agent-skills-migration.test.mjs tests/issue-976-agent-skill-trust-runtime.test.mjs tests/issue-962-agent-profiles.test.mjs tests/issue-963-context-engine.test.mjs tests/issue-965-connector-trust-policy.test.mjs tests/issue-971-buzz-specialist-agents.test.mjs tests/issue-677-buzz-guildhall-settings.test.mjs tests/issue-1067-buzz-conversation-mirror.test.mjs tests/community-agent-roster.test.mjs tests/sage-brinewick-agent-skill.test.mjs

      - name: Validate Responsibility, orchestration and BUZZ identity contracts
        run: node --test tests/issue-966-responsibility-runs.test.mjs tests/issue-977-buzz-mastra-orchestration.test.mjs tests/issue-1003-harness-improvement-proposals.test.mjs tests/issue-1422-buzz-agent-identity-binding.test.mjs tests/issue-1144-buzz-profile-migration-contract.test.mjs

      - name: Validate focused UAT and hardware-aware local AI contracts
        shell: bash
        run: |
          node --test tests/issue-622-uat-autopilot.test.mjs tests/creative-uat-mcp-runtime.test.mjs tests/exhaustive-ui-harness-boundary.test.mjs tests/full-verification-runner.test.mjs tests/full-verification-log-review.test.mjs tests/issue-930-verification-inbox.test.mjs tests/issue-931-verification-orchestration.test.mjs tests/comfyui-live-verification.test.mjs tests/issue-973-comfyui-api-readiness.test.mjs tests/issue-1012-comfyui-managed-instance-readiness.test.mjs tests/issue-1026-comfyui-runtime-settings.test.mjs
          mkdir -p .artifacts/uat-focused
          node scripts/run-uat-autopilot.mjs --contracts-only --artifact-root .artifacts/uat-focused 2>&1 | tee .artifacts/uat-focused/contracts-console.log

      - name: BEN deterministic code-quality delta
        if: github.event_name == 'pull_request'
        run: |
          node --test tests/issue-1005-ben-code-quality.test.mjs tests/issue-1226-release-security-cleanup.test.mjs tests/issue-1228-security-closeout.test.mjs tests/issue-1239-local-uat-current-shell.test.mjs tests/issue-396-storyboard-exploration.test.mjs tests/issue-1165-structured-storyboard-shot.test.mjs tests/issue-1166-storyboard-blocking-advisories.test.mjs tests/issue-1286-casebook-business-case-registry.test.mjs tests/issue-1236-casebook-real-integrations.test.mjs tests/issue-1236-casebook-attended-runner.test.mjs tests/issue-1236-casebook-live-verifiers.test.mjs tests/issue-1236-casebook-profile-isolation-live.test.mjs tests/issue-1236-casebook-phase3b3.test.mjs tests/issue-1235-casebook-evidence.test.mjs tests/issue-1234-casebook-contract.test.mjs tests/issue-1218-semantic-execution-contract.test.mjs
          node scripts/run-ben-code-quality.mjs --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: BEN current-tree code-quality scan
        if: github.event_name != 'pull_request'
        run: node scripts/run-ben-code-quality.mjs

      - name: Validate repository architecture
        run: |
          node --test tests/issue-1220-architecture-health.test.mjs tests/issue-1461-repository-architecture-inventory.test.mjs tests/issue-1462-build-domain-consolidation.test.mjs tests/issue-1466-repository-architecture-enforcement.test.mjs tests/issue-1645-harness-lifecycle-inventory.test.mjs tests/issue-1647-universal-lifecycle-contract.test.mjs tests/issue-1650-lifecycle-presentation.test.mjs tests/issue-1650-autonomous-reference-presentation.test.mjs tests/issue-1650-lifecycle-reference-report.test.mjs tests/issue-1651-responsibility-bridge-retirement.test.mjs
          node scripts/architecture-health-audit.mjs

      - name: Parse Windows verification and maintenance scripts
        shell: pwsh
        run: |
          foreach ($path in @(
            "scripts/run-plotpickle-full-check.ps1",
            "scripts/windows-companion-software.ps1",
            "scripts/windows-companion-maintenance-after-ready.ps1",
            "scripts/install-local-ai-tool.ps1",
            "scripts/install-buzz-desktop.ps1",
            "scripts/start-comfyui-background.ps1",
            "scripts/comfyui-managed-instance-core.ps1",
            "scripts/configure-hardware-aware-local-ai.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              exit 1
            }
          }

      - name: Validate retained agent skill trust contracts
        run: node --test tests/issue-976-agent-skill-trust.test.mjs

      - name: Validate retained auth core contracts
        run: node --test tests/issue-1072-identity-authority.test.mjs tests/issue-1135-canonical-node-buzz-boundary.test.mjs

      - name: Validate retained autonomous guest task ledger contracts
        run: node --test tests/issue-1569-autonomous-guest-mastra-scheduler.test.mjs tests/issue-1569-autonomous-guest-mastra-storage.test.mjs tests/issue-1569-autonomous-guest-mastra-wake-runtime.test.mjs tests/issue-1569-autonomous-guest-reference-runner.test.mjs tests/issue-1569-autonomous-guest-restart-ordering.test.mjs tests/issue-1569-autonomous-guest-route-policy-recovery.test.mjs tests/issue-1569-autonomous-guest-run-policy.test.mjs tests/issue-1569-autonomous-guest-settings.test.mjs tests/issue-1569-autonomous-guest-task-ledger.test.mjs tests/issue-1569-autonomous-guest-task-lifecycle.test.mjs

      - name: Validate retained autonomous qa campaign contracts
        run: node --test tests/issue-1571-autonomous-qa-campaign-contract.test.mjs tests/issue-1571-autonomous-qa-campaign-planner.test.mjs tests/issue-1571-autonomous-qa-defect-dedup.test.mjs tests/issue-1571-autonomous-qa-defect-publication.test.mjs tests/issue-1571-autonomous-qa-fix-verification.test.mjs tests/issue-1571-autonomous-qa-targeted-fix-trigger.test.mjs tests/issue-1571-autonomous-qa-tester-journeys.test.mjs

      - name: Validate retained autonomous qa targeted fix contracts
        run: node --test tests/issue-1553-autonomous-story-decision-authority.test.mjs

      - name: Validate retained avatar learn sync contracts
        run: node --test tests/issue-1013-plotpickle-node-topology.test.mjs tests/issue-1073-avatar-recovery-learn-sync.test.mjs tests/issue-927-studio-identity.test.mjs tests/issue-928-playhouse-federation.test.mjs

      - name: Validate retained build story model contracts
        run: node --test tests/dashboard-foundations-progression.test.mjs tests/issue-114-build-workspace.test.mjs tests/issue-1338-library-import-archive.test.mjs tests/issue-1338-screenplay-to-ppf-utility.test.mjs tests/issue-351-build-health-map.test.mjs

      - name: Validate retained buzz guildhall contracts
        run: node --test tests/buzz-live-roundtrip.test.mjs tests/buzz-story-room-access-agents.test.mjs tests/community-workspace.test.mjs tests/core-readme-direction.test.mjs tests/issue-1028-settings-help.test.mjs tests/issue-1065-bbs-moderator.test.mjs tests/issue-1081-merrin-room-aware-moderation.test.mjs tests/issue-1129-buzz-native-community.test.mjs tests/issue-1130-buzz-local-backbone.test.mjs tests/issue-1222-buzz-real-machine-regression.test.mjs tests/issue-1444-story-room-identity.test.mjs tests/issue-512-buzz-version-maintenance.test.mjs tests/issue-620-buzz-startup-updater.test.mjs tests/issue-672-global-navigation.test.mjs tests/issue-675-buzz-guildhall.test.mjs tests/live-buzz-guildhall-activity.test.mjs

      - name: Validate retained demo onboarding contracts
        run: node --test tests/issue-1692-demo-boundary.test.mjs tests/issue-1692-demo-phase2-first-run-ui.test.mjs tests/issue-1692-demo-phase3-sage-show-me.test.mjs tests/issue-1692-demo-phase4-make-this-mine.test.mjs tests/issue-1692-demo-world.test.mjs

      - name: Validate retained developer workbench contracts
        run: node --test tests/issue-1349-developer-workbench.test.mjs tests/issue-1373-workbench-canonical-pi-readiness.test.mjs tests/issue-1382-workbench-pi-stdin-eof.test.mjs tests/issue-1448-developer-workbench-local-reviewers.test.mjs tests/issue-1451-workbench-gate-handoff.test.mjs

      - name: Validate retained evidence learning maintainer contracts
        run: node --test tests/issue-1592-durable-retrieval-restart.test.mjs tests/issue-1592-evidence-learning-contract.test.mjs tests/issue-1592-exact-head-architecture-learner.test.mjs tests/issue-1592-governed-skill-proposals.test.mjs tests/issue-1592-harness-admission-promotion.test.mjs tests/issue-1592-qa-repair-handoff.test.mjs tests/issue-1592-task-handoff-budget-guard.test.mjs

      - name: Validate retained hardware aware local ai contracts
        run: node --test tests/ai-architecture.test.mjs tests/automatic-local-model-capabilities.test.mjs tests/comfyui-desktop-onboarding.test.mjs tests/foundation-architecture.test.mjs tests/hardware-aware-local-ai-runtime.test.mjs tests/issue-1001-hardware-model-catalog.test.mjs tests/issue-1018-rag-python-comfy-repair-order.test.mjs tests/issue-1020-python-probe-native-stderr.test.mjs tests/issue-1022-sdxl-starter-checkpoint.test.mjs tests/issue-1083-comfy-mcp-management-adapter.test.mjs tests/issue-1230-full-verification-closeout.test.mjs tests/issue-258-creative-compute-paths.test.mjs tests/issue-929-connected-studios.test.mjs tests/issue-946-comfyui-settings-onboarding.test.mjs tests/issue-961-auto-local-comfyui-sketch.test.mjs tests/issue-972-exhaustive-uat-baseline.test.mjs tests/pi-local-model-exhaustive-uat.test.mjs

      - name: Validate retained ios companion contract contracts
        run: node --test tests/issue-1090-ios-companion.test.mjs

      - name: Validate retained learn agent portraits contracts
        run: node --test tests/issue-1100-learn-agent-portraits.test.mjs

      - name: Validate retained learn validation contracts
        run: node --test tests/issue-1008-windows-verification-resilience.test.mjs tests/issue-1010-community-backdoor-terminal.test.mjs tests/issue-1016-lazy-frames-animatic.test.mjs tests/issue-1031-full-verification-watchdog.test.mjs tests/issue-1044-verification-community-bbs.test.mjs tests/issue-1046-buzz-node-settings-colours.test.mjs tests/issue-1047-release-history.test.mjs tests/issue-1056-lorebound-agent-avatars.test.mjs tests/issue-1066-community-three-column-shell.test.mjs tests/issue-1105-settings-dark-surface-regression.test.mjs tests/issue-1111-settings-unified-workspace.test.mjs tests/issue-1256-navigation-settings-ia.test.mjs tests/issue-1377-unified-ai-compute-settings.test.mjs tests/issue-341-windows-startup-ui-ux.test.mjs tests/issue-594-local-learn-rag-and-brand.test.mjs tests/issue-969-local-backup-trust-docs.test.mjs tests/issue-974-startup-health-contract.test.mjs tests/issues-940-941-community-observable-actions.test.mjs tests/learn-sage-settings-entry.test.mjs tests/startup-agent-skills-contract.test.mjs

      - name: Validate retained local endpoint registry contracts
        run: node --test tests/issue-1108-writer-app-preflight.test.mjs tests/issue-1170-writer-observer-stabilization.test.mjs

      - name: Validate retained managed desktop harness contracts
        run: node --test tests/issue-1075-trusted-node-remote-compute.test.mjs tests/issue-1079-managed-desktop-harness.test.mjs

      - name: Validate retained performance contract contracts
        run: node --test tests/issue-1411-performance-benchmark.test.mjs tests/issue-1612-visual-density-cost.test.mjs tests/issue-1614-process-idle-cost.test.mjs tests/issue-1624-performance-budgets.test.mjs

      - name: Validate retained pi architecture aware engineering contracts
        run: node --test tests/agent-skills-foundation.test.mjs tests/issue-1119-pi-required-worker.test.mjs tests/issue-1185-pi-managed-install.test.mjs tests/issue-1321-pi-architecture-aware-engineering.test.mjs

      - name: Validate retained pi managed install contracts
        run: node --test tests/issue-1185-pi-windows-resolver.test.mjs tests/issue-651-pi-cline-uat-repair.test.mjs

      - name: Validate retained portless adapter proof contracts
        run: node --test tests/issue-1154-local-endpoint-registry-epic-closeout.test.mjs tests/issue-1156-portless-adapter.test.mjs

      - name: Validate retained profile experience contracts
        run: node --test tests/issue-1210-ui-housekeeping.test.mjs tests/issue-1212-profile-buzz-identity.test.mjs tests/issue-1279-official-agents-lore-avatar.test.mjs tests/issue-1404-community-edge-navigation.test.mjs tests/issue-614-startup-health-warning-cleanup.test.mjs tests/windows-native-runtime.test.mjs

      - name: Validate retained resident writer skills contracts
        run: node --test tests/issue-978-resident-writer-specialists.test.mjs

      - name: Validate retained runtime weight inventory contracts
        run: node --test tests/issue-1412-direct-dependency-reachability.test.mjs tests/issue-1626-runtime-weight-inventory.test.mjs tests/issue-1630-release-weight-cut.test.mjs tests/issue-1637-brand-master-weight-cut.test.mjs tests/issue-1639-public-media-subinventory.test.mjs tests/issue-1642-visual-reference-full-cut.test.mjs tests/issue-1654-production-runtime-profile.test.mjs tests/issue-1656-release-script-boundary.test.mjs tests/issue-57-visual-reference-library.test.mjs

      - name: Validate retained story bridge contracts
        run: node --test tests/issue-1422-buzz-story-bridge-hardening.test.mjs tests/issue-1422-buzz-story-bridge-preflight.test.mjs tests/issue-1422-buzz-story-bridge-session-diagnostics.test.mjs tests/issue-1422-buzz-story-bridge.test.mjs

      - name: Validate retained story council contracts
        run: node --test tests/issue-1417-story-council-afterglow.test.mjs tests/issue-1417-story-council-runtime.test.mjs tests/issue-1417-story-council.test.mjs

      - name: Validate retained story decisions contracts
        run: node --test tests/issue-1418-story-decisions-workflow-source.test.mjs tests/issue-1418-story-decisions.test.mjs

      - name: Validate retained story room directory contracts
        run: node --test tests/issue-1444-story-room-listing.test.mjs tests/issue-1464-app-domain-consolidation.test.mjs

      - name: Validate retained story workbench contracts
        run: node --test tests/issue-1419-story-workbench.test.mjs tests/issue-1420-workbench-visual-impact.test.mjs tests/issue-1421-afterglow-convergence.test.mjs tests/issue-1553-autonomous-convergence-restart.test.mjs

      - name: Validate retained web anywhere contracts
        run: node --test tests/issue-1077-web-anywhere.test.mjs

      - name: Validate retained windows local profile bootstrap contracts
        run: node --test tests/issue-1192-windows-local-profile-bootstrap.test.mjs

      - name: Validate retained writer e2e observer contracts
        run: node --test tests/issue-1104-writer-e2e-final-state.test.mjs tests/issue-1110-writer-live-acceptance.test.mjs

      - name: Production web build
        run: npm run build

      - name: Upload PR Gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-${{ github.run_id }}
          path: |
            .artifacts/ben-code-quality
            .artifacts/architecture-health
            .artifacts/uat-focused
          if-no-files-found: warn
          retention-days: 7
