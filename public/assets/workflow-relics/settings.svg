      <stop offset="0" stop-color="#d9fff8"/>
      <stop offset="0.22" stop-color="#6ee8d7"/>
      <stop offset="0.58" stop-color="#238f86"/>
      <stop offset="1" stop-color="#0b3937"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
