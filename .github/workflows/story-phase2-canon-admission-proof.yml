name: STORY Phase 2 Canon Admission Proof

on:
  pull_request:
    paths:
      - 'modules/story-the-unwritten/**'
      - 'tests/issue-1675-story-*.test.mjs'
      - 'lib/projects/persistence/project-revisions.ts'
      - '.github/workflows/story-phase2-canon-admission-proof.yml'

permissions:
  contents: read

jobs:
  canon-admission-proof:
    name: Exact-head STORY canon admission proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Run STORY Phase 2 and PPF authority proofs
        run: node --test tests/issue-1675-story-persistence.test.mjs tests/issue-1675-story-sparse-characters.test.mjs tests/issue-1675-story-history-persistence.test.mjs tests/issue-1675-story-canon-admission.test.mjs tests/issue-964-revision-aware-ppf.test.mjs
