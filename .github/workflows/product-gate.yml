name: Product Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/pi-managed-install.mjs"
      - "scripts/evaluate-pi-087-dsdd-session.mjs"
      - "config/pi-087-dsdd-session-evaluation.json"
      - "config/developer-agent-stack.json"
      - "config/third-party-oss.json"
      - ".pi/npm/package-lock.json"
      - "tests/issue-1185-pi-managed-install.test.mjs"
      - "tests/issue-2338-pi-087-dsdd-session.test.mjs"
      - "build/dsdd/**"
      - "app/skin-v1/global-dsdd-conversation.tsx"
      - "app/_components/voice-input-control.tsx"
      - "Start-PlotPickle.bat"
      - "tests/issue-341-windows-startup-ui-ux.test.mjs"
      - "tests/issue-2341-dsdd-zero-config.test.mjs"

permissions:
  contents: read

concurrency:
  group: product-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-gate:
    name: Product Gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 24.19
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Install PlotPickle dependencies once
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate current Skin V1 startup boundary
        shell: pwsh
        run: node --test tests/issue-341-windows-startup-ui-ux.test.mjs tests/issue-2341-dsdd-zero-config.test.mjs tests/issue-1754-skin-v1-logon.test.mjs tests/issue-1754-startup-no-legacy-flash.test.mjs tests/issue-1788-webmcp-surface-visual-uat.test.mjs tests/issue-1793-startup-webmcp-uat.test.mjs tests/issue-1858-webmcp-repair-handoff.test.mjs tests/issue-1881-visual-compute-harness.test.mjs

      - name: Validate current security closeout
        shell: pwsh
        run: node --test tests/issue-1228-security-closeout.test.mjs tests/issue-1827-codeql-second-pass.test.mjs tests/issue-1833-codeql-data-flow-closeout.test.mjs tests/issue-1837-codeql-zero-closeout.test.mjs tests/issue-1840-codeql-casebook-text-boundary.test.mjs tests/issue-503-windows-mcp-spawn.test.mjs tests/issue-1185-pi-managed-install.test.mjs tests/issue-104-windows-paths.test.mjs tests/issue-483-feedback-studio.test.mjs tests/issue-88-visual-board-navigation.test.mjs

      - name: Evaluate Pi 0.85.1 compatibility
        shell: pwsh
        run: node scripts/evaluate-pi-managed-upgrade.mjs

      - name: Evaluate Pi 0.87 DSDD session compatibility
        shell: pwsh
        run: node scripts/evaluate-pi-087-dsdd-session.mjs

      - name: Validate bundled local video setup
        run: node --test tests/ltx-bundled-default.test.mjs

      - name: Validate local whisper.cpp dictation fixture
        shell: pwsh
        env:
          PLOTPICKLE_HOME: ${{ runner.temp }}\plotpickle-voice
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install-whisper-cpp.ps1 -Mode Smoke -Approved

      - name: Validate focused UAT contracts
        run: node scripts/run-uat-autopilot.mjs --contracts-only --artifact-root .artifacts/uat-focused

      - name: Production web build on Windows
        shell: pwsh
        run: npm run build

      - name: Validate Windows installer source contract
        shell: pwsh
        run: node --test tests/issue-1456-windows-installer.test.mjs
