name: Release 1490 Metadata Sync

on:
  push:
    branches:
      - release/1490-version-whats-new

permissions:
  contents: write

jobs:
  sync-release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1490-version-whats-new
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stop after synchronized release commit
        id: guard
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "chore(release): synchronize version and What's New" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Synchronize release metadata
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const oldVersion = '1.0.0-rc.4.0.1';
          const version = '1.0.0-rc.4.0.2';
          const nextVersion = '1.0.0-rc.4.0.3';

          function replace(path, from, to) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(from)) throw new Error(`${path}: expected text not found: ${from}`);
            fs.writeFileSync(path, source.replace(from, to));
          }

          replace('docs/specification/VERSIONING.md',
            `The current PlotPickle application version is \`${oldVersion}\`. The final numeric identifier is the approved-build number for the \`rc.4.0.x\` line. The next approved build is \`${version}\`.`,
            `The current PlotPickle application version is \`${version}\`. The final numeric identifier is the approved-build number for the \`rc.4.0.x\` line. The next approved build is \`${nextVersion}\`.`);
          replace('public/docs/readme/WRITING-AND-PRODUCTION.md', `Current application version: \`${oldVersion}\``, `Current application version: \`${version}\``);
          replace('templates/github-story-project/plotpickle-project.json', `"createdWith": "PlotPickle ${oldVersion}"`, `"createdWith": "PlotPickle ${version}"`);
          replace('.github/ISSUE_TEMPLATE/bug-report.yml', `placeholder: ${oldVersion} or commit SHA`, `placeholder: ${version} or commit SHA`);

          let versionTest = fs.readFileSync('tests/issue-1396-build-version.test.mjs', 'utf8');
          versionTest = versionTest
            .replace(`assert.equal(packageManifest.version, "${oldVersion}");`, `assert.equal(packageManifest.version, "${version}");`)
            .replace(/next approved build is `1\\\.0\\\.0-rc\\\.4\\\.0\\\.2`/g, 'next approved build is `1\\.0\\.0-rc\\.4\\.0\\.3`')
            .replace(`compareSemanticVersions("${oldVersion}", "1.0.0-rc.3")`, `compareSemanticVersions("${version}", "1.0.0-rc.3")`)
            .replace(`compareSemanticVersions("${oldVersion}", "1.0.0-rc.4")`, `compareSemanticVersions("${version}", "1.0.0-rc.4")`)
            .replace(`compareSemanticVersions("${version}", "${oldVersion}")`, `compareSemanticVersions("${nextVersion}", "${version}")`);
          fs.writeFileSync('tests/issue-1396-build-version.test.mjs', versionTest);

          const historyPath = 'config/release-history.json';
          const history = JSON.parse(fs.readFileSync(historyPath, 'utf8'));
          history.releases = history.releases.filter((entry) => entry.id !== '2026-08-27-story-community-reliability');
          history.releases.unshift({
            id: '2026-08-27-story-community-reliability',
            label: '2026.08.27 · Story Workflow & Community Reliability',
            version,
            date: '2026-08-27',
            title: 'Story collaboration, Human decisions and local-first reliability moved forward together',
            summary: 'PlotPickle now connects more of the story workflow through Community and review surfaces while strengthening local AI readiness and reorganizing runtime ownership without intentionally changing product behavior.',
            added: [
              'Story Rooms gained owner-controlled directory and access-request foundations for private Community collaboration.',
              'Story Council findings can flow into grouped Human Story Decisions and Story Workbench review instead of becoming direct canon changes.',
              'Hardware-aware local AI readiness now gives clearer guidance for supported local providers and optional creative runtimes.'
            ],
            changed: [
              'Local AI, Ollama and ComfyUI setup/recovery paths are more explicit, local-first and easier to diagnose.',
              'Runtime code is being consolidated into bounded AI, BUZZ and project domains to make PlotPickle safer to maintain without redesigning user behavior.',
              'Architecture phases now close only after their full acceptance criteria are satisfied; individual green PRs complete bounded batches, not whole phases.'
            ],
            fixed: [
              'The displayed PlotPickle build and the newest What’s New entry are now kept in sync by deterministic regression coverage.',
              'Architecture sequencing now keeps the real Afterglow convergence proof behind the visual-first phase and multi-Human UAT before final Windows shipping.'
            ],
            references: ['#1415', '#1444', '#1460', '#1490', 'PR #1481–#1489']
          });
          fs.writeFileSync(historyPath, JSON.stringify(history, null, 2) + '\n');

          const panelPath = 'modules/dashboard/ui/release-history/index.tsx';
          let panel = fs.readFileSync(panelPath, 'utf8');
          panel = panel.replace('  date: string;\n  title: string;', '  date: string;\n  version?: string;\n  title: string;');
          panel = panel.replace('<span>{release.label}</span>', '<span>{release.label}{release.version ? ` · v${release.version}` : ""}</span>');
          fs.writeFileSync(panelPath, panel);

          const releaseTestPath = 'tests/issue-1047-release-history.test.mjs';
          let releaseTest = fs.readFileSync(releaseTestPath, 'utf8');
          if (!releaseTest.includes('#1490 newest What\'s New release matches')) {
            releaseTest += `\n\ntest("#1490 newest What's New release matches the canonical application build", async () => {\n  const [history, packageManifest, panel] = await Promise.all([\n    readJson("config/release-history.json"),\n    readJson("package.json"),\n    read("modules/dashboard/ui/release-history/index.tsx"),\n  ]);\n  assert.equal(history.releases[0].version, packageManifest.version);\n  assert.equal(history.releases[0].date, "2026-08-27");\n  assert.match(panel, /release\\.version/);\n});\n`;
          }
          fs.writeFileSync(releaseTestPath, releaseTest);
          NODE
      - name: Commit synchronized release metadata
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/specification/VERSIONING.md public/docs/readme/WRITING-AND-PRODUCTION.md templates/github-story-project/plotpickle-project.json .github/ISSUE_TEMPLATE/bug-report.yml tests/issue-1396-build-version.test.mjs config/release-history.json modules/dashboard/ui/release-history/index.tsx tests/issue-1047-release-history.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): synchronize version and What's New"
          git push origin HEAD:release/1490-version-whats-new
