name: Issue 56 integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-56-purpose-aware-logline-lab
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply integration
        run: python scripts/issue-56-integrate.py
      - name: Install dependencies
        run: npm ci
      - name: Capture validation output
        shell: bash
        run: |
          set +e
          npm run lint > issue-56-validation.log 2>&1
          lint_status=$?
          npm test >> issue-56-validation.log 2>&1
          test_status=$?
          echo "lint_status=$lint_status test_status=$test_status" >> issue-56-validation.log
          if [ "$lint_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then touch issue-56-validation.failed; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-56-validation-log
          path: issue-56-validation.log
      - name: Fail on validation error
        run: test ! -f issue-56-validation.failed
      - name: Commit integration
        shell: bash
        run: |
          rm .github/workflows/issue-56-integrate.yml
          rm scripts/issue-56-integrate.py
          git config user.name "PlotPickle automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate purpose-aware Logline Lab"
          git push origin HEAD:agent/issue-56-purpose-aware-logline-lab
