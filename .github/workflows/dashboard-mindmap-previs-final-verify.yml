name: Dashboard MindMap Previs Final Verification

on:
  push:
    branches:
      - verify-dashboard-label-order-previs-cleanup

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Install
        run: npm ci --include=dev --no-audit --no-fund

      - name: Diff hygiene
        run: git diff --check origin/main...HEAD

      - name: Prepare local main ref for historical verification tests
        run: git branch --force main origin/main

      - name: Focused Dashboard MindMap Previs regressions
        run: >-
          node --test
          tests/issue-2462-dashboard-previs-polish.test.mjs
          tests/layer1-navigation-continuity.test.mjs
          tests/issue-2446-dashboard-sound-selectable.test.mjs
          tests/issue-2454-dashboard-screening-rough-cut.test.mjs
          tests/issue-2448-mindmap-act-workspace.test.mjs
          tests/issue-2420-storyboard-frame-review.test.mjs
          tests/issue-2456-previs-flipbook-act-workspace.test.mjs

      - name: Development convergence
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { changedFilesFromGit, evaluateDevelopmentConvergence } from "./scripts/run-development-convergence.mjs";

          const manifestPath = "config/development-convergence/2462.json";
          const manifest = JSON.parse(await readFile(manifestPath, "utf8"));
          const changedFiles = changedFilesFromGit({ baseRef: "origin/main" })
            .filter((file) => file !== ".github/workflows/dashboard-mindmap-previs-final-verify.yml");
          const report = await evaluateDevelopmentConvergence({
            manifest,
            manifestPath,
            changedFiles,
          });

          console.log(`Development convergence #${report.issue}: ${report.status}`);
          for (const item of report.remaining) console.log(`- ${item}`);
          if (report.status !== "CONVERGED") process.exit(1);
          NODE

      - name: BEN delta
        run: node scripts/run-ben-code-quality.mjs --base-ref origin/main

      - name: Architecture shadow — Experience Skins
        run: >-
          node scripts/verification-shadow.mjs experience-skins
          --base-ref origin/main
          --commit-sha "$(git rev-parse HEAD)"
          --platform linux
          --allow-network false

      - name: Architecture shadow — Experience Contract
        run: >-
          node scripts/verification-shadow.mjs experience-contract
          --base-ref origin/main
          --commit-sha "$(git rev-parse HEAD)"
          --platform linux
          --allow-network false

      - name: Production build
        run: npm run build
