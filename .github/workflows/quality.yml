name: PlotPickle Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: plotpickle-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Verify committed licence and generated navigation
        run: |
          test -f LICENSE
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          grep -q 'id: "overview", code: "OV", label: "Project Overview"' app/page.tsx
          grep -q 'id: "structureMap", code: "ST", label: "Structure Map"' app/page.tsx

      - name: Install dependencies
        run: npm ci

      - name: Validate developer diagnostics registry
        run: npm run diagnostics:validate

      - name: Lint
        run: npm run lint

      - name: Build pull request
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Run focused pull-request tests
        if: github.event_name == 'pull_request'
        env:
          PLOTPICKLE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PLOTPICKLE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run test:changed -- --base "$PLOTPICKLE_BASE_SHA" --head "$PLOTPICKLE_HEAD_SHA"

      - name: Run complete regression after merge or by request
        if: github.event_name != 'pull_request'
        run: npm run test:ci

      - name: Upload developer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-diagnostics-${{ github.sha }}
          path: reports/developer-diagnostics/
          if-no-files-found: ignore
          retention-days: 5
