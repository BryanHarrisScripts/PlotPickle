name: Visual audit capture

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "public/**"
      - "config/ui-ux-screen-registry.json"
      - "config/visual-audit-captures.json"
      - "scripts/visual-audit-capture.mjs"
      - "scripts/visual-audit-supervisor.mjs"
      - "scripts/visual-audit-validate.mjs"
      - "tests/issue-371-visual-audit-capture.test.mjs"
      - "tests/issue-371-visual-audit-retry.test.mjs"
      - ".github/workflows/visual-audit-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-audit-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Full-product visual evidence
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - name: Validate visual capture contracts
        run: node --test tests/issue-371-visual-audit-capture.test.mjs tests/issue-371-visual-audit-retry.test.mjs
      - name: Check visual capture syntax
        run: |
          node --check scripts/visual-audit-capture.mjs
          node --check scripts/visual-audit-supervisor.mjs
          node --check scripts/visual-audit-validate.mjs
      - name: Capture every registered screen with isolated recovery
        shell: pwsh
        env:
          EDGE_PATH: "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"
          PLOTPICKLE_VISUAL_AUDIT_TIMEOUT_MS: "900000"
          PLOTPICKLE_VISUAL_PAGE_TIMEOUT_MS: "45000"
          PLOTPICKLE_VISUAL_MAX_HEIGHT: "20000"
          PLOTPICKLE_VISUAL_BATCH_SIZE: "6"
          PLOTPICKLE_VISUAL_BATCH_RETRY_COUNT: "1"
          PLOTPICKLE_VISUAL_BATCH_RETRY_SETTLE_MS: "8000"
          PLOTPICKLE_VISUAL_RETRY_BATCH_SIZE: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          node scripts/visual-audit-supervisor.mjs . reports/visual-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node scripts/visual-audit-validate.mjs config/visual-audit-captures.json reports/visual-audit/visual-audit-manifest.json
          $initialValidation = $LASTEXITCODE
          if ($initialValidation -eq 0) {
            Write-Host "Initial visual identity validation passed."
            exit 0
          }

          Write-Host "Initial visual identity validation failed. Recapturing each requested screen in its own browser/server batch."
          Remove-Item -Recurse -Force reports/visual-audit -ErrorAction SilentlyContinue
          $env:PLOTPICKLE_VISUAL_BATCH_SIZE = $env:PLOTPICKLE_VISUAL_RETRY_BATCH_SIZE

          node scripts/visual-audit-supervisor.mjs . reports/visual-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node scripts/visual-audit-validate.mjs config/visual-audit-captures.json reports/visual-audit/visual-audit-manifest.json
          exit $LASTEXITCODE
      - name: Verify every screenshot shows its requested screen
        run: node scripts/visual-audit-validate.mjs config/visual-audit-captures.json reports/visual-audit/visual-audit-manifest.json
      - name: Upload complete visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plotpickle-visual-audit-${{ github.sha }}
          path: reports/visual-audit/
          if-no-files-found: error
          retention-days: 5
