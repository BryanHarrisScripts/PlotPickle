<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Multiple PlotPickle servers collaborating through one GitHub repository</title>
<desc id="desc">Four independent PlotPickle local servers use proposal branches and pull requests. The repository owner reviews and merges approved changes into one canonical film project.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28786e"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#214d47" flood-opacity=".14"/></filter></defs>
<rect width="1400" height="820" rx="34" fill="#f1faf8"/>
<image href="../../public/brand/plotpickle-header-horizontal-600.png" x="48" y="38" width="300" height="100" preserveAspectRatio="xMinYMid meet"/>
<text x="700" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#173b37">One film project. Many local PlotPickle servers.</text>
<text x="700" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#53726d">Local edits become isolated proposal branches; only owner-approved pull requests update the canonical .ppf.</text>
<g filter="url(#shadow)">
  <g transform="translate(75 205)"><rect width="270" height="170" rx="22" fill="#fff" stroke="#b7d8d1"/><image href="../../public/brand/favicon/plotpickle-icon-128.png" x="22" y="22" width="62" height="62"/><text x="102" y="50" font-family="Arial" font-size="20" font-weight="700" fill="#214f49">Writer server</text><text x="102" y="76" font-family="Arial" font-size="14" fill="#617d78">Local screenplay edits</text><text x="24" y="119" font-family="Arial" font-size="14" fill="#35736a">plotpickle/writer-scene-18</text><text x="24" y="145" font-family="Arial" font-size="13" fill="#6b847f">Pull request awaiting review</text></g>
  <g transform="translate(75 485)"><rect width="270" height="170" rx="22" fill="#fff" stroke="#b7d8d1"/><image href="../../public/brand/favicon/plotpickle-icon-128.png" x="22" y="22" width="62" height="62"/><text x="102" y="50" font-family="Arial" font-size="20" font-weight="700" fill="#214f49">Actor server</text><text x="102" y="76" font-family="Arial" font-size="14" fill="#617d78">Dialogue and character notes</text><text x="24" y="119" font-family="Arial" font-size="14" fill="#35736a">plotpickle/actor-voice-pass</text><text x="24" y="145" font-family="Arial" font-size="13" fill="#6b847f">Pull request awaiting review</text></g>
  <g transform="translate(1055 205)"><rect width="270" height="170" rx="22" fill="#fff" stroke="#b7d8d1"/><image href="../../public/brand/favicon/plotpickle-icon-128.png" x="22" y="22" width="62" height="62"/><text x="102" y="50" font-family="Arial" font-size="20" font-weight="700" fill="#214f49">Director server</text><text x="102" y="76" font-family="Arial" font-size="14" fill="#617d78">Scene intent and coverage</text><text x="24" y="119" font-family="Arial" font-size="14" fill="#35736a">plotpickle/director-block-12</text><text x="24" y="145" font-family="Arial" font-size="13" fill="#6b847f">Pull request awaiting review</text></g>
  <g transform="translate(1055 485)"><rect width="270" height="170" rx="22" fill="#fff" stroke="#b7d8d1"/><image href="../../public/brand/favicon/plotpickle-icon-128.png" x="22" y="22" width="62" height="62"/><text x="102" y="50" font-family="Arial" font-size="20" font-weight="700" fill="#214f49">Producer server</text><text x="102" y="76" font-family="Arial" font-size="14" fill="#617d78">Breakdowns and schedule</text><text x="24" y="119" font-family="Arial" font-size="14" fill="#35736a">plotpickle/producer-plan</text><text x="24" y="145" font-family="Arial" font-size="13" fill="#6b847f">Pull request awaiting review</text></g>
  <g transform="translate(480 260)"><rect width="440" height="330" rx="28" fill="#fff" stroke="#86bcb1" stroke-width="2"/><image href="../../public/brand/favicon/plotpickle-icon-128.png" x="40" y="38" width="76" height="76"/><text x="138" y="68" font-family="Arial" font-size="24" font-weight="700" fill="#1b514a">GitHub film repository</text><text x="138" y="97" font-family="Arial" font-size="15" fill="#5d7a75">Owner-controlled source of truth</text><rect x="38" y="138" width="364" height="70" rx="14" fill="#eaf7f4"/><text x="56" y="166" font-family="Arial" font-size="15" font-weight="700" fill="#2a625b">main / approved project</text><text x="56" y="190" font-family="monospace" font-size="13" fill="#52726c">stories/film-title.ppf</text><rect x="38" y="226" width="364" height="70" rx="14" fill="#fff7df"/><text x="56" y="254" font-family="Arial" font-size="15" font-weight="700" fill="#725813">Pull-request review queue</text><text x="56" y="278" font-family="Arial" font-size="13" fill="#7d6d40">Compare · discuss · approve · merge or close</text></g>
</g>
<g fill="none" stroke="#28786e" stroke-width="4" marker-end="url(#arrow)"><path d="M345 290 C420 290 410 345 480 345"/><path d="M345 570 C420 570 410 505 480 505"/><path d="M1055 290 C980 290 990 345 920 345"/><path d="M1055 570 C980 570 990 505 920 505"/></g>
<path d="M700 590 L700 690" stroke="#28786e" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="470" y="690" width="460" height="82" rx="20" fill="#dff3ee" stroke="#8fc2b7"/><text x="700" y="724" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#22564f">Repository owner / maintainer decision</text><text x="700" y="751" text-anchor="middle" font-family="Arial" font-size="14" fill="#54756f">Merged work becomes the next canonical version every server can pull.</text>
</svg>
