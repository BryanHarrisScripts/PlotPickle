name: Repair PR 311 eyebrow semantics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/300-native-minimax-h3-comfyui
          fetch-depth: 0
      - name: Use inline semantics for eyebrow label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('app/h3-native-panel.tsx')
          text = component.read_text(encoding='utf-8')
          old = '<p>Local video model</p>'
          new = '<span>Local video model</span>'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one eyebrow paragraph, found {text.count(old)}.')
          component.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/repair-pr-311-eyebrow.yml').unlink()
          PY
          node --test tests/issue-258-creative-compute-paths.test.mjs
      - name: Commit focused eyebrow repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/h3-native-panel.tsx .github/workflows/repair-pr-311-eyebrow.yml
          git commit -m "Use inline semantics for native H3 eyebrow"
          git fetch origin agent/300-native-minimax-h3-comfyui
          git rebase origin/agent/300-native-minimax-h3-comfyui
          git push origin HEAD:agent/300-native-minimax-h3-comfyui
