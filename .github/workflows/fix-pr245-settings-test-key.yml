name: Apply PR 245 stable Settings selector

on:
  push:
    branches:
      - agent/244-buzz-desktop-launcher-install
    paths:
      - .github/workflows/fix-pr245-settings-test-key.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/244-buzz-desktop-launcher-install
          fetch-depth: 0
      - name: Use the stable JSON-backed Settings test key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/windows-release-smoke.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'const button = submenu ? [...submenu.querySelectorAll("button")].find((item) => normalize(item.querySelector("b")?.innerText) === "Repository & Collab") : null;'
          new = 'const button = submenu?.querySelector(\'button[data-ui-copy-key="settings.repository"]\') ?? null;'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one visible-label selector, found {count}.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/fix-pr245-settings-test-key.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/windows-release-smoke.mjs .github/workflows/fix-pr245-settings-test-key.yml
          git commit -m "test: use stable Repository settings key in Windows smoke"
          git push origin HEAD:agent/244-buzz-desktop-launcher-install
