name: Issues 60-62 integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issues-60-62-afterglow-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply integration
        run: python scripts/issues-60-62-integrate.py
      - name: Install dependencies
        run: npm ci
      - name: Capture validation output
        shell: bash
        run: |
          set +e
          npm run lint > issues-60-62-validation.log 2>&1
          lint_status=$?
          npm test >> issues-60-62-validation.log 2>&1
          test_status=$?
          echo "lint_status=$lint_status test_status=$test_status" >> issues-60-62-validation.log
          if [ "$lint_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then touch issues-60-62-validation.failed; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issues-60-62-validation-log
          path: issues-60-62-validation.log
      - name: Fail on validation error
        run: test ! -f issues-60-62-validation.failed
      - name: Commit clean integration
        shell: bash
        run: |
          rm .github/workflows/issues-60-62-integrate.yml
          rm scripts/issues-60-62-integrate.py
          git config user.name "PlotPickle automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Afterglow source, version and rights reconciliation"
          git push origin HEAD:agent/issues-60-62-afterglow-reconciliation
