<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Profile relic</title>
  <desc id="desc">A PlotPickle identity seal with an iron frame, brass filigree and a teal soul gem.</desc>
