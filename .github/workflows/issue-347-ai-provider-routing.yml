name: AI provider routing

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/ai-routing*.tsx"
      - "app/media-routing*.tsx"
      - "app/writing-assistant*.tsx"
      - "build/*ai*.ts"
      - "build/*media*.ts"
      - "build/comfyui-*.ts"
      - "config/*ai*.json"
      - "config/*provider*.json"
      - "tests/issue-347-ai-provider-routing.test.mjs"
      - ".github/workflows/issue-347-ai-provider-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-provider-routing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  routing-contract:
    name: Text image and video routing contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: node --test tests/issue-347-ai-provider-routing.test.mjs
