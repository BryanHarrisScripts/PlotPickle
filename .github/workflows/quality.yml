name: PlotPickle Quality

# CI refresh: force a clean workflow run after Actions availability was restored.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply Phase 3 integration patch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/phase-3-git-native-project-sync' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          collaboration = Path("app/github-collaboration.tsx")
          source = collaboration.read_text()
          import_line = 'import GitHubAppConnection, { type GitHubAppConnectedRepository } from "./github-app-connection";'
          if 'import GitHubProjectSync from "./github-project-sync";' not in source:
              if import_line not in source:
                  raise SystemExit("GitHub collaboration import anchor was not found")
              source = source.replace(import_line, import_line + '\nimport GitHubProjectSync from "./github-project-sync";', 1)
          marker = '''      <div className={styles.grid}>
        <section className={styles.panel}>
          <header><div><p>Approved version</p>'''
          insertion = '''      <GitHubProjectSync
        project={project}
        onChange={onChange}
        ready={status.ready}
        onNotice={setNotice}
      />

      <div className={styles.grid}>
        <section className={styles.panel}>
          <header><div><p>Approved version</p>'''
          if '<GitHubProjectSync' not in source:
              if marker not in source:
                  raise SystemExit("GitHub collaboration workspace anchor was not found")
              source = source.replace(marker, insertion, 1)
          collaboration.write_text(source)

          component = Path("app/github-project-sync.tsx")
          source = component.read_text()
          source = source.replace('preview.changedPaths.length', 'preview.diff.changedPaths.length')
          source = source.replace('preview.changedPaths.slice', 'preview.diff.changedPaths.slice')
          component.write_text(source)
          PY
          git config user.name "PlotPickle Build"
          git config user.email "actions@users.noreply.github.com"
          git add app/github-collaboration.tsx app/github-project-sync.tsx
          git diff --cached --quiet || git commit -m "Integrate canonical project sync workspace"
          git push origin HEAD:${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Verify committed licence and generated navigation
        run: |
          test -f LICENSE
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          grep -q 'id: "overview", code: "OV", label: "Project Overview"' app/page.tsx
          grep -q 'id: "structureMap", code: "ST", label: "Structure Map"' app/page.tsx

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and smoke test
        run: npm test
