name: Issue 113 integration patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Apply live integration
        run: python scripts/apply-issue-113.py
      - name: Validate targeted contracts
        run: |
          npm ci --silent
          npm run test:dashboard-command-centre
          npm run lint
      - name: Commit integration when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Issue #113 integration already present."
            exit 0
          fi
          git config user.name "PlotPickle Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/settings-panel.tsx lib/dashboard-command-centre.ts tests/proposed-primary-menu.test.mjs
          git commit -m "[issue-113-apply] Wire dashboard command centre"
          git push origin HEAD:${GITHUB_HEAD_REF}
