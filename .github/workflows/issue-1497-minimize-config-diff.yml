name: Issue 1497 Minimize Architecture Diff

on:
  push:
    branches:
      - architecture/1497-story-bridge-module

permissions:
  contents: write

jobs:
  minimize-config-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/1497-story-bridge-module
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Restore compact architecture contract formatting
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:config/repository-architecture-target.json > /tmp/architecture-target.json
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/architecture-target.json')
          text = path.read_text(encoding='utf-8')
          old = '    {"id":"phase2-modules-story-bridge","phase":2,"domain":"story","sourceRoot":"modules/story-workflow","targetRoot":"modules/story-workflow/bridge","directFilesOnly":true,"selector":{"files":["buzz-story-bridge.ts"]}},'
          new = '    {"id":"phase2-modules-story-bridge","phase":2,"domain":"story","sourceRoot":"modules/story-workflow","targetRoot":"modules/story-workflow/bridge","directFilesOnly":true,"selector":{"files":["buzz-story-bridge.ts"]},"status":"completed","completedAt":"2026-08-27","completedSources":["modules/story-workflow/buzz-story-bridge.ts"],"completedTargets":["modules/story-workflow/bridge/buzz-story-bridge.ts"]},'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one Story Bridge batch line, found {text.count(old)}')
          Path('config/repository-architecture-target.json').write_text(text.replace(old, new), encoding='utf-8')
          PY

          node --test \
            tests/issue-1461-repository-architecture-inventory.test.mjs \
            tests/issue-1497-story-bridge-module-move.test.mjs
          git diff --check
          git rm .github/workflows/issue-1497-minimize-config-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/repository-architecture-target.json
          git commit -m "chore(#1497): keep architecture completion diff minimal"
          git push origin HEAD:architecture/1497-story-bridge-module
