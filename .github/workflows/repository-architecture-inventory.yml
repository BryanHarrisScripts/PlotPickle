name: Repository Architecture Inventory

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate repository inventory and target architecture
        run: node --test tests/issue-1461-repository-architecture-inventory.test.mjs
      - name: Preserve existing architecture health boundaries
        run: node --test tests/issue-1220-architecture-health.test.mjs
      - name: Generate architecture inventory evidence
        run: node scripts/repository-architecture-inventory.mjs
      - name: Production build
        run: npm run build
      - name: Upload architecture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-architecture-${{ github.run_id }}
          path: .artifacts/repository-architecture
          if-no-files-found: warn
          retention-days: 5
