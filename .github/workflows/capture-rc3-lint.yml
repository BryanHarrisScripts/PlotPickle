name: Temporary RC3 Lint Capture

on:
  push:
    branches:
      - agent/story-tools-reports-readme-tabs
    paths:
      - RC3-LINT-DIAGNOSTIC.txt

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-tools-reports-readme-tabs
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - name: Capture lint output
        shell: bash
        run: |
          set +e
          npm run lint > docs/rc3-lint.log 2>&1
          code=$?
          echo "$code" > docs/rc3-lint.exit
          exit 0
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "PlotPickle Diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add docs/rc3-lint.log docs/rc3-lint.exit
          git commit -m "Capture RC3 lint diagnostics"
          git push origin HEAD:agent/story-tools-reports-readme-tabs
