name: Runtime Weight Inventory

on:
  pull_request:
    paths:
      - "config/runtime-weight-inventory.json"
      - "docs/architecture/six-domain-ownership.md"
      - "scripts/package-platform.mjs"
      - "scripts/package-smoke.mjs"
      - "scripts/runtime-weight/**"
      - "scripts/windows-runtime.mjs"
      - "Start-PlotPickle.bat"
      - "package.json"
      - "package-lock.json"
      - "tests/issue-1626-runtime-weight-inventory.test.mjs"
      - "tests/issue-1630-release-weight-cut.test.mjs"
      - "tests/issue-1637-brand-master-weight-cut.test.mjs"
      - ".github/workflows/runtime-weight-inventory.yml"
  workflow_dispatch:

concurrency:
  group: runtime-weight-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate runtime-weight inventory contracts
        run: node --test tests/issue-1626-runtime-weight-inventory.test.mjs tests/issue-1630-release-weight-cut.test.mjs tests/issue-1637-brand-master-weight-cut.test.mjs
      - name: Emit exact-head machine-readable inventory
        run: node scripts/runtime-weight/inventory.mjs --output .artifacts/runtime-weight/inventory.json
      - name: Stage representative base release
        run: node scripts/package-platform.mjs linux
      - name: Validate representative base release
        run: node scripts/package-smoke.mjs releases/stage/PlotPickle-Linux
      - name: Validate production build
        run: npm run build
      - name: Upload inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-weight-inventory
          path: .artifacts/runtime-weight/inventory.json
          if-no-files-found: error
