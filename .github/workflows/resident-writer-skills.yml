name: Resident Writer Skills

on:
  pull_request:
    branches: [main]
    paths:
      - ".agents/skills/writer-in-residence/**"
      - "config/resident-writer-specialists.json"
      - "config/agent-skill-trust.json"
      - "scripts/resident-writer-specialists.mjs"
      - "scripts/agent-skill-trust.mjs"
      - "tests/issue-978-resident-writer-specialists.test.mjs"
      - "tests/issue-976-agent-skill-trust*.test.mjs"
      - "docs/resident-writer-specialists.md"
      - ".github/workflows/resident-writer-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resident-writer-skills-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Trusted package and on-demand specialists
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Re-hash and validate Agent Skill trust
        run: node scripts/agent-skill-trust.mjs

      - name: Validate Resident Writer specialist package
        run: node scripts/resident-writer-specialists.mjs

      - name: Execute Resident Writer specialist regressions
        run: node --test tests/issue-978-resident-writer-specialists.test.mjs

      - name: Recheck Skill supply-chain quarantine
        run: node --test tests/issue-976-agent-skill-trust-runtime.test.mjs tests/issue-976-agent-skill-trust.test.mjs
