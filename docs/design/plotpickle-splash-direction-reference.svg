<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">PlotPickle approved splash direction</title>
<desc id="desc">Matte-black typewriter-led PlotPickle splash concept showing screenplay, character, storyworld and storyboard as one connected visual-writing system.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070707"/><stop offset="1" stop-color="#0d0c0a"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#191815"/><stop offset="1" stop-color="#0f0f0e"/></linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d3a15d"/><stop offset="1" stop-color="#b98745"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".55"/></filter>
  <style>
    .type{font-family:'Courier New',monospace}.ivory{fill:#ece7dc}.soft{fill:#c8c0b2}.muted{fill:#8f887d}.amber{fill:#d3a15d}.line{stroke:#34302a;stroke-width:1}.panel{fill:url(#panel);stroke:#34302a;stroke-width:1}.tiny{font-size:12px;letter-spacing:1px}.small{font-size:16px}.body{font-size:19px}.head{font-size:70px;font-weight:400;letter-spacing:3px}.cardhead{font-size:15px;letter-spacing:1.5px;text-transform:uppercase}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g class="type">
  <text x="48" y="48" class="ivory" font-size="28">PlotPickle</text>
  <g class="soft tiny" text-anchor="middle"><text x="920" y="43">LEARN</text><text x="1030" y="43">PLAN</text><text x="1150" y="43">STORYBOARD</text><text x="1280" y="43">WRITE</text><text x="1425" y="43">GRAPHIC NOVEL</text></g>
  <path d="M48 68H1552" class="line"/>
  <text x="48" y="160" class="ivory head">Storytelling</text><text x="48" y="235" class="ivory head">Has Changed.</text>
  <text x="48" y="288" class="soft body">Write the narrative. Shape the vision.</text>
  <text x="48" y="321" class="soft body">Build worlds, characters, and story through</text><text x="48" y="350" class="soft body">a connected visual writing workflow.</text>
  <path d="M48 385H112" stroke="#b98745" stroke-width="3"/>
  <text x="48" y="428" class="muted small">PlotPickle moves writers and artists beyond the traditional page</text>
  <text x="48" y="454" class="muted small">into a director-led model of story creation — narrative, world,</text>
  <text x="48" y="480" class="muted small">character, scene, storyboard and visual canon in one system.</text>
  <rect x="48" y="520" width="250" height="56" rx="3" fill="url(#amber)"/><text x="173" y="554" text-anchor="middle" fill="#17120c" font-size="16" font-weight="700">ENTER THE PLAYHOUSE</text>
  <rect x="318" y="520" width="250" height="56" rx="3" fill="none" stroke="#625b50"/><text x="443" y="554" text-anchor="middle" class="soft" font-size="15">EXPLORE THE WORKFLOW</text>

  <g filter="url(#shadow)">
    <rect x="650" y="110" width="360" height="345" rx="10" class="panel"/><text x="670" y="140" class="soft cardhead">SCRIPT</text><path d="M650 152H1010" class="line"/>
    <g class="soft tiny"><text x="690" y="185">1   EXT. COASTAL CLIFF — DAWN</text><text x="690" y="220">2   Waves crash below. Wind moves</text><text x="690" y="241">3   through the grass.</text><text x="690" y="279">4   A figure stands at the edge,</text><text x="690" y="300">5   looking across a distant kingdom.</text><text x="830" y="340" text-anchor="middle" class="ivory">ARIA</text><text x="740" y="368">Everything we know is on the</text><text x="740" y="389">other side of the fall.</text></g>

    <rect x="1025" y="90" width="260" height="278" rx="10" class="panel"/><text x="1043" y="120" class="soft cardhead">CHARACTER</text><path d="M1025 132H1285" class="line"/>
    <rect x="1043" y="150" width="112" height="155" fill="#211e1a"/><ellipse cx="1099" cy="205" rx="34" ry="43" fill="#6e6255"/><path d="M1066 197Q1072 149 1105 157Q1145 163 1132 215Q1120 184 1087 175Q1077 188 1066 197Z" fill="#171615"/><path d="M1060 305Q1072 250 1101 249Q1130 251 1142 305Z" fill="#36302a"/>
    <text x="1172" y="165" class="ivory small">ARIA</text><g class="muted tiny"><text x="1172" y="189">Protagonist</text><text x="1172" y="218">Explorer · 27</text><text x="1172" y="246">Determined</text><text x="1172" y="266">Intuitive</text><text x="1172" y="286">Leadership</text></g>

    <rect x="1300" y="120" width="260" height="310" rx="10" class="panel"/><text x="1318" y="150" class="soft cardhead">LOCATION / WORLD</text><path d="M1300 162H1560" class="line"/>
    <rect x="1318" y="180" width="224" height="150" fill="#27251f"/><path d="M1318 304L1360 266L1392 278L1430 221L1462 250L1496 205L1542 304Z" fill="#544b3e"/><path d="M1398 273V212H1420V273M1462 263V190H1482V263M1504 280V228H1518V280" fill="#171716"/><circle cx="1505" cy="205" r="38" fill="#b98745" opacity=".28"/>
    <text x="1318" y="356" class="ivory small">THE FALLEN KINGDOM</text><text x="1318" y="380" class="muted tiny">Ancient · mysterious · monumental</text>

    <rect x="820" y="405" width="665" height="195" rx="10" class="panel"/><text x="838" y="435" class="soft cardhead">STORYBOARD</text><path d="M820 447H1485" class="line"/>
    <g>
      <rect x="838" y="465" width="145" height="87" fill="#292722"/><path d="M838 538L880 510L915 522L955 485L983 538Z" fill="#61584b"/><circle cx="876" cy="500" r="8" fill="#151515"/>
      <rect x="994" y="465" width="145" height="87" fill="#302d28"/><ellipse cx="1066" cy="508" rx="30" ry="34" fill="#70665b"/><path d="M1036 498Q1044 465 1070 472Q1099 476 1092 518Q1076 490 1052 483Z" fill="#171615"/>
      <rect x="1150" y="465" width="145" height="87" fill="#292722"/><path d="M1150 538L1190 518L1225 526L1260 482L1295 538Z" fill="#5f5548"/><path d="M1233 522V487H1247V522M1264 530V500H1275V530" fill="#151515"/>
      <rect x="1306" y="465" width="160" height="87" fill="#292722"/><path d="M1306 538L1350 505L1390 520L1430 490L1466 538Z" fill="#5c5348"/><circle cx="1370" cy="508" r="7" fill="#151515"/><circle cx="1390" cy="512" r="6" fill="#151515"/>
    </g>
    <g class="muted tiny"><text x="838" y="577">17A · ESTABLISH</text><text x="994" y="577">17B · CHARACTER</text><text x="1150" y="577">17C · REVEAL</text><text x="1306" y="577">17D · DIRECTION</text></g>
  </g>

  <path d="M48 640H1552" class="line"/>
  <text x="800" y="687" text-anchor="middle" class="soft" font-size="24">“ The writer is no longer only writing the story —</text><text x="800" y="720" text-anchor="middle" class="amber" font-size="24">they are directing the storyworld. ”</text>

  <g transform="translate(48 760)">
    <g><rect width="285" height="105" fill="#0d0d0c" stroke="#34302a"/><text x="18" y="28" class="amber tiny">01</text><text x="18" y="55" class="ivory cardhead">NARRATIVE FIRST</text><text x="18" y="80" class="muted tiny">Story remains the creative core.</text></g>
    <g transform="translate(300)"><rect width="285" height="105" fill="#0d0d0c" stroke="#34302a"/><text x="18" y="28" class="amber tiny">02</text><text x="18" y="55" class="ivory cardhead">WORLD &amp; CHARACTER VISION</text><text x="18" y="80" class="muted tiny">See people and places with intent.</text></g>
    <g transform="translate(600)"><rect width="285" height="105" fill="#0d0d0c" stroke="#34302a"/><text x="18" y="28" class="amber tiny">03</text><text x="18" y="55" class="ivory cardhead">STORYBOARD THINKING</text><text x="18" y="80" class="muted tiny">Explore scene and sequence visually.</text></g>
    <g transform="translate(900)"><rect width="285" height="105" fill="#0d0d0c" stroke="#34302a"/><text x="18" y="28" class="amber tiny">04</text><text x="18" y="55" class="ivory cardhead">HUMAN-LED DIRECTION</text><text x="18" y="80" class="muted tiny">AI explores. The creator decides.</text></g>
    <g transform="translate(1200)"><rect width="304" height="105" fill="#0d0d0c" stroke="#34302a"/><text x="18" y="28" class="amber tiny">05</text><text x="18" y="55" class="ivory cardhead">VISUAL CANON</text><text x="18" y="80" class="muted tiny">Approve and reuse storyworld facts.</text></g>
  </g>
</g>
</svg>