name: UI/UX common overlays

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/common-overlay-layer.tsx"
      - "app/common-overlay-layer.module.css"
      - "app/layout.tsx"
      - "config/overlay-confirmation-inventory.json"
      - "config/ui-ux-screen-registry.json"
      - "docs/COMMON-OVERLAYS-AND-FEEDBACK.md"
      - "tests/issue-349-common-overlays-ux.test.mjs"
      - ".github/workflows/ui-ux-common-overlays.yml"
      - "app/**/*.ts"
      - "app/**/*.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-ux-common-overlays-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  common-overlays-contract:
    name: Common overlays UX contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: node --test tests/issue-349-common-overlays-ux.test.mjs tests/issue-337-ui-ux-consistency-foundation.test.mjs
      - run: node --check tests/issue-349-common-overlays-ux.test.mjs
