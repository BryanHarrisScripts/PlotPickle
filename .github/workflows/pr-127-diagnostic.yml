name: PR 127 Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run concise test diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch fix-112-post-merge-recovery https://github.com/BryanHarrisScripts/PlotPickle.git repo
          cd repo
          npm ci --silent >/dev/null 2>&1
          if npm test > /tmp/plotpickle-test.log 2>&1; then
            echo "All PlotPickle tests passed."
          else
            echo "::error title=PlotPickle test failure::Concise failure excerpt follows"
            grep -E 'not ok|failureType|error:|code:|ERR_|AssertionError|actual:|expected:|stack:|test at' /tmp/plotpickle-test.log | tail -n 100 || true
            exit 1
          fi
