name: Issue 1502 BUZZ Story Core Move

on:
  push:
    branches:
      - architecture/1502-buzz-story-core
    paths:
      - ".github/workflows/issue-1502-buzz-story-core-move.yml"
      - ".github/scripts/issue-1502-buzz-story-core-move.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-buzz-story-core-move:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/1502-buzz-story-core
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - run: npm ci --include=dev --no-audit --no-fund

      - name: Apply ratified BUZZ Story Bridge core move
        run: python .github/scripts/issue-1502-buzz-story-core-move.py

      - name: Focused regression gate
        run: node --test tests/issue-1422-buzz-story-bridge.test.mjs tests/issue-1422-buzz-story-bridge-hardening.test.mjs tests/issue-1461-repository-architecture-inventory.test.mjs tests/issue-1502-buzz-story-core-move.test.mjs

      - name: Diff hygiene
        run: git diff --check

      - name: Commit permanent move and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-1502-buzz-story-core-move.yml .github/scripts/issue-1502-buzz-story-core-move.py
          git add -A
          git commit -m "refactor(#1502): move BUZZ Story Bridge core to owned domain"
          git push origin HEAD:architecture/1502-buzz-story-core
