name: Autonomous Story Reference

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-story-reference.yml'
      - 'scripts/creative-uat/autonomous/**'
      - 'scripts/creative-uat/mcp-runtime.mjs'
      - 'scripts/creative-uat/render-readiness.mjs'
      - 'app/profile-access/**'
      - 'app/api/auth/profile/**'
      - 'core/auth/autonomous-guest/**'
      - 'core/storage/profile-private-browser.ts'
      - 'modules/library/**'
      - 'lib/verification/autonomous-story-routes.mjs'
      - 'config/uat-autopilot-registry.json'
      - 'tests/issue-1553-**'
  workflow_dispatch:
  workflow_call:
    inputs:
      exact_head:
        description: Optional exact commit SHA supplied by a bounded caller.
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: autonomous-story-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  afterglow-reference:
    name: afterglow-reference
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout bounded caller head
        if: ${{ inputs.exact_head != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_head }}
      - name: Checkout exact head
        if: ${{ inputs.exact_head == '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate reference bootstrap contract
        run: node --test tests/issue-1553-afterglow-reference-bootstrap.test.mjs tests/issue-1553-autonomous-guest-authority.test.mjs tests/issue-1553-application-lifecycle.test.mjs tests/issue-1553-application-lifecycle-doc.test.mjs
      - name: Run autonomous Afterglow reference
        env:
          FORCE_COLOR: '0'
          PLOTPICKLE_ACCEPTANCE_MODE: '1'
        run: node scripts/creative-uat/autonomous/run-autonomous-story-reference.mjs --artifact-root "$RUNNER_TEMP/plotpickle-autonomous-story-reference"
      - name: Upload bounded reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-story-reference-${{ github.run_id }}
          path: ${{ runner.temp }}/plotpickle-autonomous-story-reference
          if-no-files-found: warn
          retention-days: 5
