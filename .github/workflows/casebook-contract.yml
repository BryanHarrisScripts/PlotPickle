name: PlotPickle Casebook Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "config/casebook/**"
      - "scripts/casebook-contract.mjs"
      - "scripts/run-casebook-adequacy.mjs"
      - "scripts/semantic-execution.mjs"
      - "tests/issue-1234-casebook-contract.test.mjs"
      - ".github/workflows/casebook-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casebook-contract-${{ github.event.pull_request.number || github.ref }}-${{ matrix.os }}
  cancel-in-progress: true

jobs:
  casebook-contract:
    name: Casebook + Semantic Execution + build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify Casebook contract and Semantic Execution authority
        run: node --test tests/issue-1234-casebook-contract.test.mjs tests/issue-1218-semantic-execution-contract.test.mjs

      - name: Generate baseline adequacy report
        run: node scripts/run-casebook-adequacy.mjs --output-dir reports/casebook-ci

      - name: Production build
        run: npm run build
