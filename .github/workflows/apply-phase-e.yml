name: Apply Phase E page to production

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-e-page-to-production-017
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply permanent Phase E integration
        run: python scripts/apply-phase-e.py
      - name: Remove one-time integration helpers
        run: rm -f scripts/apply-phase-e.py .github/workflows/apply-phase-e.yml
      - name: Commit permanent Phase E candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate PlotPickle 0.17 page-to-production workflows"
          git push origin HEAD:agent/phase-e-page-to-production-017
      - name: Install dependencies
        run: npm ci
      - name: Validate Phase E candidate
        run: |
          npm run lint
          npm test
