name: Architecture Verification

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - tests/issue-2698-windows-startup-proof.mjs
      - config/development-convergence/2698.json
      - .github/workflows/architecture-shadow.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-verification:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: experience-skins
            name: Layer 1 Experience Skins
            allow_network: true
          - id: experience-contract
            name: Layer 2 Experience Contract
            allow_network: false
          - id: production-harness
            name: Layer 3 Production Orchestration
            allow_network: false
          - id: agent-runtime
            name: Layer 4 Agent & Skill Mesh
            allow_network: false
          - id: story-canon
            name: Layer 5 Story / Canon / Evidence
            allow_network: false
          - id: provider-runtime
            name: Layer 6 Provider Runtime
            allow_network: false
          - id: verification
            name: Layer 7 Validation & Operations
            allow_network: false

    steps:
      - name: Checkout exact head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore main reference for legacy convergence checks
        run: git update-ref refs/heads/main refs/remotes/origin/main

      - name: Use Node.js 26.12
        uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
          cache: npm

      - name: Run BEN deterministic AI-slop/code-quality delta
        if: matrix.id == 'verification'
        run: >-
          node scripts/run-ben-code-quality.mjs
          --base-ref "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}"

      - name: Install locked compiler and executable contract dependencies
        if: matrix.id == 'experience-contract' || matrix.id == 'story-canon' || matrix.id == 'agent-runtime' || matrix.id == 'provider-runtime' || matrix.id == 'production-harness'
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund

      - name: Run architecture verification
        run: >-
          node scripts/verification-shadow.mjs "${{ matrix.id }}"
          --base-ref "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}"
          --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --platform linux
          --allow-network "${{ matrix.allow_network }}"

      - name: Prove changed screenplay conversion in the existing PR gate
        if: matrix.id == 'story-canon'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(lib/projects/screenplay/|modules/library/import/rich-ppf-to-library-project\\.ts$|build/library-ppf-import-gateway\\.ts$|tests/issue-(2948-library-fdx-conversion|2954-fdx-title-identity)\\.test\\.mjs$)'; then
            node --test tests/issue-2948-library-fdx-conversion.test.mjs tests/issue-2954-fdx-title-identity.test.mjs
            npm run build
          else
            echo 'No impacted screenplay converter files; skipping installed conversion and build proof.'
          fi

      - name: Prove changed in-Matrix Write build in the existing PR gate
        if: matrix.id == 'story-canon'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(modules/write/(model/|ui/block-native-write-workspace\.tsx$)|app/skin-v1/(dashboard-menu-registry|dashboard-bbs-review-host)\.tsx?$|tests/issue-2953-write-matrix-continuity\.test\.mjs$)'; then
            node --test tests/issue-2953-write-matrix-continuity.test.mjs
            npm run build
          else
            echo 'No changed Matrix Write implementation; skipping focused build.'
          fi

      - name: Prove first-image reject/revise/regenerate truth and build
        if: matrix.id == 'story-canon'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(modules/visual/model/block-visual-candidates\.|app/skin-v1/block-visual-journey-workspace\.|core/project/apply-command\.ts$|tests/issue-2957-first-image-review-retry\.test\.mjs$)'; then
            node --test tests/issue-2957-first-image-review-retry.test.mjs tests/issue-2360-block-visual-journey.test.mjs
            npm run build
          else
            echo 'No changed first-image review files; skipping focused image review and build proof.'
          fi

      - name: Prove Sage malformed-key safety and installed build
        if: matrix.id == 'story-canon'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(app/global-sage-overlay\.tsx$|modules/creative-room/sage-keyboard-shortcut\.|tests/issue-2959-sage-shortcut-guard\.test\.mjs$)'; then
            node --test tests/issue-2959-sage-shortcut-guard.test.mjs
            npm run build
          else
            echo 'No changed Sage keyboard logic; skipping focused keyboard proof and build.'
          fi

      - name: Verify development convergence
        if: matrix.id == 'verification'
        run: >-
          node scripts/run-development-convergence.mjs --changed
          --base-ref "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}"

      - name: Upload architecture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-${{ matrix.id }}-${{ github.run_id }}
          path: |
            .artifacts/verification-shadow/${{ matrix.id }}.json
            .artifacts/verification-shadow/${{ matrix.id }}.summary.json
            .artifacts/verification-shadow/${{ matrix.id }}.comparison.json
            .artifacts/verification-shadow/test-truth-admission.json
            .artifacts/ben-code-quality/
            .artifacts/development-convergence/
            .artifacts/verification-live/webmcp-live.json
            .artifacts/verification-live/webmcp-app-server.log
            .artifacts/webmcp-startup/summary.json
            .artifacts/webmcp-startup/uat-findings.json
            .artifacts/webmcp-acceptance/**/*.json
            .artifacts/visual-readiness/*.png
            .artifacts/visual-readiness/visual-director-report.json
          if-no-files-found: warn
          retention-days: 7

  windows-product-scope:
    name: Detect impact-selected Windows product lanes
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.scope.outputs.command }}
      pi: ${{ steps.scope.outputs.pi }}
      story: ${{ steps.scope.outputs.story }}
      media: ${{ steps.scope.outputs.media }}
      voice: ${{ steps.scope.outputs.voice }}
      build: ${{ steps.scope.outputs.build }}
      verifier: ${{ steps.scope.outputs.verifier }}
      supervisor: ${{ steps.scope.outputs.supervisor }}
      any: ${{ steps.scope.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf 'Changed files:\n%s\n' "$changed"

          command=false
          pi=false
          story=false
          media=false
          voice=false
          build=false
          verifier=false
          supervisor=false

          # Workflow/test/documentation edits are validated by focused Linux contracts below.
          # Heavy Windows lanes are selected only by product/runtime paths they actually prove.
          if printf '%s\n' "$changed" | grep -Eq '^(app/_components/settings/command-review-panel\.tsx$|app/skin-v1/global-dsdd-conversation(\.module\.css|\.tsx)$|build/dsdd/(dsdd-pi-session|dsdd-session-gateway|hunk-review-controller)\.(mjs|ts)$|build/dsdd/hunk-review-gateway\.ts$|build/openpencil/|designs/openpencil/|scripts/settings-command-product-proof\.mjs$|scripts/pi/hunk-review-terminal\.ps1$|tools/hunk-review/|tests/issue-(2717-(settings-command|command-gateway)|2780-openpencil-command-mcp|2782-openpencil-profile-startup|2787-openpencil-gui-review)\.test\.mjs$)'; then command=true; fi
          if printf '%s\n' "$changed" | grep -Eq '^(scripts/(pi-managed-install|pi-durable-managed-install|pi-worker-runtime|pi-version|evaluate-pi-087-dsdd-session|evaluate-pi-099-compatibility|evaluate-pi-durable-adapter|dsdd-pi-session|dsdd-pi-draft|run-uat-repair-agent|setup-developer-agent-stack)\.mjs$|scripts/pi/|config/(pi-087-dsdd-session-evaluation|pi-099-compatibility|pi-101-compatibility|pi-130-compatibility|pi-durable-adapter|pi-tool-exposure-policy|pi-codemode-policy|developer-agent-stack)\.json$|core/sidecars/(durable-execution-contract|pi-durable-adapter)\.mjs$|scripts/sidecars/pi-durable-service\.mjs$|tests/issue-(2338|2590|2591|2592|2593|2594|2672|2696|3159)-|lib/agents/(developer-tool-authorization|pi-codemode-governance|pi-nested-call-evidence|agent-runtime-vocabulary)\.mjs$|\.pi/(managed/|npm/|settings\.json$|extensions/))'; then pi=true; fi
          if printf '%s\n' "$changed" | grep -Eq '^(build/projects/outline-task-[^/]+\.ts$|app/api/outline/tasks/route\.ts$|modules/plan/assessments/outline-task-browser\.ts$|app/skin-v1/story-card-foundation-board\.tsx$|build/mastra-agent-runtime\.ts$|modules/plan/outline-agent-assessment\.ts$|scripts/pi/durable/|core/sidecars/tasks/|tests/issue-(2709|2711)-|tests/issue-outline-agent-assessment\.test\.mjs$|tests/issue-2440-story-architect-structured-execution\.test\.mjs$)'; then story=true; fi
          if printf '%s\n' "$changed" | grep -Eq '^(tools/fframes-bridge/|core/media/fframes-local-media-engine\.ts$|scripts/fframes-product-proof\.mjs$|tests/issue-2663-fframes-media-engine\.test\.mjs$|tests/ltx-bundled-default\.test\.mjs$|config/verification/fframes-maintenance-[^/]+\.json$|lib/verification/oss-radar/dependency-graphs/fframes-maintenance\.mjs$|tests/issue-3026-fframes-rust-maintenance\.test\.mjs$|scripts/media/fframes-candidate-resolution\.mjs$|scripts/media/fframes-lru-transition-probe\.mjs$|config/verification/fframes-upgrade-candidates-[^/]+\.json$)'; then media=true; fi
          if printf '%s\n' "$changed" | grep -Eq '^(Start-PlotPickle\.bat$|scripts/install-whisper-cpp\.ps1$|config/local-voice-input\.json$|build/voice/|runtime/whisper/|tests/issue-(1910|2341|2350)-)'; then voice=true; fi
          if printf '%s\n' "$changed" | grep -Eq '^(app/layout\.tsx$|modules/library/afterglow-image-review\.mjs$|tests/issue-2863-current-master-image-recovery\.test\.mjs$|modules/library/ui/afterglow-management-panel(\.module\.css|\.tsx)$|app/_components/preproduction/storyboard-locked-shot-handoff\.tsx$|app/_components/previs/previs-(readiness-workspace\.tsx|graphic-novel-presentation\.ts)$|app/_components/timeline/timeline-assembly-workspace\.tsx$|app/api/previs/narration/route\.ts$|core/media/previs-narration\.mjs$|app/reports/|app/_components/settings/|app/skin-v1/(story-mode-host|local-ai-skin-host|cloud-story-mode-host|hybrid-story-mode-panel|story-mode-capability-connections|compute-ready-marker|capability-diagnostics-log|local-comfyui-api-video-setup|local-comfyui-panel|provider-consent-setup|settings-workspace-panel|factory-supervisor-panel|settings-review-system-panel|uat-guide-panel)(\.module\.css|\.tsx)$|app/skin-v1-standard-surface-shell\.css$|app/api/cloud-story-mode/provider/route\.ts$|core/contracts/compute/capability-routes\.mjs$|build/ai/capabilities/capability-(routing-state|diagnostics)\.ts$|build/ai-routing-gateway\.ts$|tests/issue-2841-capability-harness\.test\.mjs$|scripts/developer-diagnostics/product-proof/2841-capability-settings\.mjs$|build/provider-url\.ts$|build/media-provider-common\.ts$|package(-lock)?\.json$|next\.config\.ts$|vite\.config\.ts$|scripts/windows-runtime\.mjs$|scripts/build-verified\.mjs$|build/local-profile-auth-gateway\.ts$|core/storage/profile-private-browser\.ts$|tests/issue-2821-save-session-continuity\.test\.mjs$|tests/issue-2839-storyboard-text-narration\.test\.mjs$|tests/issue-2847-process-restart\.test\.mjs$|lib/verification/oss-radar/|config/oss-radar/|Start-PlotPickle\.(bat|command)$|start-plotpickle\.sh$|tests/issue-1456-windows-installer\.test\.mjs$|installer/|scripts/windows-installer/)'; then build=true; fi

          if printf '%s\n' "$changed" | grep -Eq '^(scripts/(verification-webmcp-live|full-verification-process|windows-uat-control)\.mjs$|tests/(issue-3121-windows-live-verifier-cleanup|issue-3110-windows-uat-control|issue-3220-app-lifecycle-mcp|issue-3222-verified-pr-launch)\.test\.mjs$|scripts/engineering-team/mcp/(plotpickle-app-lifecycle|factory-readonly-server|factory-named-tests)\.mjs$|scripts/engineering-team/mcp/candidate/plotpickle-candidate-source\.mjs$|scripts/engineering-team/gateway/outbound-openai-once\.mjs$|tests/issue-3259-outbound-openai-once\.test\.mjs$|scripts/engineering-team/gateway/authorized-coding-once\.mjs$|tests/issue-3142-authorized-coding-once\.test\.mjs$|scripts/engineering-team/gateway/publication/authorized-pr-publish-once\.mjs$|tests/issue-3142-authorized-pr-publish-once\.test\.mjs$|scripts/engineering-team/gateway/verification/two-receipt-verifier\.mjs$|tests/issue-3302-two-receipt-verifier\.test\.mjs$|scripts/engineering-team/gateway/authorized-pr-publish-once\.mjs$|tests/issue-3142-authorized-publish-once\.test\.mjs$|scripts/engineering-team/windows/acceptance/|tests/issue-3142-owner-windows-acceptance-broker\.test\.mjs$)'; then verifier=true; fi
          if printf '%s\n' "$changed" | grep -Eq '^(scripts/engineering-team/windows/supervisor/(unattended-supervisor\.mjs|Install-PlotPickleIndependentSupervisor\.ps1)$|scripts/engineering-team/mcp/engineering/factory-supervisor-start\.mjs$|tests/(issue-3110-(persistent-local-supervisor|factory-named-test-mcp)|issue-3142-(authenticated-factory-supervisor-gui|supervisor-head-migration))\.test\.mjs$)'; then supervisor=true; fi

          any=false
          if [ "$command" = true ] || [ "$pi" = true ] || [ "$story" = true ] || [ "$media" = true ] || [ "$voice" = true ] || [ "$build" = true ]; then any=true; fi

          echo "command=$command" >> "$GITHUB_OUTPUT"
          echo "pi=$pi" >> "$GITHUB_OUTPUT"
          echo "story=$story" >> "$GITHUB_OUTPUT"
          echo "media=$media" >> "$GITHUB_OUTPUT"
          echo "voice=$voice" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "verifier=$verifier" >> "$GITHUB_OUTPUT"
          echo "supervisor=$supervisor" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "Selected Windows lanes: command=$command pi=$pi story=$story media=$media voice=$voice build=$build"

  windows-product-proof:
    name: Impact-selected Windows Product Gate
    needs: windows-product-scope
    if: needs.windows-product-scope.outputs.any == 'true'
    uses: ./.github/workflows/product-gate.yml
    with:
      command: ${{ needs.windows-product-scope.outputs.command == 'true' }}
      pi: ${{ needs.windows-product-scope.outputs.pi == 'true' }}
      story: ${{ needs.windows-product-scope.outputs.story == 'true' }}
      media: ${{ needs.windows-product-scope.outputs.media == 'true' }}
      voice: ${{ needs.windows-product-scope.outputs.voice == 'true' }}
      build: ${{ needs.windows-product-scope.outputs.build == 'true' }}

  windows-verifier-owned-stop:
    name: Windows owned verifier STOP and sentinel proof
    needs: windows-product-scope
    if: needs.windows-product-scope.outputs.verifier == 'true'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
          cache: npm
      - name: Admit reviewed truth bindings before native execution
        shell: pwsh
        run: node scripts/verification-test-truth.mjs --base-ref "${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}"
      - name: Install pinned PlotPickle dependencies
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund
      - name: Prove owned process-tree STOP, listener release and sentinel survival on native Windows
        shell: pwsh
        env:
          PLOTPICKLE_NATIVE_STOP_FIXTURE: '1'
          PLOTPICKLE_PROOF_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --test tests/issue-3121-windows-live-verifier-cleanup.test.mjs
      - name: Prove live Windows UAT STOP, timeout truth and unrelated sentinel survival
        shell: pwsh
        env:
          PLOTPICKLE_NATIVE_UAT_STOP_FIXTURE: '1'
          PLOTPICKLE_PROOF_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --test tests/issue-3110-windows-uat-control.test.mjs
      - name: Test owner Windows app lifecycle MCP fixed controls and foreign-process denial
        shell: pwsh
        env:
          PLOTPICKLE_PROOF_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -ne $env:PLOTPICKLE_PROOF_SOURCE_HEAD) { throw "Wrong exact-head Windows lifecycle checkout" }
          node --test tests/issue-3220-app-lifecycle-mcp.test.mjs tests/issue-3222-verified-pr-launch.test.mjs
      - name: Test durable conversation and authenticated MCP boundary on native Windows
        shell: pwsh
        run: node --test tests/issue-3259-bidirectional-gateway-p1.test.mjs tests/issue-3259-conversation-mcp.test.mjs tests/issue-3259-outbound-openai-once.test.mjs tests/issue-3154-chatgpt-factory-mcp.test.mjs
      - name: Verify owner-authorized coding worker on exact-head native Windows
        shell: pwsh
        env:
          PLOTPICKLE_PROOF_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -ne $env:PLOTPICKLE_PROOF_SOURCE_HEAD) { throw "Wrong exact-head Windows coding worker checkout" }
          node --test tests/issue-3142-authorized-coding-once.test.mjs tests/issue-3142-authorized-pr-publish-once.test.mjs tests/issue-3142-authorized-publish-once.test.mjs tests/issue-3302-two-receipt-verifier.test.mjs tests/issue-3142-owner-windows-acceptance-broker.test.mjs
      - name: Parse owner-local Windows Acceptance Broker launcher on native Windows
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @(
            (Join-Path $PWD 'scripts/engineering-team/windows/acceptance/Invoke-PlotPickle-WindowsAcceptance.ps1'),
            (Join-Path $PWD 'scripts/engineering-team/windows/acceptance/Prepare-PlotPickle-AcceptancePreview.ps1')
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($null -ne $parseErrors -and $parseErrors.Count -gt 0) { throw 'OWNER_ACCEPTANCE_LAUNCHER_SYNTAX_INVALID' }
          }
      - name: Verify authenticated headless gateway acceptance route on native Windows
        shell: pwsh
        env:
          PLOTPICKLE_PROOF_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -ne $env:PLOTPICKLE_PROOF_SOURCE_HEAD) { throw "Wrong exact-head Windows gateway acceptance checkout" }
          node --test tests/issue-3303-headless-gateway-acceptance.test.mjs
      - name: Run real Windows Factory candidate listener with isolated synthetic Auth and MAIN sentinel
        shell: pwsh
        env:
          PLOTPICKLE_NATIVE_FACTORY_SESSION_PROOF: '1'
          PLOTPICKLE_PROOF_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --test tests/issue-3222-factory-concurrent-session.test.mjs
      - name: Preserve sanitized native Factory browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-browser-3222-${{ github.run_id }}
          path: .artifacts/factory-session-3222/factory-candidate.png
          if-no-files-found: warn
          retention-days: 5

  windows-factory-supervisor-lifecycle:
    name: Windows factory supervisor PAUSE/RESUME truth
    needs: windows-product-scope
    if: needs.windows-product-scope.outputs.supervisor == 'true'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
          cache: npm
      - name: Admit reviewed truth bindings
        shell: pwsh
        run: node scripts/verification-test-truth.mjs --base-ref "${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}"
      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund
      - name: Test native Windows supervisor pause/resume, scope refusals and kill-switch precedence
        shell: pwsh
        env:
          PLOTPICKLE_NATIVE_SUPERVISOR_PAUSE: '1'
          PLOTPICKLE_NATIVE_SUPERVISOR_INSTALL_FIXTURE: '1'
          PLOTPICKLE_PROOF_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -ne $env:PLOTPICKLE_PROOF_SOURCE_HEAD) { throw "Wrong exact-head Windows test checkout" }
          node --test tests/issue-3110-persistent-local-supervisor.test.mjs tests/issue-3142-authenticated-factory-supervisor-gui.test.mjs tests/issue-3142-supervisor-head-migration.test.mjs tests/issue-3110-factory-named-test-mcp.test.mjs

  modular-runtime-windows-scope:
    name: Detect modular runtime Windows proof scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(scripts/sidecars/|scripts/runtime-sidecar-supervisor\.mjs|scripts/windows-companion-maintenance-after-ready\.ps1|config/runtime-sidecars\.json|core/sidecars/|build/startup-agent-diagnostics|build/startup/agent-inventory\.mjs|tests/issue-269[78]-)'; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

  modular-runtime-windows-proof:
    name: Modular runtime Windows proof
    needs: modular-runtime-windows-scope
    if: needs.modular-runtime-windows-scope.outputs.required == 'true'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
      - name: Admit tests against approved truth before Windows execution
        shell: pwsh
        run: node scripts/verification-test-truth.mjs --base-ref "${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}"
      - name: Install pinned dependencies for Windows production build
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate production build on the supported Windows host
        shell: pwsh
        run: npm run build
      - name: Prove modular child-process lifecycle and media contract on Windows
        shell: pwsh
        run: node --experimental-strip-types --test tests/issue-2694-live-runtime-supervisor.test.mjs tests/issue-2695-live-dsdd-browser-services.test.mjs tests/issue-2696-pi-durable-active-default.test.mjs tests/issue-2697-live-modular-runtimes.test.mjs tests/issue-2698-startup-agent-inventory.test.mjs tests/issue-2698-runtime-shutdown.test.mjs tests/issue-2698-launcher-probe.test.mjs tests/issue-2698-media-retention.test.mjs tests/issue-2665-timeline-rough-cut-media.test.mjs tests/issue-2666-screening-fframes-hardening.test.mjs
      - name: Prove deferred companion readiness on Windows
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/issue-2698-companion-readiness.ps1
      - name: Prove real normal launcher convergence and persistent restart on Windows
        shell: pwsh
        run: node tests/issue-2698-windows-startup-proof.mjs
      - name: Upload Windows runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/runtime-2698/*.json
          if-no-files-found: warn
          retention-days: 7

  portless-upgrade-proof-scope:
    name: Detect Portless upgrade Windows proof scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(config/portless-runtime\.json$|core/runtime/portless-adapter\.mjs$|scripts/run-portless-windows-acceptance\.mjs$|tests/issue-115[46]-.*\.test\.mjs$|\.github/workflows/portless-adapter-proof\.yml$)'; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

  portless-upgrade-windows-proof:
    name: Impact-selected Portless Windows and direct build proof
    needs: portless-upgrade-proof-scope
    if: needs.portless-upgrade-proof-scope.outputs.required == 'true'
    uses: ./.github/workflows/portless-adapter-proof.yml
