name: PlotPickle OSS Radar

on:
  schedule:
    - cron: '24 4 * * *'
      timezone: 'America/Toronto'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: plotpickle-oss-radar
  cancel-in-progress: false

jobs:
  radar:
    name: daily-discovery-report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Verify OSS Radar contracts
        run: node --test tests/issue-1977-oss-radar-*.test.mjs tests/issue-2034-oss-radar-*.test.mjs tests/issue-2087-oss-radar-*.test.mjs tests/issue-2194-oss-radar-*.test.mjs tests/issue-2210-oss-radar-*.test.mjs tests/issue-2348-oss-rules-intelligence.test.mjs tests/issue-2416-oss-rules-three-observations.test.mjs
      - name: Run OSS Radar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node lib/verification/oss-radar/run-radar.mjs > oss-radar-result.json
      - name: Build OSS Radar evidence artifact
        run: node lib/verification/oss-radar/artifact-bundle.mjs oss-radar-result.json oss-radar-artifact
      - name: Upload OSS Radar evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: oss-radar-${{ github.run_id }}
          path: oss-radar-artifact/
          retention-days: 90
          if-no-files-found: error
      - name: Publish GitHub Actions summary
        run: node lib/verification/oss-radar/github-summary.mjs oss-radar-result.json
