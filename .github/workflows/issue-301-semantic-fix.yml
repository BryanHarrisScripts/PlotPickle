name: Apply issue 301 semantic fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
      - name: Use semantic section headers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/marketing-splash-base.tsx')
          text = path.read_text(encoding='utf-8')
          pattern = r'<div className=\{styles\.sectionHeading\}>(.*?)</div>'
          updated, count = re.subn(pattern, r'<header className={styles.sectionHeading}>\1</header>', text)
          if count != 3:
              raise SystemExit(f'Expected three section-heading containers, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY
          node --test tests/issue-301-splash-readme-refresh.test.mjs tests/issue-169-splash-builds-open-source.test.mjs tests/issue-212-buzz-dashboard-marketing-alignment.test.mjs
      - name: Commit clean semantic repair
        shell: bash
        run: |
          rm .github/workflows/issue-301-semantic-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/marketing-splash-base.tsx .github/workflows/issue-301-semantic-fix.yml
          git commit -m "Use semantic headers for splash sections"
          git push origin HEAD:agent/301-splash-readme-refresh
