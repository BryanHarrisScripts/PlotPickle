name: Story Workbench

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-workbench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  story-workbench-contract:
    name: story-workbench-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate Story Workbench package, review, revision, impact and convergence contracts
        run: node --test tests/issue-1419-story-workbench.test.mjs tests/issue-1420-workbench-visual-impact.test.mjs tests/issue-1420-targeted-script-staleness.test.mjs tests/issue-1420-afterglow-vertical-proof.test.mjs tests/issue-1421-afterglow-convergence.test.mjs tests/issue-1553-autonomous-convergence-restart.test.mjs tests/issue-1553-application-lifecycle.test.mjs tests/issue-1553-application-lifecycle-doc.test.mjs
      - name: Validate upstream Story Decision and Story Workflow contracts
        run: node --test tests/issue-1418-story-decisions.test.mjs tests/issue-1418-story-decisions-workflow-source.test.mjs tests/issue-1416-story-workflow-engine.test.mjs
      - name: Validate current PPF revision and profile-library persistence contracts
        run: node --test tests/foundation-architecture.test.mjs tests/issue-1122-library-persistence.test.mjs
      - name: Production build
        run: npm run build
