name: Buzz Guildhall

on:
  pull_request:
    paths:
      - "README.md"
      - "config/buzz-guildhall.json"
      - "config/uat-autopilot-registry.json"
      - "lib/buzz-guildhall.ts"
      - "lib/community-agent-roster.ts"
      - "build/buzz-community-gateway.ts"
      - "build/buzz-agent-roster-gateway.ts"
      - "build/buzz-agent-activity-mirror.ts"
      - "build/buzz-guildhall-gateway.ts"
      - "build/buzz-live-health-gateway.ts"
      - "build/buzz-story-room-access-gateway.ts"
      - "build/local-ai-gateway.ts"
      - "app/buzz-settings-panel.tsx"
      - "app/buzz-live-health-card.tsx"
      - "app/sage-settings-workspace.tsx"
      - "app/community-workspace.tsx"
      - "app/community-workspace.module.css"
      - "app/community-agent-roster.tsx"
      - "app/community-agent-roster.module.css"
      - "app/community-story-room-access.tsx"
      - "app/community-story-room-access.module.css"
      - "app/page.tsx"
      - "app/plotpickle-workspace-shell.tsx"
      - "app/plotpickle-workspace-shell.module.css"
      - "public/assets/workflow-relics/community.svg"
      - "vite.config.ts"
      - "scripts/bootstrap-buzz-guildhall.mjs"
      - "scripts/post-buzz-guildhall-event.mjs"
      - "scripts/buzz-live-activity.mjs"
      - "scripts/verify-buzz-live-activity.mjs"
      - "scripts/writer-in-residence-runtime-recovery.mjs"
      - "scripts/report-writer-in-residence.mjs"
      - "scripts/report-uat-findings.mjs"
      - "scripts/run-uat-closed-loop.mjs"
      - "docs/buzz-guildhall.md"
      - "docs/buzz-live-health.md"
      - "docs/issue-buzz-story-room-access-agents.md"
      - "tests/core-readme-direction.test.mjs"
      - "tests/issue-675-buzz-guildhall.test.mjs"
      - "tests/issue-677-buzz-guildhall-settings.test.mjs"
      - "tests/issue-672-global-navigation.test.mjs"
      - "tests/community-workspace.test.mjs"
      - "tests/community-agent-roster.test.mjs"
      - "tests/buzz-live-roundtrip.test.mjs"
      - "tests/buzz-story-room-access-agents.test.mjs"
      - "tests/live-buzz-guildhall-activity.test.mjs"
      - ".github/workflows/buzz-guildhall.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "config/buzz-guildhall.json"
      - "config/uat-autopilot-registry.json"
      - "lib/buzz-guildhall.ts"
      - "lib/community-agent-roster.ts"
      - "build/buzz-community-gateway.ts"
      - "build/buzz-agent-roster-gateway.ts"
      - "build/buzz-agent-activity-mirror.ts"
      - "build/buzz-guildhall-gateway.ts"
      - "build/buzz-live-health-gateway.ts"
      - "build/buzz-story-room-access-gateway.ts"
      - "build/local-ai-gateway.ts"
      - "app/buzz-settings-panel.tsx"
      - "app/buzz-live-health-card.tsx"
      - "app/sage-settings-workspace.tsx"
      - "app/community-workspace.tsx"
      - "app/community-workspace.module.css"
      - "app/community-agent-roster.tsx"
      - "app/community-agent-roster.module.css"
      - "app/community-story-room-access.tsx"
      - "app/community-story-room-access.module.css"
      - "app/page.tsx"
      - "app/plotpickle-workspace-shell.tsx"
      - "app/plotpickle-workspace-shell.module.css"
      - "public/assets/workflow-relics/community.svg"
      - "vite.config.ts"
      - "scripts/bootstrap-buzz-guildhall.mjs"
      - "scripts/post-buzz-guildhall-event.mjs"
      - "scripts/buzz-live-activity.mjs"
      - "scripts/verify-buzz-live-activity.mjs"
      - "scripts/writer-in-residence-runtime-recovery.mjs"
      - "scripts/report-writer-in-residence.mjs"
      - "scripts/report-uat-findings.mjs"
      - "scripts/run-uat-closed-loop.mjs"
      - "docs/buzz-guildhall.md"
      - "docs/buzz-live-health.md"
      - "docs/issue-buzz-story-room-access-agents.md"
      - "tests/core-readme-direction.test.mjs"
      - "tests/issue-675-buzz-guildhall.test.mjs"
      - "tests/issue-677-buzz-guildhall-settings.test.mjs"
      - "tests/issue-672-global-navigation.test.mjs"
      - "tests/community-workspace.test.mjs"
      - "tests/community-agent-roster.test.mjs"
      - "tests/buzz-live-roundtrip.test.mjs"
      - "tests/buzz-story-room-access-agents.test.mjs"
      - "tests/live-buzz-guildhall-activity.test.mjs"
      - ".github/workflows/buzz-guildhall.yml"

permissions:
  contents: read

jobs:
  guildhall-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check Guildhall scripts
        run: |
          node --check scripts/bootstrap-buzz-guildhall.mjs
          node --check scripts/post-buzz-guildhall-event.mjs
          node --check scripts/buzz-live-activity.mjs
          node --check scripts/verify-buzz-live-activity.mjs
          node --check scripts/writer-in-residence-runtime-recovery.mjs
          node --check scripts/report-writer-in-residence.mjs
          node --check scripts/report-uat-findings.mjs
          node --check scripts/run-uat-closed-loop.mjs
      - name: Validate Guildhall, Community, Story Room, agent, README, and live BUZZ contracts
        run: node --test tests/core-readme-direction.test.mjs tests/issue-675-buzz-guildhall.test.mjs tests/issue-677-buzz-guildhall-settings.test.mjs tests/issue-672-global-navigation.test.mjs tests/community-workspace.test.mjs tests/community-agent-roster.test.mjs tests/buzz-live-roundtrip.test.mjs tests/buzz-story-room-access-agents.test.mjs tests/live-buzz-guildhall-activity.test.mjs
