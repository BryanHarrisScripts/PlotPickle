name: Architecture Verification

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - tests/issue-2698-windows-startup-proof.mjs
      - config/development-convergence/2698.json
      - .github/workflows/architecture-shadow.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-verification:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: experience-skins
            name: Layer 1 Experience Skins
            allow_network: true
          - id: experience-contract
            name: Layer 2 Experience Contract
            allow_network: false
          - id: production-harness
            name: Layer 3 Production Orchestration
            allow_network: false
          - id: agent-runtime
            name: Layer 4 Agent & Skill Mesh
            allow_network: false
          - id: story-canon
            name: Layer 5 Story / Canon / Evidence
            allow_network: false
          - id: provider-runtime
            name: Layer 6 Provider Runtime
            allow_network: false
          - id: verification
            name: Layer 7 Validation & Operations
            allow_network: false

    steps:
      - name: Checkout exact head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore main reference for legacy convergence checks
        run: git update-ref refs/heads/main refs/remotes/origin/main

      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Run BEN deterministic AI-slop/code-quality delta
        if: matrix.id == 'verification'
        run: >-
          node scripts/run-ben-code-quality.mjs
          --base-ref "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}"

      - name: Install executable Story Canon and Agent contract dependencies
        if: matrix.id == 'story-canon' || matrix.id == 'agent-runtime'
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund

      - name: Run architecture verification
        run: >-
          node scripts/verification-shadow.mjs "${{ matrix.id }}"
          --base-ref "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}"
          --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --platform linux
          --allow-network "${{ matrix.allow_network }}"

      - name: Verify development convergence
        if: matrix.id == 'verification'
        run: >-
          node scripts/run-development-convergence.mjs --changed
          --base-ref "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}"

      - name: Upload architecture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-${{ matrix.id }}-${{ github.run_id }}
          path: |
            .artifacts/verification-shadow/${{ matrix.id }}.json
            .artifacts/verification-shadow/${{ matrix.id }}.summary.json
            .artifacts/verification-shadow/${{ matrix.id }}.comparison.json
            .artifacts/ben-code-quality/
            .artifacts/development-convergence/
            .artifacts/verification-live/webmcp-live.json
            .artifacts/verification-live/webmcp-app-server.log
            .artifacts/webmcp-startup/summary.json
            .artifacts/webmcp-startup/uat-findings.json
            .artifacts/webmcp-acceptance/**/*.json
            .artifacts/visual-readiness/*.png
            .artifacts/visual-readiness/visual-director-report.json
          if-no-files-found: warn
          retention-days: 7

  windows-product-scope:
    name: Detect impact-selected Windows product lanes
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.scope.outputs.command }}
      pi: ${{ steps.scope.outputs.pi }}
      story: ${{ steps.scope.outputs.story }}
      media: ${{ steps.scope.outputs.media }}
      voice: ${{ steps.scope.outputs.voice }}
      build: ${{ steps.scope.outputs.build }}
      any: ${{ steps.scope.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf 'Changed files:\n%s\n' "$changed"

          command=false
          pi=false
          story=false
          media=false
          voice=false
          build=false

          if printf '%s\n' "$changed" | grep -Eq '^(\.github/workflows/(architecture-shadow|product-gate)\.yml$|tests/issue-2733-ci-windows-lanes\.test\.mjs$|docs/developer-briefs/2733-split-windows-product-gate\.md$)'; then
            command=true
            pi=true
            story=true
            media=true
            voice=true
            build=true
          else
            if printf '%s\n' "$changed" | grep -Eq '^(app/_components/settings/command-review-panel\.tsx$|app/skin-v1/global-dsdd-conversation(\.module\.css|\.tsx)$|build/dsdd/(dsdd-pi-session|dsdd-session-gateway|hunk-review-controller)\.(mjs|ts)$|build/dsdd/hunk-review-gateway\.ts$|scripts/settings-command-product-proof\.mjs$|scripts/pi/hunk-review-terminal\.ps1$|tools/hunk-review/|tests/issue-2717-(settings-command|command-gateway)\.test\.mjs$)'; then command=true; fi
            if printf '%s\n' "$changed" | grep -Eq '^(scripts/(pi-managed-install|pi-durable-managed-install|pi-worker-runtime|pi-version|evaluate-pi-087-dsdd-session|evaluate-pi-099-compatibility|evaluate-pi-durable-adapter|dsdd-pi-session|dsdd-pi-draft|run-uat-repair-agent|setup-developer-agent-stack)\.mjs$|scripts/pi/(?!durable/)|config/(pi-087-dsdd-session-evaluation|pi-099-compatibility|pi-101-compatibility|pi-durable-adapter|pi-tool-exposure-policy|pi-codemode-policy|developer-agent-stack)\.json$|core/sidecars/(durable-execution-contract|pi-durable-adapter)\.mjs$|scripts/sidecars/pi-durable-service\.mjs$|tests/issue-(2338|2590|2591|2592|2593|2594|2672|2696)-|lib/agents/(developer-tool-authorization|pi-codemode-governance|pi-nested-call-evidence|agent-runtime-vocabulary)\.mjs$|\.pi/(managed/|npm/|settings\.json$|extensions/))'; then pi=true; fi
            if printf '%s\n' "$changed" | grep -Eq '^(build/projects/outline-task-[^/]+\.ts$|app/api/outline/tasks/route\.ts$|modules/plan/assessments/outline-task-browser\.ts$|app/skin-v1/story-card-foundation-board\.tsx$|build/mastra-agent-runtime\.ts$|modules/plan/outline-agent-assessment\.ts$|scripts/pi/durable/|core/sidecars/tasks/|tests/issue-(2709|2711)-|tests/issue-outline-agent-assessment\.test\.mjs$|tests/issue-2440-story-architect-structured-execution\.test\.mjs$)'; then story=true; fi
            if printf '%s\n' "$changed" | grep -Eq '^(tools/fframes-bridge/|core/media/fframes-local-media-engine\.ts$|scripts/fframes-product-proof\.mjs$|tests/issue-2663-fframes-media-engine\.test\.mjs$|tests/ltx-bundled-default\.test\.mjs$)'; then media=true; fi
            if printf '%s\n' "$changed" | grep -Eq '^(Start-PlotPickle\.bat$|scripts/install-whisper-cpp\.ps1$|config/local-voice-input\.json$|build/voice/|runtime/whisper/|tests/issue-(1910|2341|2350)-)'; then voice=true; fi
            if printf '%s\n' "$changed" | grep -Eq '^(package(-lock)?\.json$|next\.config\.ts$|vite\.config\.ts$|scripts/windows-runtime\.mjs$|Start-PlotPickle\.(bat|command)$|start-plotpickle\.sh$|tests/issue-1456-windows-installer\.test\.mjs$|installer/|scripts/windows-installer/)'; then build=true; fi
          fi

          any=false
          if [ "$command" = true ] || [ "$pi" = true ] || [ "$story" = true ] || [ "$media" = true ] || [ "$voice" = true ] || [ "$build" = true ]; then any=true; fi

          echo "command=$command" >> "$GITHUB_OUTPUT"
          echo "pi=$pi" >> "$GITHUB_OUTPUT"
          echo "story=$story" >> "$GITHUB_OUTPUT"
          echo "media=$media" >> "$GITHUB_OUTPUT"
          echo "voice=$voice" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "Selected Windows lanes: command=$command pi=$pi story=$story media=$media voice=$voice build=$build"

  windows-product-proof:
    name: Impact-selected Windows Product Gate
    needs: windows-product-scope
    if: needs.windows-product-scope.outputs.any == 'true'
    uses: ./.github/workflows/product-gate.yml
    with:
      command: ${{ needs.windows-product-scope.outputs.command == 'true' }}
      pi: ${{ needs.windows-product-scope.outputs.pi == 'true' }}
      story: ${{ needs.windows-product-scope.outputs.story == 'true' }}
      media: ${{ needs.windows-product-scope.outputs.media == 'true' }}
      voice: ${{ needs.windows-product-scope.outputs.voice == 'true' }}
      build: ${{ needs.windows-product-scope.outputs.build == 'true' }}

  modular-runtime-windows-scope:
    name: Detect modular runtime Windows proof scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(scripts/sidecars/|scripts/runtime-sidecar-supervisor\.mjs|scripts/windows-companion-maintenance-after-ready\.ps1|config/runtime-sidecars\.json|core/sidecars/|build/startup-agent-diagnostics|build/startup/agent-inventory\.mjs|tests/issue-269[78]-)'; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

  modular-runtime-windows-proof:
    name: Modular runtime Windows proof
    needs: modular-runtime-windows-scope
    if: needs.modular-runtime-windows-scope.outputs.required == 'true'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned dependencies for Windows production build
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate production build on the supported Windows host
        shell: pwsh
        run: npm run build
      - name: Prove modular child-process lifecycle and media contract on Windows
        shell: pwsh
        run: node --experimental-strip-types --test tests/issue-2694-live-runtime-supervisor.test.mjs tests/issue-2695-live-dsdd-browser-services.test.mjs tests/issue-2696-pi-durable-active-default.test.mjs tests/issue-2697-live-modular-runtimes.test.mjs tests/issue-2698-startup-agent-inventory.test.mjs tests/issue-2698-runtime-shutdown.test.mjs tests/issue-2698-launcher-probe.test.mjs tests/issue-2698-media-retention.test.mjs tests/issue-2665-timeline-rough-cut-media.test.mjs tests/issue-2666-screening-fframes-hardening.test.mjs
      - name: Prove deferred companion readiness on Windows
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/issue-2698-companion-readiness.ps1
      - name: Prove real normal launcher convergence and persistent restart on Windows
        shell: pwsh
        run: node tests/issue-2698-windows-startup-proof.mjs
      - name: Upload Windows runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/runtime-2698/*.json
          if-no-files-found: warn
          retention-days: 7
