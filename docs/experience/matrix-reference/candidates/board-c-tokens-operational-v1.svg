<title id="title">PlotPickle Matrix Tokens and Operational Style Guide — candidate reference</title>
<desc id="desc">Candidate Matrix style board showing semantic token roles, typography, spacing, geometry, focus and operational status examples based on the current PlotPickle Skin V1 contract.</desc>
