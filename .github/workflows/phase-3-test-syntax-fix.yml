name: Phase 3 test syntax repair

on:
  push:
    branches:
      - agent/phase-3-git-native-project-sync
    paths:
      - .github/workflows/phase-3-test-syntax-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3-git-native-project-sync
          fetch-depth: 0

      - name: Replace literal newline tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path("tests/issue-150-git-native-project-sync.test.mjs")
          source = test.read_text()

          assertion_token = r');\n  assert.match(gateway, /body:'
          if source.count(assertion_token) != 1:
              raise SystemExit(f"Expected one assertion token, found {source.count(assertion_token)}")
          source = source.replace(assertion_token, ');\n  assert.match(gateway, /body:', 1)

          workflow_token = r'\n    ".github/workflows/phase-3-'
          if source.count(workflow_token) != 2:
              raise SystemExit(f"Expected two workflow tokens, found {source.count(workflow_token)}")
          source = source.replace(workflow_token, '\n    ".github/workflows/phase-3-')

          anchor = '    ".github/workflows/phase-3-test-contract-fix.yml",'
          addition = anchor + '\n    ".github/workflows/phase-3-test-syntax-fix.yml",'
          if anchor not in source:
              raise SystemExit("The workflow-list anchor was not found")
          source = source.replace(anchor, addition, 1)

          test.write_text(source)
          Path(".github/workflows/phase-3-test-syntax-fix.yml").unlink()
          PY

          git config user.name "PlotPickle Build"
          git config user.email "actions@users.noreply.github.com"
          git add tests/issue-150-git-native-project-sync.test.mjs .github/workflows/phase-3-test-syntax-fix.yml
          git commit -m "Repair Phase 3 test syntax"
          git push origin HEAD:agent/phase-3-git-native-project-sync
