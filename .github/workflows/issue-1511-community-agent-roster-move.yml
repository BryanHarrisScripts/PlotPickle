name: Issue 1511 Community Agent Roster Move

on:
  push:
    branches:
      - architecture/1511-community-agent-roster

permissions:
  contents: write

jobs:
  move-community-agent-roster:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/1511-community-agent-roster
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Apply bounded Community Agent roster ownership move
        run: python .github/scripts/issue-1511-community-agent-roster-move.py
      - name: Focused Community Agent and architecture regressions
        run: >-
          node --test
          tests/community-agent-roster.test.mjs
          tests/issue-1281-buzz-human-public-agent-roster.test.mjs
          tests/issue-971-buzz-specialist-agents.test.mjs
          tests/issue-1066-community-three-column-shell.test.mjs
          tests/issue-1464-app-domain-consolidation.test.mjs
          tests/issue-1461-repository-architecture-inventory.test.mjs
      - name: Production build
        run: npm run build
      - name: Diff hygiene
        run: git diff --check
      - name: Commit permanent Community Agent roster move
        shell: bash
        run: |
          git config user.name "PlotPickle Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app config tests .github/workflows/buzz-guildhall.yml
          if git diff --cached --quiet; then
            echo "No permanent source changes to commit."
            exit 0
          fi
          git commit -m "refactor(#1511): consolidate Community Agent roster UI"
          git push origin HEAD:architecture/1511-community-agent-roster
