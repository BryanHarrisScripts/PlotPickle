name: Windows Performance Baseline

on:
  pull_request:
    paths:
      - "Start-PlotPickle.bat"
      - "scripts/performance/**"
      - "tests/issue-1411-performance-benchmark.test.mjs"
      - "tests/issue-1624-performance-budgets.test.mjs"
      - ".github/workflows/windows-performance-baseline.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: Authoritative baseline profile
        required: true
        default: startup-baseline
        type: choice
        options:
          - startup-baseline
          - story-workflow-local
      sample_count:
        description: Repeated samples for the selected profile
        required: true
        default: "3"
        type: choice
        options:
          - "3"
          - "5"

permissions:
  contents: read

concurrency:
  group: windows-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-real-machine:
    name: Capture real Windows launcher evidence
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js 24.19
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install exact dependency tree
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate performance contracts
        shell: pwsh
        run: node --test tests/issue-1411-performance-benchmark.test.mjs tests/issue-1624-performance-budgets.test.mjs
      - name: Capture fresh-runtime startup
        if: github.event_name == 'pull_request' || inputs.profile == 'startup-baseline'
        shell: pwsh
        env:
          PLOTPICKLE_HOME: ${{ runner.temp }}\PlotPickle-Performance
          PLOTPICKLE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PLOTPICKLE_AFTERGLOW_FIXTURE: afterglow-v9
          PLOTPICKLE_PPF_START_REVISION: "9"
          PLOTPICKLE_CURRICULUM_IDENTITY: afterglow-v9-current-catalog
          PLOTPICKLE_BUZZ_MODE: disabled
        run: node scripts/performance/run-windows-startup-benchmark.mjs --mode fresh-runtime --output .artifacts/performance/fresh-runtime.json
      - name: Capture repeated fresh, optimizer and warm startup samples
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.profile == 'startup-baseline') ||
          (github.event_name == 'pull_request' && startsWith(github.head_ref, 'baseline/1411-'))
        shell: pwsh
        env:
          PLOTPICKLE_HOME: ${{ runner.temp }}\PlotPickle-Performance
          PLOTPICKLE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PLOTPICKLE_AFTERGLOW_FIXTURE: afterglow-v9
          PLOTPICKLE_PPF_START_REVISION: "9"
          PLOTPICKLE_CURRICULUM_IDENTITY: afterglow-v9-current-catalog
          PLOTPICKLE_BUZZ_MODE: disabled
        run: |
          $samples = if ("${{ github.event_name }}" -eq "pull_request") { 3 } else { [int]"${{ inputs.sample_count }}" }
          $files = @(".artifacts/performance/fresh-runtime.json")
          2..$samples | ForEach-Object {
            $file = ".artifacts/performance/fresh-runtime-$_.json"
            node scripts/performance/run-windows-startup-benchmark.mjs --mode fresh-runtime --output $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $files += $file
          }
          1..$samples | ForEach-Object {
            $file = ".artifacts/performance/fresh-optimizer-$_.json"
            node scripts/performance/run-windows-startup-benchmark.mjs --mode fresh-optimizer --output $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $files += $file
          }
          1..$samples | ForEach-Object {
            $file = ".artifacts/performance/warm-persistent-runtime-$_.json"
            node scripts/performance/run-windows-startup-benchmark.mjs --mode warm-persistent-runtime --output $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $files += $file
          }
          node scripts/performance/analyze-real-machine-baselines.mjs @files --output .artifacts/performance/startup-mode-baseline-analysis.json
      - name: Evaluate ratified startup budgets
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.profile == 'startup-baseline') ||
          (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'baseline/1411-'))
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem .artifacts/performance/fresh-runtime*.json | Where-Object { $_.Name -notmatch 'analysis' } | ForEach-Object { $_.FullName }
          $files += Get-ChildItem .artifacts/performance/fresh-optimizer-*.json | ForEach-Object { $_.FullName }
          $files += Get-ChildItem .artifacts/performance/warm-persistent-runtime-*.json | ForEach-Object { $_.FullName }
          node scripts/performance/evaluate-performance-budgets.mjs @files --scope startup --output .artifacts/performance/startup-budget-evaluation.json
      - name: Capture repeated local Story Workflow samples
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.profile == 'story-workflow-local') ||
          (github.event_name == 'pull_request' && startsWith(github.head_ref, 'baseline/1411-'))
        shell: pwsh
        env:
          PLOTPICKLE_HOME: ${{ runner.temp }}\PlotPickle-Performance
          PLOTPICKLE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PLOTPICKLE_AFTERGLOW_FIXTURE: afterglow-v9
          PLOTPICKLE_PPF_START_REVISION: "9"
          PLOTPICKLE_CURRICULUM_IDENTITY: afterglow-v9-current-catalog
          PLOTPICKLE_BUZZ_MODE: disabled
          PLOTPICKLE_OPTIONAL_INTEGRATIONS: ""
        run: |
          $samples = if ("${{ github.event_name }}" -eq "pull_request") { 3 } else { [int]"${{ inputs.sample_count }}" }
          $files = @()
          1..$samples | ForEach-Object {
            $file = ".artifacts/performance/story-workflow-local-$_.json"
            node scripts/performance/run-windows-startup-benchmark.mjs --mode story-workflow-local --output $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $files += $file
          }
          node scripts/performance/analyze-real-machine-baselines.mjs @files --output .artifacts/performance/story-workflow-local-baseline-analysis.json
      - name: Evaluate ratified local Story Workflow budgets
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.profile == 'story-workflow-local') ||
          (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'baseline/1411-'))
        shell: pwsh
        run: |
          $files = Get-ChildItem .artifacts/performance/story-workflow-local-*.json | Where-Object { $_.Name -match '^story-workflow-local-\d+\.json$' } | ForEach-Object { $_.FullName }
          node scripts/performance/evaluate-performance-budgets.mjs @files --scope story-workflow-local --output .artifacts/performance/story-workflow-local-budget-evaluation.json
      - name: Upload bounded performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plotpickle-windows-performance-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/performance/*.json
          if-no-files-found: error
          retention-days: 14
