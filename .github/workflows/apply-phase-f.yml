name: Apply Phase F canonical integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-f-collaboration-release-100-rc
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Apply canonical Phase F integration
        run: python3 scripts/apply-phase-f.py
      - name: Remove one-time integration helpers
        run: rm scripts/apply-phase-f.py .github/workflows/apply-phase-f.yml
      - name: Commit permanent 1.0 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate PlotPickle 1.0 collaboration and release candidate"
          git push origin HEAD:agent/phase-f-collaboration-release-100-rc
      - name: Install locked dependencies
        run: npm ci
      - name: Validate candidate
        run: |
          npm run lint
          npm test
          npm run test:recovery
          npm run package:windows
          npm run package:macos
          npm run package:linux
          node scripts/package-smoke.mjs releases/stage/PlotPickle-Windows
          node scripts/package-smoke.mjs releases/stage/PlotPickle-macOS
          node scripts/package-smoke.mjs releases/stage/PlotPickle-Linux
