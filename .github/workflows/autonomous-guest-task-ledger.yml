name: Autonomous Guest Task Ledger

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-guest-task-ledger.yml'
      - 'app/autonomous-guest-scheduler-settings.*'
      - 'app/api/autonomous-guest/scheduler/**'
      - 'app/api/autonomous-guest/reference-tasks/**'
      - 'app/settings/autonomous-guest/**'
      - 'app/settings-sitemap.tsx'
      - 'build/autonomous-guest/**'
      - 'core/auth/autonomous-guest/**'
      - 'scripts/creative-uat/autonomous/application-lifecycle.mjs'
      - 'scripts/creative-uat/autonomous/run-autonomous-story-reference.mjs'
      - 'tests/issue-1569-autonomous-guest-*.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-guest-task-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-build:
    name: contract-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate Guest task ledger, lifecycle and Mastra scheduling contracts
        run: node --test tests/issue-1569-autonomous-guest-task-ledger.test.mjs tests/issue-1569-autonomous-guest-task-lifecycle.test.mjs tests/issue-1569-autonomous-guest-mastra-scheduler.test.mjs tests/issue-1569-autonomous-guest-mastra-storage.test.mjs tests/issue-1569-autonomous-guest-mastra-wake-runtime.test.mjs tests/issue-1569-autonomous-guest-route-policy-recovery.test.mjs tests/issue-1569-autonomous-guest-restart-ordering.test.mjs tests/issue-1569-autonomous-guest-run-policy.test.mjs tests/issue-1569-autonomous-guest-settings.test.mjs tests/issue-1569-autonomous-guest-reference-runner.test.mjs
      - name: Verify production build
        run: npm run build