name: Apply issue 367 Storyboard patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/apply-issue-367-patch.mjs"
      - ".github/workflows/apply-issue-367-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-issue-367-storyboard-patch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/367-storyboard-creative-director'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/367-storyboard-creative-director
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
      - name: Apply reviewed implementation patch
        run: node scripts/apply-issue-367-patch.mjs
      - name: Run focused Creative Director contract
        run: node --test tests/issue-367-creative-director-actions.test.mjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit final implementation and remove temporary applicator
        shell: bash
        run: |
          git rm scripts/apply-issue-367-patch.mjs .github/workflows/apply-issue-367-patch.yml docs/.issue-367-pr-marker
          git add app/creative-director-actions.tsx app/creative-director-actions.module.css app/visual-storyboard.tsx app/visual-storyboard.module.css lib/project.ts tests/issue-367-creative-director-actions.test.mjs .github/workflows/creative-director-actions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete Storyboard Creative Director integration"
          git push origin HEAD:agent/367-storyboard-creative-director
