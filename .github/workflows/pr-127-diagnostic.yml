name: PR 127 Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run minimal authenticated test diagnostic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch "$GITHUB_HEAD_REF" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          npm ci --silent >/dev/null 2>&1
          if npm test > /tmp/plotpickle-test.log 2>&1; then
            echo "All PlotPickle tests passed."
          else
            echo "::error title=PlotPickle test failure::Failing tests follow"
            awk '
              /^not ok / {print; capture=1; next}
              capture && /^  error:/ {print; getline; print; capture=0}
            ' /tmp/plotpickle-test.log
            exit 1
          fi
