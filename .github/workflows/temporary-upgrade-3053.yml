name: Temporary #3053 web dependency lock resolution

on:
  push:
    branches:
      - upgrade/3053-web-stack-wave1
    paths:
      - .github/workflows/temporary-upgrade-3053.yml

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Resolve latest stable web runtime packages and full lockfile
        run: npm install --ignore-scripts --include=dev --no-audit --no-fund --save-exact vinext@latest next@latest eslint-config-next@latest
      - name: Prove lockfile installability
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund
      - name: Show actual package versions
        run: node -e "const p=require('./package.json'); console.log(JSON.stringify({vinext:p.dependencies.vinext,next:p.dependencies.next,eslintConfigNext:p.devDependencies['eslint-config-next']}))"
      - name: Commit real lockfile back to isolated upgrade branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(#3053): resolve latest stable web runtime package locks"
            git push origin HEAD:upgrade/3053-web-stack-wave1
          else
            echo "Already on latest versions; no dependency lock changes."
          fi
