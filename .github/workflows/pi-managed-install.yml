name: Managed Pi Install

on:
  pull_request:
    paths:
      - "scripts/pi-managed-install.mjs"
      - "scripts/ensure-pi-cli.mjs"
      - "scripts/ensure-pi-repair-stack.mjs"
      - "build/uat-discovery-plugin.ts"
      - "tests/issue-1185-pi-managed-install.test.mjs"
      - ".github/workflows/pi-managed-install.yml"

permissions:
  contents: read

jobs:
  managed-pi:
    name: ${{ matrix.name }} managed Pi and build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 22.19
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install PlotPickle dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate managed Pi contracts
        run: >-
          node --test
          tests/issue-1185-pi-managed-install.test.mjs
          tests/issue-1185-pi-windows-resolver.test.mjs
          tests/issue-1119-pi-required-worker.test.mjs
          tests/issue-651-pi-cline-uat-repair.test.mjs
      - name: Provision real Pi into PlotPickle private prefix
        env:
          PLOTPICKLE_PI_AUTO_INSTALL: "1"
        run: node scripts/ensure-pi-cli.mjs
      - name: Re-probe private Pi without reinstall
        run: node scripts/ensure-pi-cli.mjs
      - name: Production build
        run: npm run build
