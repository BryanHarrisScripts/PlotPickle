    <path d="m46 28 2-3 3 3-1 8-2 3-2-3Z" fill="#b6fff1" stroke="#effffc" stroke-width=".7" opacity=".92"/>
    <path d="M20 71c9 2 18 5 28 11 10-6 19-9 28-11" stroke="#b4873d" stroke-width="2" opacity=".82"/>
    <path d="M18 48h6M72 48h6M48 14v7M48 75v7" stroke="#8f6c31" stroke-width="1.6" opacity=".7"/>
