name: Run issue 301 implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
      - name: Apply prepared issue 301 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/issue-301-apply.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(code, 'issue-301-apply.py', 'exec'))
          PY
          node --test tests/issue-301-splash-readme-refresh.test.mjs tests/issue-169-splash-builds-open-source.test.mjs tests/issue-212-buzz-dashboard-marketing-alignment.test.mjs
      - name: Commit clean issue 301 implementation
        shell: bash
        run: |
          rm .github/workflows/issue-301-apply.yml .github/workflows/issue-301-kick.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/marketing-splash-base.tsx README.md package.json tests/issue-301-splash-readme-refresh.test.mjs docs/issue-301-splash-readme-refresh.md .github/workflows/issue-301-apply.yml .github/workflows/issue-301-kick.yml
          git commit -m "Refresh splash and README for current integrations"
          git push origin HEAD:agent/301-splash-readme-refresh
