name: Apply Phase 5 regression repair

on:
  push:
    branches:
      - agent/afterglow-example-boundary

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Stage focused Phase 5 regression repair'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/afterglow-example-boundary
          fetch-depth: 0

      - name: Restore established UX contracts
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text()
              if content.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: {old[:80]!r}")
              target.write_text(content.replace(old, new, 1))

          replace_once(
              "app/dashboard-command-centre.tsx",
              'import type { ProductNavigationId } from "@/lib/product-direction";\nimport SetupConnectionsDashboard from "./setup-connections-dashboard";',
              'import type { ProductNavigationId } from "@/lib/product-direction";\nimport RefreshAction from "./refresh-action";\nimport SetupConnectionsDashboard from "./setup-connections-dashboard";',
          )

          replace_once(
              "app/dashboard-command-centre.tsx",
              '  const source = useMemo(\n    () => currentProjectSource(project, saveState, connectionStatus),\n    [project, saveState, connectionStatus],\n  );\n\n  function openTarget(target: DashboardTarget) {',
              '  const source = useMemo(\n    () => currentProjectSource(project, saveState, connectionStatus),\n    [project, saveState, connectionStatus],\n  );\n  const afterglowMessage = source.isBundledExample\n    ? "The original Afterglow project ID, bundled assets and source repository remain protected. Your copy receives a new ID and starts with no GitHub destination."\n    : "";\n\n  function openTarget(target: DashboardTarget) {',
          )

          replace_once(
              "app/dashboard-command-centre.tsx",
              '                <button type="button" onClick={onLoadAfterglow}>Reload Bundled Example</button>',
              '                <RefreshAction label="Reload bundled example" working={afterglowCopyWorking} onClick={onLoadAfterglow} />',
          )

          replace_once(
              "app/dashboard-command-centre.tsx",
              '            {source.isBundledExample ? <p className={sourceStyles.notice}>The original Afterglow project ID, bundled assets and source repository remain protected. Your copy receives a new ID and starts with no GitHub destination.</p> : null}',
              '            {source.isBundledExample && afterglowMessage ? <p className={sourceStyles.notice}>{afterglowMessage}</p> : null}',
          )

          replace_once(
              "app/page.tsx",
              '    setToast("Afterglow — PlotPickle Example Story is open read-only. Explore freely, then choose Make My Own Copy before editing.");',
              '    setToast("Afterglow — PlotPickle Example Story is open read-only across the Story Planner, all 96 Treatment positions, and Visual Storyboard context. Unreconciled material is clearly marked. Choose Make My Own Copy before editing.");',
          )

          for temporary in (
              ".github/workflows/phase5-failure-diagnostics.yml",
              ".github/workflows/phase5-apply-repair.yml",
          ):
              Path(temporary).unlink(missing_ok=True)
          PY

      - name: Commit focused repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard-command-centre.tsx app/page.tsx .github/workflows/phase5-failure-diagnostics.yml .github/workflows/phase5-apply-repair.yml
          git diff --cached --check
          git commit -m "Restore dashboard and treatment regression contracts"
          git push origin HEAD:agent/afterglow-example-boundary
