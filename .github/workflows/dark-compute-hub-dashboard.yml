name: Dark Compute Hub Dashboard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/appearance-runtime.tsx"
      - "app/appearance-runtime.css"
      - "app/layout.tsx"
      - "app/compute-hub-dashboard.tsx"
      - "app/compute-hub-dashboard.module.css"
      - "app/dashboard-command-centre.tsx"
      - "build/local-system-status-gateway.ts"
      - "lib/ai/settings.ts"
      - "vite.config.ts"
      - "tests/issue-360-dark-compute-hub-dashboard.test.mjs"
      - ".github/workflows/dark-compute-hub-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dark-compute-hub-dashboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compute-hub-contract:
    name: Dark Compute Hub contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: node --test tests/issue-360-dark-compute-hub-dashboard.test.mjs
      - run: node --check tests/issue-360-dark-compute-hub-dashboard.test.mjs
