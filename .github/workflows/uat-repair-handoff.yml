name: UAT Repair Handoff

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  mark-local-repair-ready:
    if: github.event.label.name == 'uat:auto-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Point the finding at the real local repair agent
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "PlotPickle UAT marked this blocker for the real local Repair Agent. On the PlotPickle workstation run: \`node scripts/run-uat-repair-agent.mjs --issue ${ISSUE_NUMBER}\`. The local agent prefers Qwen3.8-27B, works in an isolated git worktree, writes the regression/fix, runs focused UAT + the production build, then creates the tested draft repair PR. GitHub Actions no longer creates an empty placeholder PR for this label."
