    <path d="M48 18 53 36 69 27 60 42 78 48 60 54 69 69 53 60 48 78 43 60 27 69 36 54 18 48 36 42 27 27 43 36Z" fill="#121817" stroke="url(#gold)" stroke-width="2.4"/>
