name: Apply connection dashboard repair

on:
  push:
    branches:
      - agent/comfyui-buzz-refine-fixes
    paths:
      - .github/workflows/apply-comfyui-buzz-refine-fixes.yml

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/comfyui-buzz-refine-fixes
          fetch-depth: 0
      - name: Apply reviewed repair patch
        shell: bash
        env:
          PATCH_00: 
          PATCH_01: 
          PATCH_02: 
          PATCH_03: 
          PATCH_04: 
          PATCH_05: 
        run: |
          printf '%s%s%s%s%s%s' "$PATCH_00" "$PATCH_01" "$PATCH_02" "$PATCH_03" "$PATCH_04" "$PATCH_05" | base64 --decode | gzip --decompress > /tmp/plotpickle-fixes.patch
          git apply --index --whitespace=error-all /tmp/plotpickle-fixes.patch
          rm .github/workflows/apply-comfyui-buzz-refine-fixes.yml
          git config user.name "PlotPickle Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix connection dashboard and Refine navigation"
          git push origin HEAD:agent/comfyui-buzz-refine-fixes
