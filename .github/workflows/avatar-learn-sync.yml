name: Avatar and LEARN Sync

on:
  pull_request:
    branches: [main]
    paths:
      - "core/identity/account-learn-sync-core.mjs"
      - "core/identity/account-learn-sync.ts"
      - "docs/architecture/AVATAR-RECOVERY-LEARN-SYNC.md"
      - "tests/issue-1073-avatar-recovery-learn-sync.test.mjs"
      - ".github/workflows/avatar-learn-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avatar-learn-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase-b-sync:
    name: Avatar recovery and two-client LEARN sync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate Avatar claim, recovery and two-client LEARN reconciliation
        run: node --test tests/issue-1073-avatar-recovery-learn-sync.test.mjs

      - name: Validate Phase A identity and existing Node/BUZZ compatibility
        run: node --test tests/issue-1072-identity-authority.test.mjs tests/issue-927-studio-identity.test.mjs tests/issue-928-playhouse-federation.test.mjs tests/issue-1013-plotpickle-node-topology.test.mjs

      - name: Production build
        run: npm run build
