name: Complete Phase B validation

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-b-diagnostic-craft-014
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Align final ledger diagnosis and clean diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          diagnostics = Path('lib/craft-diagnostics.ts')
          source = diagnostics.read_text(encoding='utf-8')
          old = '`Payoff in Block ${entry.payoffBlock} has no visible setup`'
          new = '`Unearned payoff in Block ${entry.payoffBlock} has no visible setup`'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise RuntimeError('Unearned payoff diagnosis was not found')
          diagnostics.write_text(source, encoding='utf-8')

          for path in [
              '.github/workflows/finalize-phase-b.yml',
              'docs/phase-b-final-lint.log',
              'docs/phase-b-final-lint.exit',
              'docs/phase-b-final-test.log',
              'docs/phase-b-final-test.exit',
          ]:
              item = Path(path)
              if item.exists():
                  item.unlink()
          PY
      - run: npm ci
      - name: Validate complete Phase B candidate
        run: |
          npm run lint
          npm test
      - name: Commit clean PlotPickle 0.14 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete and validate PlotPickle 0.14"
          git push origin HEAD:agent/phase-b-diagnostic-craft-014
