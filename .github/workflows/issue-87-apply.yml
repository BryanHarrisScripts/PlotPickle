name: Issue 87 apply navigation cleanup

on:
  push:
    branches: [agent/issue-87-navigation-cleanup]
    paths:
      - 'scripts/apply-issue-87.mjs'
      - '.github/workflows/issue-87-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-87-navigation-cleanup
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: node scripts/apply-issue-87.mjs
      - name: Commit product changes and remove temporary migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Issue #87: simplify navigation and setup' || exit 0
          git push
