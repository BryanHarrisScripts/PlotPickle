name: Issue 52 final refinements

on:
  push:
    branches:
      - issue-52-contributor-handbook
    paths:
      - .github/issue52-final-ready

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-52-contributor-handbook
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/issue52-final-refinements.mjs
      - run: git rm scripts/issue52-final-refinements.mjs .github/workflows/issue52-final-refinements.yml .github/issue52-final-ready
      - name: Commit final refinements
        run: |
          git config user.name "PlotPickle Actions"
          git config user.email "actions@users.noreply.github.com"
          git add lib/collaboration-handbook.ts app/collaboration-handbook/page.tsx app/learning-working-together.ts tests/issue-52-contributor-handbook.test.mjs
          git commit -m "Complete contributor invitation and Afterglow guidance"
          git push origin HEAD:issue-52-contributor-handbook
