name: BUZZ Mastra Orchestration

on:
  pull_request:
    branches: [main]
    paths:
      - "config/agent-orchestration.json"
      - "config/agent-profiles.json"
      - "lib/agents/agent-orchestration.ts"
      - "lib/agents/context/context-engine.ts"
      - "lib/adaptive-context-strategy-core.mjs"
      - "lib/agents/context/adaptive-context-strategies.ts"
      - "lib/harness-improvement-core.mjs"
      - "lib/harness-improvement-proposals.ts"
      - "lib/responsibility-runs.ts"
      - "lib/responsibility-run-interrupts.ts"
      - "lib/responsibility-graph.ts"
      - "modules/creative-room/sage-context-engine.ts"
      - "tests/issue-1003-harness-improvement-proposals.test.mjs"
      - "tests/issue-977-buzz-mastra-orchestration.test.mjs"
      - "docs/architecture/HARNESS-IMPROVEMENT-PROPOSALS.md"
      - "docs/buzz-mastra-orchestration.md"
      - ".github/workflows/buzz-mastra-orchestration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buzz-mastra-orchestration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Execution ownership and handoff boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate BUZZ and Mastra orchestration boundary
        run: node --test tests/issue-977-buzz-mastra-orchestration.test.mjs

      - name: Validate bounded harness improvements and adaptive context
        run: node --test tests/issue-1003-harness-improvement-proposals.test.mjs

      - name: Recheck Agent Contract and Context trust
        run: node --test tests/issue-962-agent-profiles.test.mjs tests/issue-963-context-engine.test.mjs

      - name: Recheck Responsibility Run and Graph authority
        run: node --test tests/issue-966-responsibility-runs.test.mjs tests/issue-967-safe-graph-workflows.test.mjs

      - name: Recheck connector/egress boundary
        run: node --test tests/issue-965-connector-trust-policy.test.mjs
