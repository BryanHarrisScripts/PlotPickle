<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Community relic</title>
  <desc id="desc">A transparent PlotPickle guild sigil with three gold figures gathered around a teal lantern gem.</desc>
