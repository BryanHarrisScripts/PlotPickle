name: Apply Afterglow example boundary

on:
  push:
    branches:
      - agent/afterglow-example-boundary
    paths:
      - scripts/apply-afterglow-example-boundary.mjs
      - .github/workflows/apply-afterglow-example-boundary.yml

permissions:
  contents: write

concurrency:
  group: apply-afterglow-example-boundary
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/afterglow-example-boundary
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Apply protected example boundary
        run: node scripts/apply-afterglow-example-boundary.mjs
      - name: Remove one-time patch files
        run: |
          rm scripts/apply-afterglow-example-boundary.mjs
          rm .github/workflows/apply-afterglow-example-boundary.yml
      - name: Validate and commit generated changes
        shell: bash
        run: |
          git diff --check
          git config user.name "PlotPickle automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Enforce the Afterglow example-only boundary"
          git push origin HEAD:agent/afterglow-example-boundary
