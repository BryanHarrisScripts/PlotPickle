name: Capture Visual Board build failure

on:
  push:
    branches:
      - agent/pickle-draft-visual-fit

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, 'Record Visual Board build output') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pickle-draft-visual-fit
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Capture build and tests
        run: |
          set +e
          npm test > visual-fit-build.log 2>&1
          status=$?
          echo "EXIT_STATUS=$status" >> visual-fit-build.log
          exit 0
      - run: rm .github/workflows/capture-visual-fit-build.yml
      - name: Commit captured output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-fit-build.log .github/workflows/capture-visual-fit-build.yml
          git commit -m "Record Visual Board build output"
          git push origin HEAD:agent/pickle-draft-visual-fit
