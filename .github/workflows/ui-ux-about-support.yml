name: UI/UX About and support

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/about/**"
      - "app/about-*.tsx"
      - "app/about*.tsx"
      - "docs/ABOUT*"
      - "docs/*origins*"
      - "docs/*principles*"
      - "tests/issue-59-about-origins-principles.test.mjs"
      - ".github/workflows/ui-ux-about-support.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-ux-about-support-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  about-support-contract:
    name: About and support UX contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: node --test tests/issue-59-about-origins-principles.test.mjs
