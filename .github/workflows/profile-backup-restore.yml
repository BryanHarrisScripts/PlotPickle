name: Profile Backup and Portable Restore

on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/auth/profile-backup/**"
      - "core/auth/profile-backup/**"
      - "core/auth/profile-experience/**"
      - "core/auth/plotpickle-auth*"
      - "core/auth/profile-crypto-contract*"
      - "core/storage/profile-private/**"
      - "docs/architecture/PLOTPICKLE-PROFILE-BACKUP.md"
      - "tests/issue-1145-profile-backup.test.mjs"
      - ".github/workflows/profile-backup-restore.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-backup-restore-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore:
    name: ${{ matrix.label }} backup restore and build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
          - label: Linux x64
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate portable Human backup and restore
        run: node --test tests/issue-1145-profile-backup.test.mjs
      - name: Validate inherited profile-vault boundary
        run: npm run test:profile-vault
      - name: Validate inherited profile storage
        run: npm run test:profile-storage
      - name: Validate inherited server sessions
        run: npm run test:server-session
      - name: Validate inherited profile experience
        run: npm run test:profile-experience
      - name: Validate inherited BUZZ profile and agent scope
        run: node --test tests/issue-1144-buzz-profile-agent-scope.test.mjs tests/issue-1144-buzz-profile-migration-contract.test.mjs
      - name: Audit credential boundaries
        run: npm run audit:credentials
      - name: Production build
        run: npm run build
