name: Apply Phase 7B

on:
  push:
    branches:
      - agent/graphic-novel-phase-7b

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply verified Phase 7B payload
        shell: bash
        run: |
          set -euo pipefail
          cat .phase7b/chunk-* > /tmp/phase7b.b64
          base64 -d /tmp/phase7b.b64 > /tmp/phase7b.tar.gz
          echo "a5c7e98b677aa1aca9449c0a1f883837b3b8177fb4024a8ad0fbdf5352d6e04c  /tmp/phase7b.tar.gz" | sha256sum -c -
          tar -xzf /tmp/phase7b.tar.gz -C .
          rm -rf .phase7b
          rm .github/workflows/phase7b-apply.yml
          git config user.name "PlotPickle Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete Graphic Novel Phase 7B viewer"
          git push
