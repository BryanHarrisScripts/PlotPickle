name: Finalize Phase B validation

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-b-diagnostic-craft-014
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Finalize diagnostic language and release contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          diagnostics = Path('lib/craft-diagnostics.ts')
          source = diagnostics.read_text(encoding='utf-8')
          old = 'title: "The scene closes on its opening value"'
          new = 'title: "No value flip changes the scene opening condition"'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise RuntimeError('Scene value diagnostic title was not found')
          diagnostics.write_text(source, encoding='utf-8')

          licensing = Path('tests/project-navigation-licensing.test.mjs')
          source = licensing.read_text(encoding='utf-8')
          old = 'assert.equal(packageJson.version, "0.13.0");'
          new = 'assert.equal(packageJson.version, "0.14.0");'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise RuntimeError('Release version assertion was not found')
          licensing.write_text(source, encoding='utf-8')

          for path in [
              'docs/phase-b-build.log',
              'docs/phase-b-build.exit',
              'docs/phase-b-test.log',
              'docs/phase-b-test.exit',
          ]:
              item = Path(path)
              if item.exists():
                  item.unlink()
          PY
      - run: npm ci
      - name: Capture final Phase B validation
        run: |
          set +e
          npm run lint > docs/phase-b-final-lint.log 2>&1
          echo $? > docs/phase-b-final-lint.exit
          npm test > docs/phase-b-final-test.log 2>&1
          echo $? > docs/phase-b-final-test.exit
          exit 0
      - name: Commit patched candidate and validation output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply and validate final PlotPickle 0.14 fixes"
          git push origin HEAD:agent/phase-b-diagnostic-craft-014
