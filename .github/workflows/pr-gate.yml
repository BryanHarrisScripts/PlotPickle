name: PR Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Bootstrap patched security dependency graph
        if: github.event_name == 'pull_request' && github.head_ref == 'issue-1819-security-js-yaml-sharp'
        shell: bash
        run: |
          if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const sharp = lock.packages?.['node_modules/miniflare/node_modules/sharp']?.version;
          const yaml = lock.packages?.['node_modules/js-yaml']?.version;
          const ready = pkg.dependencies?.['@cloudflare/vite-plugin'] === '1.54.6'
            && pkg.dependencies?.wrangler === '4.130.0'
            && pkg.overrides?.['js-yaml'] === '4.3.2'
            && yaml === '4.3.2'
            && sharp !== '0.35.2';
          process.exit(ready ? 0 : 1);
          NODE
          then
            echo 'Security dependency graph already refreshed.'
          else
            npm pkg set "dependencies.@cloudflare/vite-plugin=1.54.6" "dependencies.wrangler=4.130.0" "overrides.js-yaml=4.3.2"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name 'PlotPickle Security Bot'
            git config user.email 'bryan@bryanharris.ca'
            git add package.json package-lock.json
            git commit -m 'security: patch js-yaml and nested sharp graph'
            git push origin HEAD:${GITHUB_HEAD_REF}
            exit 0
          fi

      - name: Install PlotPickle dependencies once
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate two-gate CI topology
        run: node --test tests/issue-1747-ci-two-gates.test.mjs tests/issue-538-ci-consolidation.test.mjs

      - name: Validate current Experience architecture boundary
        run: node --test tests/issue-1754-story-workspace-boundary.test.mjs tests/issue-1647-universal-lifecycle-contract.test.mjs tests/issue-1754-skin-v1-logon.test.mjs tests/community-skin-v1-navigation.test.mjs tests/community-agent-roster.test.mjs tests/issue-1788-webmcp-surface-visual-uat.test.mjs tests/issue-1793-startup-webmcp-uat.test.mjs tests/issue-1815-locked-visual-baselines.test.mjs

      - name: Validate generated architecture documentation
        run: node --test tests/architecture-blueprint-generator.test.mjs

      - name: Validate core auth and storage contracts
        run: |
          npm run test:plotpickle-auth
          npm run audit:credentials
          node --test tests/issue-1142-server-session-boundary.test.mjs tests/issue-1122-library-persistence.test.mjs

      - name: Validate bundled local video setup
        run: node --test tests/ltx-bundled-default.test.mjs tests/local-ai-plugin-registry.test.mjs

      - name: Production web build
        run: npm run build

      - name: Upload PR Gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-${{ github.run_id }}
          path: |
            .artifacts/
          if-no-files-found: warn
          retention-days: 7
