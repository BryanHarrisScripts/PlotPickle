name: Apply issue 104 Windows command fix

on:
  push:
    branches:
      - agent/issue-104-windows-command-spawn

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-104-windows-command-spawn
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply Windows command fix
        run: |
          node scripts/issue-104-apply.mjs
          rm scripts/issue-104-apply.mjs
          rm .github/workflows/issue-104-apply.yml
      - name: Commit permanent product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Windows command paths for Lighthouse"
          git push origin HEAD:agent/issue-104-windows-command-spawn
