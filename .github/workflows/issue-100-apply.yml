name: Apply issue 100 premium UI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issue-100-premium-ui-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-100-premium-ui-ux
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply premium UI migration
        run: |
          set +e
          node scripts/issue-100-shell.mjs > .issue-100-migration.log 2>&1
          shell_status=$?
          node scripts/issue-100-reports-tests.mjs >> .issue-100-migration.log 2>&1
          tests_status=$?
          set -e
          if [ "$shell_status" -ne 0 ] || [ "$tests_status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .issue-100-migration.log
            git commit -m "Record issue 100 migration failure" || true
            git push origin HEAD:agent/issue-100-premium-ui-ux
            exit 1
          fi
          rm .issue-100-migration.log
          rm scripts/issue-100-shell.mjs
          rm scripts/issue-100-reports-tests.mjs
          rm .github/workflows/issue-100-apply.yml
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build premium UI UX consistency pass"
          git push origin HEAD:agent/issue-100-premium-ui-ux
