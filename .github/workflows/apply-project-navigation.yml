name: Apply Project Navigation and Licence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-project-navigation.yml
      - scripts/apply-project-navigation.mjs
      - app/project-overview.tsx
      - app/project-overview.module.css
      - app/structure-map-summary.tsx
      - app/structure-map-summary.module.css
      - lib/project-progress.ts
      - LICENSES.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add official AGPLv3 licence text
        run: curl --fail --silent --show-error --location https://www.gnu.org/licenses/agpl-3.0.txt --output LICENSE

      - name: Apply grouped navigation with diagnostic report
        id: migrate
        shell: bash
        run: |
          set +e
          node --check scripts/apply-project-navigation.mjs > migration-report.txt 2>&1
          CHECK_STATUS=$?
          if [ "$CHECK_STATUS" -eq 0 ]; then
            node scripts/apply-project-navigation.mjs >> migration-report.txt 2>&1
            MIGRATION_STATUS=$?
          else
            MIGRATION_STATUS=$CHECK_STATUS
          fi
          echo "exit_code=$MIGRATION_STATUS" >> migration-report.txt
          echo "migration_status=$MIGRATION_STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit application changes and migration report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx LICENSE migration-report.txt
          if git diff --cached --quiet; then
            echo "Navigation and licence were already applied."
            exit 0
          fi
          git commit -m "Apply guided project rail and open licensing"
          git push

      - name: Fail after preserving diagnostic report
        if: steps.migrate.outputs.migration_status != '0'
        run: |
          echo "The migration failed. See migration-report.txt in the repository."
          exit 1
