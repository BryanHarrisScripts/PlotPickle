name: Apply Phase 2 dynamic scenes

on:
  push:
    branches: [agent/phase-2-dynamic-scenes]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-2-dynamic-scenes
          fetch-depth: 0

      - name: Apply staged Phase 2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .phase2/patch-00.b64 .phase2/patch-01.b64 .phase2/patch-02.b64 .phase2/patch-rest.b64 > /tmp/phase2.patch.b64
          base64 --decode /tmp/phase2.patch.b64 > /tmp/phase2.patch.gz
          gunzip -c /tmp/phase2.patch.gz > /tmp/phase2.patch
          patch --batch --forward -p1 < /tmp/phase2.patch
          rm -rf .phase2
          rm -f .github/workflows/phase-two-source-snapshot.yml
          rm -f .github/workflows/phase-two-publish.yml

      - name: Commit Phase 2 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PlotPickle Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete Phase 2 dynamic scene management"
          git push origin HEAD:agent/phase-2-dynamic-scenes
