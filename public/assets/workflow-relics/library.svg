<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Library relic</title>
  <desc id="desc">A PlotPickle archive seal with an open brass-bound book, iron frame and teal memory gem.</desc>
  <defs>
    <radialGradient id="gem" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#effffc"/>
      <stop offset="0.22" stop-color="#7cf1df"/>
      <stop offset="0.58" stop-color="#2aa99a"/>
      <stop offset="1" stop-color="#0a403c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4b20"/>
