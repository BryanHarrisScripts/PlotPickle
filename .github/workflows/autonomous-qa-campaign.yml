name: Autonomous QA Campaign

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'
    - cron: '43 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-qa-campaign-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-build:
    name: contract-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate autonomous QA campaign contracts
        run: node --test tests/issue-1571-autonomous-qa-*.test.mjs
      - name: Verify production build
        run: npm run build

  deep-afterglow:
    name: deep-afterglow
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '43 8 * * 0'
    uses: ./.github/workflows/autonomous-story-reference.yml

  windows-install:
    name: windows-install
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 8 * * 0'
    uses: ./.github/workflows/windows-installer.yml
