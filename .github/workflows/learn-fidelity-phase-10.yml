name: LEARN Fidelity Phase 10

on:
  push:
    branches:
      - issue-2094-phase-10
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learn-fidelity-phase-10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fidelity:
    name: LEARN Fidelity Focused Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Run #2094 final audit test
        run: node --test tests/issue-2094-lesson-integration.test.mjs

      - name: Run retained-source regression
        run: node --test tests/issue-2078-learn-source-drain.test.mjs

      - name: Validate LEARN curriculum
        run: node scripts/validate-learn-curriculum.mjs

      - name: Count learner and bundled-source words
        run: node scripts/learn-curriculum-word-count.mjs

      - name: Upload word-count report
        uses: actions/upload-artifact@v4
        with:
          name: learn-fidelity-word-count-${{ github.run_id }}
          path: .artifacts/learn-fidelity/word-count.json
          if-no-files-found: error
          retention-days: 7
