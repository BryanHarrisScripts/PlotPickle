name: Issue 87 full-suite diagnostics

on:
  pull_request:
    branches: [main]

jobs:
  remaining-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: diagnostic-craft
            test: tests/phase-b-diagnostic-craft.test.mjs
          - name: specialist-labs
            test: tests/phase-c-specialist-labs.test.mjs
          - name: pitch-review
            test: tests/phase-d-pitch-review.test.mjs
          - name: page-to-production
            test: tests/phase-e-page-to-production.test.mjs
          - name: collaboration-release
            test: tests/phase-f-collaboration-release.test.mjs
          - name: reports-terms-collaboration
            test: tests/issue-26-reports-terms-collaboration.test.mjs
          - name: story-tools-reports-docs
            test: tests/story-tools-reports-docs.test.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test ${{ matrix.test }}
