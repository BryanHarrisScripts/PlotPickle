name: Finalize Phase C

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-c-specialist-labs-015
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply Phase C integration corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('lib/specialist-labs.ts')
          source = engine.read_text(encoding='utf-8')
          old = '  let next = cloneProject(project);'
          new = '  const next = cloneProject(project);'
          if source.count(old) != 1:
              raise RuntimeError('Expected one mutable specialist project declaration')
          engine.write_text(source.replace(old, new, 1), encoding='utf-8')

          css = Path('app/engine-hub.module.css')
          source = css.read_text(encoding='utf-8')
          old = 'grid-template-columns: repeat(6, minmax(0, 1fr));'
          new = 'grid-template-columns: repeat(7, minmax(0, 1fr));'
          if source.count(old) != 1:
              raise RuntimeError('Expected one six-column engine process declaration')
          css.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - run: npm ci
      - name: Validate Phase C
        id: validate
        run: |
          set +e
          npm run lint > docs/phase-c-final-lint.log 2>&1
          LINT_STATUS=$?
          npm test > docs/phase-c-final-test.log 2>&1
          TEST_STATUS=$?
          echo "$LINT_STATUS" > docs/phase-c-final-lint.exit
          echo "$TEST_STATUS" > docs/phase-c-final-test.exit
          echo "lint_status=$LINT_STATUS" >> "$GITHUB_OUTPUT"
          echo "test_status=$TEST_STATUS" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit Phase C result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.validate.outputs.lint_status }}" = "0" ] && [ "${{ steps.validate.outputs.test_status }}" = "0" ]; then
            rm -f .github/workflows/capture-phase-c-lint.yml .github/workflows/finalize-phase-c.yml
            rm -f docs/phase-c-lint.log docs/phase-c-lint.exit
            rm -f docs/phase-c-final-lint.log docs/phase-c-final-lint.exit docs/phase-c-final-test.log docs/phase-c-final-test.exit
            git add -A
            git commit -m "Finalize and validate PlotPickle 0.15"
          else
            git add -A
            git commit -m "Capture Phase C final validation"
          fi
          git push origin HEAD:agent/phase-c-specialist-labs-015
      - name: Fail when validation failed
        if: steps.validate.outputs.lint_status != '0' || steps.validate.outputs.test_status != '0'
        run: exit 1
