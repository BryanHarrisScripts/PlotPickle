name: Issue 113 concise diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Diagnose build and tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch "$GITHUB_HEAD_REF" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          if [[ -f docs/issue-113-diagnostic.txt ]]; then
            echo "Diagnostic excerpt already captured."
            exit 0
          fi
          npm ci --silent >/dev/null 2>&1
          if ! npm run build > /tmp/issue-113-build.log 2>&1; then
            tail -n 200 /tmp/issue-113-build.log > docs/issue-113-diagnostic.txt
          else
            TEST_FILES=$(node -e 'const p=require("./package.json"); console.log(p.scripts.test.replace(/^npm run build && node --test /, ""))')
            if node --test $TEST_FILES > /tmp/issue-113-tests.log 2>&1; then
              echo "Issue #113 build and full regression suite passed."
              exit 0
            fi
            awk '
              /^not ok / {capture=1; blocks++; lines=0}
              capture {print; lines++}
              capture && lines >= 80 {capture=0}
            ' /tmp/issue-113-tests.log > docs/issue-113-diagnostic.txt
          fi
          git config user.name "PlotPickle Automation"
          git config user.email "actions@users.noreply.github.com"
          git add docs/issue-113-diagnostic.txt
          git commit -m "[issue-113-diagnostic] Capture remaining regression"
          git push origin HEAD:${GITHUB_HEAD_REF}
          echo "Captured remaining regression in docs/issue-113-diagnostic.txt."
          exit 1
