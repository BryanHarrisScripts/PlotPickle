name: Issue 1499 Foundations Story Runtime Move

on:
  push:
    branches:
      - architecture/1499-foundations-story-runtime

permissions:
  contents: write

jobs:
  apply-foundations-runtime-move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/1499-foundations-story-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Apply ratified Foundations Story Workflow runtime move
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p modules/story-workflow/runtime
          git mv modules/story-workflow/foundations-story-workflow.ts modules/story-workflow/runtime/foundations-story-workflow.ts

          python - <<'PY'
          from pathlib import Path

          moved_path = Path('modules/story-workflow/runtime/foundations-story-workflow.ts')
          moved = moved_path.read_text(encoding='utf-8')
          for owner in ('adapters', 'core', 'lib'):
              old = f'from "../../{owner}/'
              new = f'from "../../../{owner}/'
              if old not in moved:
                  raise SystemExit(f'Expected {old} imports in moved Foundations runtime')
              moved = moved.replace(old, new)
          moved_path.write_text(moved, encoding='utf-8')

          consumers = [
              Path('modules/story-workflow/ui/foundations-buzz-story-live-test.tsx'),
              Path('modules/story-workflow/ui/foundations-story-workflow-panel.tsx'),
              Path('modules/story-workflow/workbench/workflow.ts'),
          ]
          for path in consumers:
              text = path.read_text(encoding='utf-8')
              old = '../foundations-story-workflow'
              new = '../runtime/foundations-story-workflow'
              if old not in text:
                  raise SystemExit(f'Expected Foundations Story Workflow import not found in {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          test_path = Path('tests/issue-1416-story-workflow-engine.test.mjs')
          text = test_path.read_text(encoding='utf-8')
          old = 'modules/story-workflow/foundations-story-workflow.ts'
          new = 'modules/story-workflow/runtime/foundations-story-workflow.ts'
          if old not in text:
              raise SystemExit('Expected #1416 hardcoded Foundations Story Workflow source path not found')
          test_path.write_text(text.replace(old, new), encoding='utf-8')

          config_path = Path('config/repository-architecture-target.json')
          config = config_path.read_text(encoding='utf-8')
          old_batch = '    {"id":"phase2-modules-story-runtime","phase":2,"domain":"story","sourceRoot":"modules/story-workflow","targetRoot":"modules/story-workflow/runtime","directFilesOnly":true,"selector":{"files":["foundations-story-workflow.ts"]}},'
          new_batch = '    {"id":"phase2-modules-story-runtime","phase":2,"domain":"story","sourceRoot":"modules/story-workflow","targetRoot":"modules/story-workflow/runtime","directFilesOnly":true,"selector":{"files":["foundations-story-workflow.ts"]},"status":"completed","completedAt":"2026-08-27","completedSources":["modules/story-workflow/foundations-story-workflow.ts"],"completedTargets":["modules/story-workflow/runtime/foundations-story-workflow.ts"]},'
          if config.count(old_batch) != 1:
              raise SystemExit(f'Expected exactly one active phase2-modules-story-runtime batch; found {config.count(old_batch)}')
          config_path.write_text(config.replace(old_batch, new_batch), encoding='utf-8')
          PY

          cat > tests/issue-1499-foundations-story-runtime-move.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { access, readFile } from "node:fs/promises";
          import test from "node:test";

          const root = new URL("..", import.meta.url);
          const source = (path) => readFile(new URL(path, root), "utf8");

          test("#1499 moves the Foundations Story Workflow adapter to its runtime owner", async () => {
            await assert.rejects(access(new URL("modules/story-workflow/foundations-story-workflow.ts", root)));
            const runtime = await source("modules/story-workflow/runtime/foundations-story-workflow.ts");
            assert.match(runtime, /from "\.\.\/\.\.\/\.\.\/adapters\/curriculum\/current-catalog"/);
            assert.match(runtime, /from "\.\.\/\.\.\/\.\.\/core\/story-workflow\/story-workflow-core\.mjs"/);
            assert.match(runtime, /from "\.\.\/\.\.\/\.\.\/lib\/agents\/context\/context-engine"/);
          });

          test("#1499 retargets all three live module consumers", async () => {
            for (const path of [
              "modules/story-workflow/ui/foundations-buzz-story-live-test.tsx",
              "modules/story-workflow/ui/foundations-story-workflow-panel.tsx",
              "modules/story-workflow/workbench/workflow.ts",
            ]) {
              const content = await source(path);
              assert.match(content, /\.\.\/runtime\/foundations-story-workflow/);
              assert.doesNotMatch(content, /\.\.\/foundations-story-workflow["']/);
            }
          });

          test("#1499 preserves proposal-only Story Workflow authority boundaries", async () => {
            const runtime = await source("modules/story-workflow/runtime/foundations-story-workflow.ts");
            assert.match(runtime, /priority: waitingHuman \? "blocking" : "high"/);
            assert.match(runtime, /Only queued Story Work Items may start a Responsibility Run/);
            assert.match(runtime, /Creative changes remain proposals\. Never write PPF\/canon directly/);
            assert.match(runtime, /verificationMode: "writer-approval"/);
            assert.match(runtime, /cloudCostBudgetUsd: 0/);
          });

          test("#1499 marks the machine-readable batch complete while keeping the Phase 0 history", async () => {
            const contract = JSON.parse(await source("config/repository-architecture-target.json"));
            const batch = contract.moveBatches.find((item) => item.id === "phase2-modules-story-runtime");
            assert.equal(batch?.sourceRoot, "modules/story-workflow");
            assert.equal(batch?.targetRoot, "modules/story-workflow/runtime");
            assert.equal(batch?.status, "completed");
            assert.deepEqual(batch?.completedSources, ["modules/story-workflow/foundations-story-workflow.ts"]);
            assert.deepEqual(batch?.completedTargets, ["modules/story-workflow/runtime/foundations-story-workflow.ts"]);

            const history = await source("docs/architecture/REPOSITORY-ARCHITECTURE-TARGET.md");
            assert.match(history, /`modules\/story-workflow\/foundations-story-workflow\.ts` → `modules\/story-workflow\/runtime\/`/);
          });
          EOF

          node --test \
            tests/issue-1416-story-workflow-engine.test.mjs \
            tests/issue-1499-foundations-story-runtime-move.test.mjs \
            tests/issue-1461-repository-architecture-inventory.test.mjs
          git diff --check

          git rm .github/workflows/issue-1499-foundations-runtime-move.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(#1499): move Foundations Story Workflow to runtime domain"
          git push origin HEAD:architecture/1499-foundations-story-runtime
