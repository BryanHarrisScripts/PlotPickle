name: Temporary RC3 Test Capture

on:
  push:
    branches:
      - agent/story-tools-reports-readme-tabs
    paths:
      - RC3-TEST-DIAGNOSTIC.txt

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-tools-reports-readme-tabs
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - name: Capture test failures only
        shell: bash
        run: |
          set +e
          npm test > /tmp/rc3-test-full.log 2>&1
          code=$?
          grep -n -B 18 -A 35 -E 'not ok|AssertionError|ERR_ASSERTION|ERR_TEST_FAILURE|# fail|Build failed|error TS' /tmp/rc3-test-full.log > docs/rc3-test-failures.log || true
          echo "$code" > docs/rc3-test.exit
          exit 0
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "PlotPickle Diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add docs/rc3-test-failures.log docs/rc3-test.exit
          git commit -m "Capture RC3 failure diagnostics"
          git push origin HEAD:agent/story-tools-reports-readme-tabs
