name: Local Endpoint Registry

on:
  pull_request:
    paths:
      - "core/runtime/local-endpoint-registry.mjs"
      - "scripts/local-endpoint-*.mjs"
      - "scripts/full-verification-graph.mjs"
      - "scripts/full-verification-progress-runner.mjs"
      - "scripts/writer-app-runtime.mjs"
      - "scripts/run-writer-in-residence.mjs"
      - "scripts/run-exhaustive-ui-uat.mjs"
      - "build/local-instance-proof-gateway.ts"
      - "vite.config.ts"
      - "tests/issue-1155-local-endpoint-registry.test.mjs"
      - "tests/issue-1036-standalone-full-verification-windows.test.mjs"
      - ".github/workflows/local-endpoint-registry.yml"

permissions:
  contents: read

jobs:
  endpoint-registry:
    name: ${{ matrix.name }} endpoint registry and build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.19
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate endpoint identity and UAT migrations
        run: >-
          node --test
          tests/issue-1155-local-endpoint-registry.test.mjs
          tests/issue-1036-standalone-full-verification-windows.test.mjs
          tests/issue-989-verification-execution-graph.test.mjs
          tests/issue-1108-writer-app-preflight.test.mjs
          tests/issue-1170-writer-observer-stabilization.test.mjs

      - name: Production build
        run: npm run build
