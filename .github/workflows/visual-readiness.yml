name: Visual Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [issue/1715-phase1d-state-gallery-cls-story-zero]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-readiness-contract:
    name: visual-readiness-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate Phase 1 UI foundation contract
        run: node --test tests/issue-1715-ui-foundation.test.mjs
      - name: Validate Phase 1B axe accessibility contract
        run: node --test tests/issue-1715-ui-axe-accessibility.test.mjs
      - name: Validate Phase 1C resilience contract
        run: node --test tests/issue-1715-ui-resilience.test.mjs tests/issue-349-common-overlays-ux.test.mjs
      - name: Validate Phase 1D experience and STORY zero-state contract
        run: node --test tests/issue-1715-ui-experience-lab.test.mjs
      - name: Enforce current UI continuity contract
        run: node --test tests/issue-544-ui-continuity-agent.test.mjs
      - name: Enforce changed UI token/style contract
        if: github.event_name == 'pull_request'
        run: node scripts/ui-stylelint-gate.mjs --base-ref "${{ github.event.pull_request.base.sha }}"
      - name: Enforce Phase 1D pre-PR changed UI token/style contract
        if: github.event_name == 'push'
        shell: bash
        run: |
          BASE_REF="$(git merge-base origin/main HEAD)"
          node scripts/ui-stylelint-gate.mjs --base-ref "$BASE_REF"
      - name: Enforce UI foundation token/style smoke gate
        if: github.event_name != 'pull_request'
        run: node scripts/ui-stylelint-gate.mjs --all-foundation
      - name: Collect changed UI files for 25-point audit
        id: ui-changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}...HEAD" \
            | grep -E '^(app/|components/|modules/.*/ui/).*[.](css|scss|js|jsx|ts|tsx|mjs|cjs)$' > /tmp/plotpickle-ui-files.txt || true
          {
            echo 'files<<EOF'
            cat /tmp/plotpickle-ui-files.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Collect Phase 1D pre-PR UI files for 25-point audit
        id: pre-pr-ui-changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          BASE_REF="$(git merge-base origin/main HEAD)"
          git diff --name-only --diff-filter=ACMR "$BASE_REF...HEAD" \
            | grep -E '^(app/|components/|modules/.*/ui/).*[.](css|scss|js|jsx|ts|tsx|mjs|cjs)$' > /tmp/plotpickle-ui-files.txt || true
          {
            echo 'files<<EOF'
            cat /tmp/plotpickle-ui-files.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Run required 25-point UI/UX code audit
        if: github.event_name == 'pull_request' && steps.ui-changes.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.ui-changes.outputs.files }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node scripts/ui-ux-code-audit.mjs
          node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync('audit-result.json','utf8')); if(r.verdict!=='pass'){console.error(r.summary); process.exit(1)}"
      - name: Run Phase 1D pre-PR 25-point UI/UX code audit
        if: github.event_name == 'push' && steps.pre-pr-ui-changes.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.pre-pr-ui-changes.outputs.files }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node scripts/ui-ux-code-audit.mjs
          node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync('audit-result.json','utf8')); if(r.verdict!=='pass'){console.error(r.summary); process.exit(1)}"
      - name: Validate UI/UX audit runner safeguards
        run: node --test tests/ui-ux-code-audit-runner.test.mjs tests/ui-ux-code-audit-contradictions.test.mjs
      - name: Validate canonical visual readiness contract
        run: node --test tests/issue-1423-visual-readiness.test.mjs tests/issue-1424-storyboard-readiness.test.mjs tests/issue-1424-storyboard-editorial.test.mjs tests/issue-1425-previs-projection.test.mjs tests/issue-1425-production-shots.test.mjs tests/issue-1420-visual-text-projection.test.mjs tests/issue-1420-canonical-screenplay-readiness.test.mjs tests/issue-1420-visible-story-decisions.test.mjs tests/issue-1420-targeted-script-staleness.test.mjs tests/issue-1420-afterglow-vertical-proof.test.mjs tests/issue-1553-autonomous-visual-production.test.mjs tests/issue-1557-character-visual-development.test.mjs tests/issue-1557-character-visual-development-generation.test.mjs tests/issue-1557-character-visual-development-specifications.test.mjs tests/issue-1557-character-visual-development-ui.test.mjs
      - name: Validate existing visual identity and progressive BUILD contracts
        run: node --test tests/issue-83-character-visual-identity.test.mjs tests/issue-1338-progressive-build-story-model.test.mjs tests/issue-1410-afterglow-v9-reference.test.mjs
      - name: Install pinned axe/Playwright verification tooling
        env:
          UI_A11Y_ROOT: ${{ runner.temp }}/plotpickle-ui-a11y
        run: |
          mkdir -p "$UI_A11Y_ROOT"
          printf '{"private":true}\n' > "$UI_A11Y_ROOT/package.json"
          npm install --prefix "$UI_A11Y_ROOT" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @axe-core/playwright@4.13.0 @playwright/test@1.63.0
          "$UI_A11Y_ROOT/node_modules/.bin/playwright" install --with-deps chromium
      - name: Enforce rendered accessibility and experience guardrails
        env:
          UI_A11Y_ROOT: ${{ runner.temp }}/plotpickle-ui-a11y
        shell: bash
        run: |
          npm run dev:local -- --host 127.0.0.1 --port 4173 > /tmp/plotpickle-ui-a11y-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node lib/verification/ui-axe-audit.mjs --server http://127.0.0.1:4173 --tool-root "$UI_A11Y_ROOT" --routes config/ui-axe-routes.json
          node lib/verification/ui-experience-audit.mjs --server http://127.0.0.1:4173 --tool-root "$UI_A11Y_ROOT"
      - name: Production build
        run: npm run build
