name: Apply issue 296 repository naming fix

on:
  push:
    branches:
      - agent/296-repository-name-collisions
    paths:
      - .github/issue-296.patch.b64-*
      - .github/workflows/apply-issue-296.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/296-repository-name-collisions
          fetch-depth: 0
      - name: Use supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          cat .github/issue-296.patch.b64-* | base64 --decode > /tmp/issue-296.patch
          git apply --check /tmp/issue-296.patch
          git apply /tmp/issue-296.patch
      - name: Run focused repository naming tests
        run: node --test tests/issue-296-repository-name-collisions.test.mjs
      - name: Commit implementation and remove staging files
        shell: bash
        run: |
          rm -f .github/issue-296.patch.b64-* .github/workflows/apply-issue-296.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix repository naming and collision numbering (#296)'
          git push origin HEAD:agent/296-repository-name-collisions
