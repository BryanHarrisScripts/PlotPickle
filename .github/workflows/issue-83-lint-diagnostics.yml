name: Issue 83 lint diagnostics

on:
  push:
    branches:
      - agent/issue-83-character-visual-identity
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Capture lint output
        shell: bash
        run: |
          set +e
          npm run lint > issue-83-lint.log 2>&1
          status=$?
          echo "exit_code=$status" >> issue-83-lint.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: issue-83-lint-diagnostics
          path: issue-83-lint.log
          if-no-files-found: error
