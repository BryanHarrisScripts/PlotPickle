    <path d="M32 69c2-12 8-18 16-18s14 6 16 18" fill="#131b19" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="48" cy="36" r="11" fill="#151d1b" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M39 35c2-7 6-10 9-10 5 0 8 4 9 10-3-2-6-3-9-3s-6 1-9 3Z" fill="#242d29" stroke="#b4873d" stroke-width="1.4"/>
