name: PlotPickle Quality

# CI refresh: force a clean workflow run after Actions availability was restored.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Verify committed licence and generated navigation
        run: |
          test -f LICENSE
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          grep -q 'id: "overview", code: "OV", label: "Project Overview"' app/page.tsx
          grep -q 'id: "structureMap", code: "ST", label: "Structure Map"' app/page.tsx

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and smoke test
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/primary-menu-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/primary-menu-test.log .primary-menu-test.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .primary-menu-test.log
            git commit -m "Record primary menu test failure" || true
            git push origin HEAD:${{ github.head_ref }}
            exit "$status"
          fi
