name: Fix PR 243 Settings smoke

on:
  push:
    branches:
      - automation/fix-pr-243-settings-smoke

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/242-buzz-desktop-053-discovery
          fetch-depth: 0

      - name: Apply focused deterministic smoke correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/windows-release-smoke.mjs')
          source = path.read_text(encoding='utf-8')
          old = '''      const opened = await evaluate(client, String.raw`(() => {
        const repos = document.querySelector('button[aria-controls="settings-system-repos"]');
        if (!repos) return false;
        if (repos.getAttribute("aria-expanded") !== "true") repos.click();
        return true;
      })()`);
      if (!opened) throw new Error("Repos was not found in Settings.");
      await waitFor(client, `Boolean(document.querySelector("#settings-system-repos"))`, 20_000, "Repos Settings submenu");
      const clicked = await evaluate(client, String.raw`(() => {
        const normalize = (value) => String(value || "").replace(/\\s+/g, " ").trim();
        const submenu = document.querySelector("#settings-system-repos");
        const button = submenu ? [...submenu.querySelectorAll("button")].find((item) => normalize(item.querySelector("b")?.innerText) === "GitHub Story Repository") : null;
        if (!button) return false;
        button.click();
        return true;
      })()`);
      if (!clicked) throw new Error("GitHub Story Repository was not found in Settings.");
'''
          new = '''      await waitFor(client, String.raw`(() => {
        const normalize = (value) => String(value || "").replace(/\\s+/g, " ").trim();
        const repos = [...document.querySelectorAll('button[aria-controls="settings-system-repos"]')]
          .find((candidate) => normalize(candidate.querySelector("b")?.innerText) === "Repos");
        if (!repos) return false;
        if (repos.getAttribute("aria-expanded") !== "true") {
          repos.click();
          return false;
        }
        const submenu = document.getElementById("settings-system-repos");
        return Boolean([...submenu?.querySelectorAll("button") || []]
          .find((item) => normalize(item.querySelector("b")?.innerText) === "GitHub Story Repository"));
      })()`, 20_000, "GitHub Story Repository Settings item");
      const clicked = await evaluate(client, String.raw`(() => {
        const normalize = (value) => String(value || "").replace(/\\s+/g, " ").trim();
        const submenu = document.getElementById("settings-system-repos");
        const button = [...submenu?.querySelectorAll("button") || []]
          .find((item) => normalize(item.querySelector("b")?.innerText) === "GitHub Story Repository");
        if (!button) return false;
        button.click();
        return true;
      })()`);
      if (!clicked) throw new Error("GitHub Story Repository was not found in Settings.");
'''
          if old not in source:
              raise SystemExit('Expected Settings smoke block was not found; refusing to broaden the edit.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate focused correction
        shell: bash
        run: |
          npm ci
          node --check scripts/windows-release-smoke.mjs
          node --test tests/windows-release-smoke.test.mjs tests/issue-86-lighthouse-audit.test.mjs tests/issue-240-developer-diagnostics.test.mjs tests/issue-240-pr-239-regression.test.mjs

      - name: Commit correction to PR branch
        shell: bash
        run: |
          git config user.name "PlotPickle Automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/windows-release-smoke.mjs
          git commit -m "Fix deterministic Settings submenu smoke"
          git push origin HEAD:agent/242-buzz-desktop-053-discovery

      - name: Remove one-shot automation branch
        if: always()
        shell: bash
        run: git push origin --delete automation/fix-pr-243-settings-smoke || true
