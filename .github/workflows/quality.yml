name: PlotPickle Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Verify committed licence and generated navigation
        run: |
          test -f LICENSE
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          grep -q 'id: "overview", code: "OV", label: "Project Overview"' app/page.tsx
          grep -q 'id: "structureMap", code: "ST", label: "Structure Map"' app/page.tsx

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and smoke test
        run: npm test
