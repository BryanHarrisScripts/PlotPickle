name: Rendered Visual Capture

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rendered-visual-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-capture:
    name: Capture rendered product screens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find changed UI files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            git fetch origin main --no-tags
            base="$(git merge-base HEAD origin/main)"
            head="HEAD"
          fi
          files="$(git diff --name-only --diff-filter=ACMRT "$base" "$head" | grep -E '\.(html|css|scss|jsx|tsx|vue)$|^config/visual-capture-registry\.json$|^scripts/visual-capture\.mjs$' || true)"
          if [[ -n "$files" ]]; then echo 'has_ui=true' >> "$GITHUB_OUTPUT"; else echo 'has_ui=false' >> "$GITHUB_OUTPUT"; fi

      - name: Set up Node
        if: steps.changed.outputs.has_ui == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install dependencies
        if: steps.changed.outputs.has_ui == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Locate Chrome
        if: steps.changed.outputs.has_ui == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser" ]]; then
            echo "Chrome/Chromium is unavailable on this runner." >&2
            exit 1
          fi
          echo "CHROME_PATH=$browser" >> "$GITHUB_ENV"

      - name: Capture rendered visual inventory
        if: steps.changed.outputs.has_ui == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/visual-capture.mjs

      - name: Upload rendered visual artifact
        if: always() && (steps.changed.outputs.has_ui == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plotpickle-rendered-visuals-${{ github.sha }}
          path: reports/visual-capture/
          if-no-files-found: error
          retention-days: 14

      - name: Report no visual capture needed
        if: steps.changed.outputs.has_ui != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No UI or visual-capture files changed; rendered capture was not required."
