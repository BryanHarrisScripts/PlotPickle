name: Profile Private Storage

on:
  pull_request:
    branches: [main]
    paths:
      - "core/storage/**"
      - "core/auth/**"
      - "core/memory/**"
      - "lib/agents/context/memory-context.ts"
      - "app/api/memory/**"
      - "modules/creative-room/*memory*"
      - "build/local-credentials.ts"
      - "build/local-project-gateway.ts"
      - "config/credential-boundary.registry.json"
      - "config/uat-autopilot-registry.json"
      - "docs/CREDENTIAL_BOUNDARY_AUDIT.md"
      - "docs/architecture/PLOTPICKLE-PROFILE-*.md"
      - "scripts/credential-boundary-audit.mjs"
      - "scripts/local-credential-audit.mjs"
      - "scripts/package-platform.mjs"
      - "tests/issue-1122-library-persistence.test.mjs"
      - "tests/issue-1141-profile-private-storage.test.mjs"
      - "tests/issue-1200-scoped-memory-contract.test.mjs"
      - "tests/issue-1201-memory-persistence-isolation.test.mjs"
      - "tests/issue-1202-bounded-memory-retrieval.test.mjs"
      - "tests/issue-1203-sage-avery-memory-continuity.test.mjs"
      - "tests/issue-299-credential-boundary-audit.test.mjs"
      - "tests/issue-299-local-credential-audit.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/profile-private-storage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-private-storage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile-private-storage:
    name: ${{ matrix.label }} storage, migration, audit and build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
          - label: Linux x64
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22.13
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate profile-private storage and migration
        run: npm run test:profile-storage
      - name: Validate Memory v1 authority, persistence, retrieval and Sage/Avery continuity
        run: node --test tests/issue-1200-scoped-memory-contract.test.mjs tests/issue-1201-memory-persistence-isolation.test.mjs tests/issue-1202-bounded-memory-retrieval.test.mjs tests/issue-1203-sage-avery-memory-continuity.test.mjs
      - name: Validate Library persistence dependency
        run: node --test tests/issue-1122-library-persistence.test.mjs
      - name: Validate PMK and Auth dependencies
        run: npm run test:profile-vault && npm run test:auth-core && npm run test:auth-crypto
      - name: Validate credential registry and audits
        run: npm run test:credential-boundary-audit && npm run audit:credentials
      - name: Production build
        run: npm run build
