name: STORY Phase 2 Scene Working Set Proof

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/story-the-unwritten/scene-working-set.mjs"
      - "tests/issue-1675-story-scene-working-set.test.mjs"
      - ".github/workflows/story-phase2-scene-working-set-proof.yml"

jobs:
  sparse-scene-working-set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/issue-1675-story-scene-working-set.test.mjs
