name: PR 580 Validation

on:
  push:
    branches:
      - agent/mastra-runtime-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Mastra readiness regression
        run: node --test tests/issue-580-mastra-runtime-readiness.test.mjs
      - name: Production build
        run: npm run build
