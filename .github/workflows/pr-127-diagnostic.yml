name: PR 127 Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Run concise test diagnostic
        shell: bash
        run: |
          set -euo pipefail
          npm ci --silent >/dev/null 2>&1
          if npm test > /tmp/plotpickle-test.log 2>&1; then
            echo "All PlotPickle tests passed."
          else
            echo "::error title=PlotPickle test failure::Complete failing TAP blocks follow"
            awk '
              /^not ok / {show=1; count=0}
              show {print; count++}
              show && count >= 35 {show=0}
            ' /tmp/plotpickle-test.log
            exit 1
          fi
