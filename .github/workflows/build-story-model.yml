name: BUILD Story Model

on:
  pull_request:
    branches: [main]
    paths:
      - "app/page.tsx"
      - "app/sage-settings-workspace.tsx"
      - "build/foundations-ppf-gateway.ts"
      - "build/library-ppf-import-gateway.ts"
      - "build/local-ai-gateway.ts"
      - "build/projects/portable-ppf-reader.ts"
      - "core/contracts/foundation-plan.ts"
      - "core/contracts/imported-screenplay-evidence/**"
      - "core/project/project.ts"
      - "core/storage/project-library-browser.ts"
      - "core/storage/project-library-core.mjs"
      - "lib/projects/screenplay/screenplay-import.ts"
      - "lib/projects/screenplay/screenplay-to-ppf.ts"
      - "modules/build/foundations-story-coverage.ts"
      - "modules/build/progressive-story-map.ts"
      - "modules/build/ui/foundations-story-coverage.tsx"
      - "modules/build/ui/foundations-story-coverage.module.css"
      - "modules/build/ui/foundations-build-workspace.tsx"
      - "modules/build/ui/progressive-story-map.tsx"
      - "modules/build/ui/progressive-story-map.module.css"
      - "modules/build/build-workspace-model.ts"
      - "modules/library/import/**"
      - "modules/library/ui/**"
      - "scripts/projects/convert-screenplay-to-ppf.mjs"
      - "Utilities/Convert-Screenplay-To-PPF.cmd"
      - "app/build-health-map.tsx"
      - "app/build-health-map.module.css"
      - "tests/issue-1338-progressive-build-story-model.test.mjs"
      - "tests/issue-1338-screenplay-to-ppf-utility.test.mjs"
      - "tests/issue-1338-library-import-archive.test.mjs"
      - "tests/foundations-build-visual-workshop.test.mjs"
      - "tests/issue-1030b-foundations-wireframe.test.mjs"
      - "tests/dashboard-foundations-progression.test.mjs"
      - "tests/issue-114-build-workspace.test.mjs"
      - "tests/issue-351-build-health-map.test.mjs"
      - "docs/PRODUCT-DEVELOPER-BRIEF-08-23-PROGRESSIVE-BUILD-STORY-MODEL.md"
      - "docs/issue-1338-live-build-correction.md"
      - ".github/workflows/build-story-model.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-story-model-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  story-model:
    name: Live BUILD evidence, Library import/archive and production build
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate live progressive BUILD and 24/96 evidence
        run: node --test tests/issue-1338-progressive-build-story-model.test.mjs

      - name: Validate screenplay conversion, modular import and Archive lifecycle
        run: node --test tests/issue-1338-screenplay-to-ppf-utility.test.mjs tests/issue-1338-library-import-archive.test.mjs

      - name: Validate current Foundations BUILD behavior
        run: node --test tests/foundations-build-visual-workshop.test.mjs tests/issue-1030b-foundations-wireframe.test.mjs tests/dashboard-foundations-progression.test.mjs

      - name: Protect legacy migration-source regressions while evidence moves forward
        run: node --test tests/issue-114-build-workspace.test.mjs tests/issue-351-build-health-map.test.mjs

      - name: Production build
        run: npm run build
