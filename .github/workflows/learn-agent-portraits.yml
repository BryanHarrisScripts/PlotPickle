name: LEARN Agent Portraits

on:
  pull_request:
    paths:
      - "modules/learn/ui/marquee-agent-overlay.tsx"
      - "modules/learn/ui/marquee-agent-overlay.module.css"
      - "public/assets/marquee-director-portrait.svg"
      - "tests/issue-1100-learn-agent-portraits.test.mjs"
      - ".github/workflows/learn-agent-portraits.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portrait-contract:
    name: Portrait rail and curriculum gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Validate LEARN portrait rail
        run: node --test tests/issue-1100-learn-agent-portraits.test.mjs tests/issue-1080-marquee-marketing-reference.test.mjs
      - name: Production build
        run: npm run build
