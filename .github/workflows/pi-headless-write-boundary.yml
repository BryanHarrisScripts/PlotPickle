name: Pi Headless Write-Tool Boundary

on:
  pull_request:
    paths:
      - .github/workflows/pi-headless-write-boundary.yml
      - tests/issue-3159-pi-headless-inference.test.mjs
      - .pi/managed/package.json
      - .pi/managed/package-lock.json
      - scripts/pi-managed-install.mjs
      - scripts/pi-worker-runtime.mjs
      - scripts/engineering-team/windows/autonomous-issue-coder.mjs
      - Utilities/DeveloperWorkbench/pi-managed-node-launch.mjs
      - .pi/extensions/plotpickle-virtual-model.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-pi-write:
    name: Real Pi CLI / mock model / Windows write tool
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 26.12
        uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
          cache: npm

      - name: Verify approved test-truth bindings
        shell: pwsh
        run: node scripts/verification-test-truth.mjs --base-ref "${{ github.event.pull_request.base.sha || 'origin/main' }}"

      - name: Install pinned repository dependencies
        shell: pwsh
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund

      - name: Execute actual managed Pi CLI against an offline simulated provider
        shell: pwsh
        env:
          PLOTPICKLE_PI_MOCK_E2E: '1'
          PLOTPICKLE_PI_ALLOW_CLOUD: '0'
        run: node --test tests/issue-3159-pi-headless-inference.test.mjs

      - name: Report evidence limits
        if: always()
        shell: pwsh
        run: |
          Write-Output "Test boundary: real pinned Pi CLI, real write/edit tool, simulated loopback LLM, ephemeral hosted Windows files."
          Write-Output "Not proved: owner-PC inference, actual coding-model tool selection, Semantic UAT, Product Gate, draft PR, or merge."
