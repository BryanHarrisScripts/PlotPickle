name: Temporary Issue 26 Apply

on:
  push:
    branches:
      - agent/issue-26-reports-terms-collaboration
    paths:
      - .github/issue26-payload.04.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-26-reports-terms-collaboration
          fetch-depth: 0
      - name: Apply coordinated source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue26-payload.*.b64 | base64 --decode | tar -xzf -
          python - <<'PY'
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              'Settings → GitHub & Backups now provides a disk-backed `.ppf` project library, atomic rolling backups, corruption-aware recovery, optional GitHub pull/review/push workflows, and repository history.',
              'Settings → GitHub & Backups now provides a disk-backed `.ppf` project library, rolling backups, canonical pulls, and owner-controlled collaboration proposals. Every local PlotPickle server submits changes through a unique GitHub branch and pull request; only an owner or maintainer merge changes the canonical story.'
          )
          text = text.replace('Current application version: `1.0.0-rc.1`', 'Current application version: `1.0.0-rc.2`')
          text = text.replace(
              'A future portable `.ppf` project package and optional GitHub collaboration layer are tracked in issue #22. They will build on schema 1.7 revisions and provenance without changing local-only use.',
              'Portable `.ppf` projects and optional GitHub collaboration now build on schema 1.7 revisions and provenance without changing local-only use. Multiple local servers submit reviewable pull requests rather than writing directly to the canonical branch.'
          )
          text = text.replace(
              'PlotPickle accepts plain-text (`.txt`), Fountain (`.fountain` or `.spmd`), and Final Draft (`.fdx`) files. **Load a screenplay** in Read & Learn and **Import** in the top bar use the same ingestion pipeline. A screenplay creates a fresh active project, replaces the optional Afterglow example, preserves the complete draft, detects the title, speaking characters, locations and scene order, and maps passages into the 24 Blocks, Story Planner, Structure Map, guided questions, and Visual Board directions.',
              'PlotPickle accepts plain-text (`.txt`), Fountain (`.fountain` or `.spmd`), and Final Draft (`.fdx`) files. **Load a screenplay** in Read & Learn and **Import** in the top bar use the same ingestion pipeline. A screenplay creates a complete schema 1.7 project and populates reviewable metadata, story, world, characters, voiceprints, arc matrices, 24 Blocks, scenes, 96 mini-blocks, Story Threads, rights, review, pitch, production and collaboration fields.'
          )
          text = text.replace(
              'Settings also contains **Reports** and a searchable **Terminology Index**. Reports calculate each character’s dialogue lines, spoken words, scene count, scene list, first and last appearance, and estimated speaking time from the active screenplay so actors can compare roles. The index explains screenplay formatting, structure, character, production, and PlotPickle terms in plain language. Both work locally without AI.',
              'Settings also contains live **Reports** and a redesigned **Terminology Index**. Reports recalculate from the active canonical screenplay after every load, import, normalization, replacement or edit, including speaking coverage and a current-schema population audit. Terms are grouped, searchable, available in concise or expanded views, and linked to their relevant PlotPickle workspace. Both work locally without AI.'
          )
          readme.write_text(text)
          PY
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          rm -f .github/issue26-payload.*.b64 .github/workflows/issue26-apply.yml
      - name: Commit completed Issue 26 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PlotPickle Release Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete issue 26 reports, imports, terms, and collaboration proposals"
          git push origin HEAD:agent/issue-26-reports-terms-collaboration
