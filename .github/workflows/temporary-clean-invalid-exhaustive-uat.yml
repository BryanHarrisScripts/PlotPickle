name: Temporary exhaustive UAT issue cleanup

on:
  push:
    branches:
      - fix/exhaustive-uat-harness-boundary
    paths:
      - .github/workflows/temporary-clean-invalid-exhaustive-uat.yml

permissions:
  contents: read
  issues: write

jobs:
  close-invalid-exhaustive-uat-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and close only invalid exhaustive UAT findings
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          close_one() {
            number="$1"
            issue="$(gh api "repos/${REPO}/issues/${number}")"
            title="$(jq -r '.title' <<<"${issue}")"
            state="$(jq -r '.state' <<<"${issue}")"
            body="$(jq -r '.body // ""' <<<"${issue}")"

            if [[ "${title}" != "[UAT] Focused UAT blocker: exhaustive-ui-ux" ]] || ! grep -Fq '"source": "code-aware-exhaustive-ui-control-audit"' <<<"${body}"; then
              echo "Refusing to touch #${number}: it is not a verified exhaustive-UAT harness issue." >&2
              return 1
            fi

            if [[ "${state}" == "closed" ]]; then
              echo "#${number} already closed."
              return 0
            fi

            gh api --method PATCH "repos/${REPO}/issues/${number}" -f state=closed -f state_reason=not_planned >/dev/null
            echo "Closed #${number} as not planned."
          }

          export -f close_one
          export GH_TOKEN REPO
          seq 701 877 | xargs -n1 -P12 bash -c 'close_one "$1"' _
          echo "Cleanup complete."
