name: Issue 1230 Contract Patch

on:
  push:
    branches:
      - fix/full-verification-closeout
    paths:
      - ".github/workflows/issue-1230-contract-patch.yml"

permissions:
  contents: write

jobs:
  patch-current-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align verification with current product contracts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`${path}: expected source fragment not found`);
            const next = source.replace(before, after);
            if (next === source) throw new Error(`${path}: replacement made no change`);
            fs.writeFileSync(path, next);
          }

          replaceExact(
            'scripts/exhaustive-ui-control-audit.mjs',
            '      interactions += 1;\n      try {',
            '      interactions += 1;\n      status(\n        `Exhaustive UAT · ${screen.label}`,\n        "WORKING",\n        `${interactions}/${interactionLimit} · ${control.role} · ${String(control.label).slice(0, 120)}`,\n      );\n      try {'
          );

          replaceExact(
            'scripts/writer-journey-completion.mjs',
            '    topic: "Foundations",\n    nextTopics: ["World", "Character", "Theme", "Structure"],\n    expectedCount: 11,',
            '    topic: "Foundations",\n    nextTopics: ["World", "Character", "Theme", "Structure"],\n    expectedCount: 4,'
          );

          const finalState = 'scripts/writer-journey-final-state.mjs';
          const replacements = [
            ['completedLessonIds.length >= 11,', 'completedLessonIds.length >= 4,'],
            ['current Foundations acceptance requires at least 11.', 'current Foundations acceptance requires at least 4.'],
            ['Number(learn.foundationLessonCount || 0) >= 11', 'Number(learn.foundationLessonCount || 0) >= 4'],
            ['completedLessonIds.length >= 16,', 'completedLessonIds.length >= 9,'],
            ['Foundations + World currently requires at least 16.', 'Foundations + World currently requires at least 9.'],
            ['Number(dashboard.foundationLearnComplete || 0) >= 11', 'Number(dashboard.foundationLearnComplete || 0) >= 4'],
          ];
          let source = fs.readFileSync(finalState, 'utf8');
          for (const [before, after] of replacements) {
            if (!source.includes(before)) throw new Error(`${finalState}: missing ${before}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(finalState, source);
          NODE
      - name: Commit bounded contract repair
        shell: bash
        run: |
          git config user.name "PlotPickle"
          git config user.email "bryan@bryanharris.ca"
          git add scripts/exhaustive-ui-control-audit.mjs scripts/writer-journey-completion.mjs scripts/writer-journey-final-state.mjs
          git commit -m "#1230 align Full Verification with current product contracts"
          git push origin HEAD:${GITHUB_REF_NAME}
