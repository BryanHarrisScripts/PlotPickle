name: Capture Phase C lint

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-c-specialist-labs-015
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture ESLint output
        run: |
          set +e
          npm run lint > docs/phase-c-lint.log 2>&1
          echo $? > docs/phase-c-lint.exit
          exit 0
      - name: Commit lint diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/phase-c-lint.log docs/phase-c-lint.exit
          git commit -m "Capture Phase C lint diagnostics"
          git push origin HEAD:agent/phase-c-specialist-labs-015
