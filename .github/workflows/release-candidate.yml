name: PlotPickle Release Candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            node: "24.15.0"
            folder: PlotPickle-Windows
            archive: PlotPickle-Windows.zip
          - os: macos-latest
            platform: macos
            node: "22.19.0"
            folder: PlotPickle-macOS
            archive: PlotPickle-macOS.zip
          - os: ubuntu-latest
            platform: linux
            node: "22.19.0"
            folder: PlotPickle-Linux
            archive: PlotPickle-Linux.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Stage release package
        run: node scripts/package-platform.mjs ${{ matrix.platform }}
      - name: Verify staged package
        run: node scripts/package-smoke.mjs releases/stage/${{ matrix.folder }}
      - name: Archive Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "releases/stage/${{ matrix.folder }}" -DestinationPath "releases/${{ matrix.archive }}" -CompressionLevel Optimal
      - name: Archive macOS or Linux package
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cd releases/stage
          zip -X -r "../${{ matrix.archive }}" "${{ matrix.folder }}"
      - name: Clean-machine extraction and dependency test (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP "plotpickle-clean"
          if (Test-Path $clean) { Remove-Item $clean -Recurse -Force }
          New-Item -ItemType Directory -Path $clean | Out-Null
          Expand-Archive -Path "releases/${{ matrix.archive }}" -DestinationPath $clean -Force
          $packageRoot = Join-Path $clean "${{ matrix.folder }}"
          if (-not (Test-Path $packageRoot)) { throw "The extracted PlotPickle package folder is missing." }
          Set-Location $packageRoot
          if (Test-Path "node_modules") { throw "The release archive must not contain node_modules." }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-smoke.mjs .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\node_modules\.bin\vite.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify or repair Windows Rolldown native binding
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $packageRoot = Join-Path (Join-Path $env:RUNNER_TEMP "plotpickle-clean") "${{ matrix.folder }}"
          Set-Location $packageRoot
          node scripts/windows-runtime.mjs verify-modules node_modules
          if ($LASTEXITCODE -ne 0) {
            Write-Host "The optional Windows binding was omitted; exercising PlotPickle's targeted repair."
            node scripts/windows-runtime.mjs repair-native node_modules
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node scripts/windows-runtime.mjs verify-modules node_modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start clean-machine Windows server
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $packageRoot = Join-Path (Join-Path $env:RUNNER_TEMP "plotpickle-clean") "${{ matrix.folder }}"
          Set-Location $packageRoot
          node scripts/windows-server-smoke.mjs .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows server diagnostic
        if: always() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: plotpickle-windows-server-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/plotpickle-clean/${{ matrix.folder }}/windows-server-smoke.log
          if-no-files-found: warn
          retention-days: 7
      - name: Clean-machine extraction and dependency test (macOS and Linux)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          clean="$RUNNER_TEMP/plotpickle-clean"
          rm -rf "$clean"
          mkdir -p "$clean"
          unzip -q "releases/${{ matrix.archive }}" -d "$clean"
          cd "$clean/${{ matrix.folder }}"
          test ! -d node_modules
          npm ci --no-audit --no-fund
          node scripts/package-smoke.mjs .
          node_modules/.bin/vite --version
          node scripts/portable-runtime.mjs describe
      - name: Create SHA-256 checksum
        shell: bash
        run: |
          cd releases
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"; else shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: plotpickle-${{ matrix.platform }}-${{ github.sha }}
          path: |
            releases/${{ matrix.archive }}
            releases/${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish-tag:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build combined checksum manifest
        run: |
          cd artifacts
          sha256sum PlotPickle-Windows.zip PlotPickle-macOS.zip PlotPickle-Linux.zip > SHA256SUMS.txt
      - name: Publish stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/PlotPickle-Windows.zip artifacts/PlotPickle-macOS.zip artifacts/PlotPickle-Linux.zip artifacts/SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --title "PlotPickle ${GITHUB_REF_NAME}" --generate-notes
