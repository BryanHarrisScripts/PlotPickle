name: PlotPickle Release Candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: plotpickle-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            node: "24.15.0"
            folder: PlotPickle-Windows
            archive: PlotPickle-Windows.zip
          - os: macos-latest
            platform: macos
            node: "22.19.0"
            folder: PlotPickle-macOS
            archive: PlotPickle-macOS.zip
          - os: ubuntu-latest
            platform: linux
            node: "22.19.0"
            folder: PlotPickle-Linux
            archive: PlotPickle-Linux.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Stage release package
        run: node scripts/package-platform.mjs ${{ matrix.platform }}
      - name: Verify staged package
        run: node scripts/package-smoke.mjs releases/stage/${{ matrix.folder }}
      - name: Archive Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "releases/stage/${{ matrix.folder }}" -DestinationPath "releases/${{ matrix.archive }}" -CompressionLevel Optimal
      - name: Archive macOS or Linux package
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cd releases/stage
          zip -X -r "../${{ matrix.archive }}" "${{ matrix.folder }}"
      - name: Clean-machine extraction and dependency test (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP "plotpickle-clean"
          if (Test-Path $clean) { Remove-Item $clean -Recurse -Force }
          New-Item -ItemType Directory -Path $clean | Out-Null
          Expand-Archive -Path "releases/${{ matrix.archive }}" -DestinationPath $clean -Force
          $packageRoot = Join-Path $clean "${{ matrix.folder }}"
          if (-not (Test-Path $packageRoot)) { throw "The extracted PlotPickle package folder is missing." }
          Set-Location $packageRoot
          if (Test-Path "node_modules") { throw "The release archive must not contain node_modules." }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-smoke.mjs .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\node_modules\.bin\vite.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify or repair Windows Rolldown native binding
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $packageRoot = Join-Path (Join-Path $env:RUNNER_TEMP "plotpickle-clean") "${{ matrix.folder }}"
          Set-Location $packageRoot
          node scripts/windows-runtime.mjs verify-modules node_modules
          if ($LASTEXITCODE -ne 0) {
            Write-Host "The optional Windows binding was omitted; exercising PlotPickle's targeted repair."
            node scripts/windows-runtime.mjs repair-native node_modules
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node scripts/windows-runtime.mjs verify-modules node_modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run packaged Windows interaction smoke
        if: matrix.platform == 'windows'
        continue-on-error: true
        shell: pwsh
        env:
          EDGE_PATH: "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"
          PLOTPICKLE_SMOKE_TOTAL_TIMEOUT_MS: "120000"
          PLOTPICKLE_SMOKE_ACTION_TIMEOUT_MS: "8000"
          PLOTPICKLE_SMOKE_MAX_STATES: "40"
          PLOTPICKLE_SMOKE_MAX_ACTIONS: "80"
          PLOTPICKLE_SMOKE_MAX_DEPTH: "2"
        run: |
          $packageRoot = Join-Path (Join-Path $env:RUNNER_TEMP "plotpickle-clean") "${{ matrix.folder }}"
          Set-Location $packageRoot
          node scripts/windows-interaction-smoke.mjs . reports/windows-interaction-smoke
      - name: Run deterministic Windows release smoke
        if: matrix.platform == 'windows'
        continue-on-error: true
        shell: pwsh
        env:
          EDGE_PATH: "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"
          PLOTPICKLE_RELEASE_SMOKE_TIMEOUT_MS: "120000"
        run: |
          $packageRoot = Join-Path (Join-Path $env:RUNNER_TEMP "plotpickle-clean") "${{ matrix.folder }}"
          Set-Location $packageRoot
          node scripts/windows-release-smoke.mjs . reports/windows-release-smoke
      - name: Run Issue 208 packaged Windows smoke
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          EDGE_PATH: "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"
          PLOTPICKLE_ISSUE_208_SMOKE_TIMEOUT_MS: "120000"
        run: |
          $packageRoot = Join-Path (Join-Path $env:RUNNER_TEMP "plotpickle-clean") "${{ matrix.folder }}"
          Set-Location $packageRoot
          # Contract source remains scripts/windows-issue-208-smoke.mjs; the runner applies stable packaged-browser interactions.
          node scripts/windows-issue-208-smoke-runner.mjs . reports/windows-issue-208-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows interaction evidence
        if: always() && matrix.platform == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plotpickle-windows-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/plotpickle-clean/${{ matrix.folder }}/reports/windows-interaction-smoke/
            ${{ runner.temp }}/plotpickle-clean/${{ matrix.folder }}/reports/windows-release-smoke/
            ${{ runner.temp }}/plotpickle-clean/${{ matrix.folder }}/reports/windows-issue-208-smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Clean-machine extraction and dependency test (macOS and Linux)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          clean="$RUNNER_TEMP/plotpickle-clean"
          rm -rf "$clean"
          mkdir -p "$clean"
          unzip -q "releases/${{ matrix.archive }}" -d "$clean"
          cd "$clean/${{ matrix.folder }}"
          test ! -d node_modules
          npm ci --no-audit --no-fund
          node scripts/package-smoke.mjs .
          node_modules/.bin/vite --version
          node scripts/portable-runtime.mjs describe
      - name: Create SHA-256 checksum
        shell: bash
        run: |
          cd releases
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"; else shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plotpickle-${{ matrix.platform }}-${{ github.sha }}
          path: |
            releases/${{ matrix.archive }}
            releases/${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish-tag:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Build combined checksum manifest
        run: |
          cd artifacts
          sha256sum PlotPickle-Windows.zip PlotPickle-macOS.zip PlotPickle-Linux.zip > SHA256SUMS.txt
      - name: Publish stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/PlotPickle-Windows.zip artifacts/PlotPickle-macOS.zip artifacts/PlotPickle-Linux.zip artifacts/SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --title "PlotPickle ${GITHUB_REF_NAME}" --generate-notes
