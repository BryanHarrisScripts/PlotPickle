name: Patch issue 324

on:
  push:
    branches:
      - agent/324-buzz-cli-capability-check

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/324-buzz-cli-capability-check
          fetch-depth: 0
      - name: Replace unsupported version probe
        shell: python
        run: |
          from pathlib import Path

          path = Path("build/buzz-gateway.ts")
          source = path.read_text(encoding="utf-8")
          before = '''    const result = await command(executable, ["--version"], { timeoutMs: 8_000 });
              return {
                available: true,
                executable,
                version: result.stdout || result.stderr || "Available",'''
          after = '''    const result = await command(executable, ["--help"], { timeoutMs: 8_000 });
              const help = `${result.stdout}\\n${result.stderr}`.trim();
              if (!/Buzz CLI/i.test(help) || !/\\bchannels\\b/i.test(help) || !/\\busers\\b/i.test(help)) {
                throw new Error(`${path.basename(executable)} started but does not expose the required Buzz CLI commands.`);
              }
              return {
                available: true,
                executable,
                version: resolution.releaseTag ? `Buzz CLI ${resolution.releaseTag}` : "Buzz CLI available",'''
          if before not in source:
              raise SystemExit("Expected Buzz CLI status block was not found")
          path.write_text(source.replace(before, after, 1), encoding="utf-8")
      - name: Commit targeted patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/buzz-gateway.ts
          git commit -m "Fix Buzz CLI capability probe"
          git push origin HEAD:agent/324-buzz-cli-capability-check
