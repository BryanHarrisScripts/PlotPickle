name: Temporary final Phase 9 verification correction

on:
  push:
    branches:
      - issue-2094-phase-9

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-2094-phase-9

      - name: Align source order and learner-body expectation
        shell: python
        run: |
          import json
          import pathlib

          root = pathlib.Path('.')
          ledger_path = root / 'docs/learn/lesson-integration-2094.json'
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          record = ledger['lessons']['84']
          record['sourceIds'] = [
              '24-blocks-blog-github-for-screenwriters-md',
              '24-blocks-blog-open-sourcing-your-screenplay-md',
              '24-blocks-blog-readme-md',
              '24-blocks-collaborators-readme-md',
              '24-blocks-opensource-1-million-voices-md',
              '24-blocks-opensource-centralvsdecentral-md',
              'afterglow-readme-md-instructional-sections',
              'bryanharrisscripts-github-io-readme-md',
              '24-blocks-readme-md',
          ]
          ledger_path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test_path = root / 'tests/issue-2094-lesson-integration.test.mjs'
          test = test_path.read_text(encoding='utf-8')
          old = '"Professional society or academy"'
          new = '"professional societies"'
          if old not in test:
              raise SystemExit('Expected Lesson 81 test phrase not found')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase9-canon-fix-2.yml
          git add docs/learn/lesson-integration-2094.json tests/issue-2094-lesson-integration.test.mjs
          git commit -m "fix: align Phase 9 verification evidence"
          git push origin HEAD:issue-2094-phase-9
