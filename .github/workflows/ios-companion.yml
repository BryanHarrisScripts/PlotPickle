name: iOS Companion

on:
  pull_request:
    branches: [main]
    paths:
      - "core/identity/ios-companion-core.mjs"
      - "core/identity/ios-companion.ts"
      - "tests/issue-1090-ios-companion.test.mjs"
      - ".github/workflows/ios-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-companion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-contracts:
    name: LEARN and five BUZZ Communities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Validate iOS companion contracts
        run: node --test tests/issue-1090-ios-companion.test.mjs
      - name: Re-run identity and LEARN sync contracts
        run: node --test tests/issue-1072-identity-authority.test.mjs tests/issue-1073-avatar-recovery-learn-sync.test.mjs tests/issue-1065-merrin-bbs-moderator.test.mjs
      - name: Production build
        run: npm run build
