name: Product Gate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: product-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-gate:
    name: Product Gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 24.19
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Install PlotPickle dependencies once
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate current Skin V1 startup boundary and DSDD owned Edge
        shell: pwsh
        run: node --test tests/issue-341-windows-startup-ui-ux.test.mjs tests/issue-2341-dsdd-zero-config.test.mjs

      - name: Validate current security closeout
        shell: pwsh
        run: node --test tests/issue-1228-security-closeout.test.mjs tests/issue-1827-codeql-second-pass.test.mjs tests/issue-1833-codeql-data-flow-closeout.test.mjs tests/issue-1837-codeql-zero-closeout.test.mjs tests/issue-1840-codeql-casebook-text-boundary.test.mjs tests/issue-503-windows-mcp-spawn.test.mjs tests/issue-1185-pi-managed-install.test.mjs tests/issue-104-windows-paths.test.mjs tests/issue-483-feedback-studio.test.mjs tests/issue-88-visual-board-navigation.test.mjs

      - name: Evaluate Pi 0.99.1 compatibility
        shell: pwsh
        run: node scripts/evaluate-pi-099-compatibility.mjs

      - name: Evaluate optional Pi Durable adapter
        shell: pwsh
        run: node scripts/evaluate-pi-durable-adapter.mjs

      - name: Detect agent checkpoint proof scope
        id: checkpoint-scope
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          $changed = git diff --name-only $env:BASE_SHA HEAD
          $required = [bool]($changed | Select-String -Pattern '^(core/sidecars/tasks/|scripts/pi/durable/|tests/issue-2709-|\.github/workflows/product-gate\.yml$)')
          "required=$($required.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prove scoped agent checkpoints and real JSONL recovery on Windows
        if: steps.checkpoint-scope.outputs.required == 'true'
        shell: pwsh
        env:
          PLOTPICKLE_CHECKPOINT_PROOF_HOME: ${{ runner.temp }}\plotpickle-checkpoint-proof
          PLOTPICKLE_PROOF_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --test tests/issue-2709-agent-checkpoint-task.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/pi/durable/checkpoint-proof.mjs

      - name: Upload agent checkpoint product evidence
        if: always() && steps.checkpoint-scope.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-checkpoint-${{ github.run_id }}
          path: .artifacts/agent-checkpoint-2709/proof.json
          if-no-files-found: warn
          retention-days: 5

      - name: Prove active-default Pi Durable runtime on Windows
        shell: pwsh
        run: node --test tests/issue-2696-pi-durable-active-default.test.mjs

      - name: Prove Pi native MCP registration and stdio on Windows
        shell: pwsh
        run: node --test tests/issue-2591-pi-native-mcp.test.mjs

      - name: Prove governed Codemode and nested evidence on Windows
        shell: pwsh
        run: node --test tests/issue-2592-pi-codemode-evidence.test.mjs

      - name: Prove governed Pi virtual routing and classifier boundaries on Windows
        shell: pwsh
        run: node --test tests/issue-2593-pi-virtual-routing.test.mjs

      - name: Prove governed development delivery, exact-head recovery and claims on Windows
        shell: pwsh
        run: node --test tests/issue-2594-governed-development-delivery.test.mjs

      - name: Verify Pi Draft prompt transport through a Windows batch shim
        shell: pwsh
        run: node --test tests/issue-2359-pi-draft-stdin.test.mjs

      - name: Validate bundled local video setup
        run: node --test tests/ltx-bundled-default.test.mjs

      - name: Validate local whisper.cpp dictation fixture
        shell: pwsh
        env:
          PLOTPICKLE_HOME: ${{ runner.temp }}\plotpickle-voice
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install-whisper-cpp.ps1 -Mode Smoke -Approved

      - name: Production web build on Windows
        shell: pwsh
        run: npm run build

      - name: Validate Windows installer source contract
        shell: pwsh
        run: node --test tests/issue-1456-windows-installer.test.mjs
