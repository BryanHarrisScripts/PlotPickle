name: Profile Experience

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-experience:
    name: ${{ matrix.label }} profile UX and build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
          - label: Linux x64
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24.19
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate profile experience
        run: npm run test:profile-experience && node --test tests/issue-1210-ui-housekeeping.test.mjs tests/issue-1212-profile-buzz-identity.test.mjs tests/issue-1144-buzz-profile-agent-scope.test.mjs tests/issue-1279-official-agents-lore-avatar.test.mjs tests/issue-1404-community-edge-navigation.test.mjs
      - name: Validate Auth and session dependencies
        run: npm run test:auth-core && npm run test:profile-vault && npm run test:profile-storage && npm run test:server-session
      - name: Validate clean Windows Vite startup
        if: matrix.os == 'windows-latest'
        run: node scripts/windows-server-smoke.mjs .
      - name: Validate managed Edge Community navigation
        if: matrix.os == 'windows-latest'
        env:
          PLOTPICKLE_SMOKE_COMMUNITY_EDGE: "1"
          PLOTPICKLE_SMOKE_TOTAL_TIMEOUT_MS: "120000"
        run: node scripts/windows-interaction-smoke.mjs . reports/windows-community-edge
      - name: Production build
        run: npm run build
