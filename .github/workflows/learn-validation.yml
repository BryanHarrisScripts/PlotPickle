name: LEARN Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learn-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  learn-validation:
    name: Focused Product Validation
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate the bundled LEARN curriculum
        run: npm run validate:learn

      - name: Validate Agent Skills migration
        run: node --test tests/issue-913-agent-skills-migration.test.mjs

      - name: Validate Windows startup Agent Skills contract
        run: node --test tests/startup-agent-skills-contract.test.mjs tests/issue-341-windows-startup-ui-ux.test.mjs tests/windows-native-runtime.test.mjs

      - name: Validate one-click full verification runner
        run: node --test tests/full-verification-runner.test.mjs

      - name: Parse full verification PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/run-plotpickle-full-check.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Validate focused UAT registry contract
        run: node --test tests/issue-622-uat-autopilot.test.mjs

      - name: Validate README core direction
        run: node --test tests/core-readme-direction.test.mjs

      - name: Test Startup, Settings, Foundations/LEARN, PLAN, and Wyrmwood
        run: node scripts/run-uat-autopilot.mjs --contracts-only --artifact-root .artifacts/uat-focused

      - name: Upload focused UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-uat-${{ github.run_id }}
          path: .artifacts/uat-focused
          if-no-files-found: error
          retention-days: 5

      - name: Production build
        run: npm run build

# Live local closed-loop UAT is run with scripts/run-uat-closed-loop.mjs.
# Add future product areas by extending config/uat-autopilot-registry.json with their focused tests and rendered expectations.
