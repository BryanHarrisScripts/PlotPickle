name: PlotPickle Release Candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            folder: PlotPickle-Windows
            archive: PlotPickle-Windows.zip
          - os: macos-latest
            platform: macos
            folder: PlotPickle-macOS
            archive: PlotPickle-macOS.zip
          - os: ubuntu-latest
            platform: linux
            folder: PlotPickle-Linux
            archive: PlotPickle-Linux.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Stage release package
        run: node scripts/package-platform.mjs ${{ matrix.platform }}
      - name: Verify staged package
        run: node scripts/package-smoke.mjs releases/stage/${{ matrix.folder }}
      - name: Archive Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "releases/stage/${{ matrix.folder }}" -DestinationPath "releases/${{ matrix.archive }}" -CompressionLevel Optimal
      - name: Archive macOS or Linux package
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cd releases/stage
          zip -X -r "../${{ matrix.archive }}" "${{ matrix.folder }}"
      - name: Clean-machine extraction and dependency test
        shell: bash
        run: |
          clean="$RUNNER_TEMP/plotpickle-clean"
          rm -rf "$clean"
          mkdir -p "$clean"
          if command -v powershell.exe >/dev/null 2>&1; then
            powershell.exe -NoProfile -Command "Expand-Archive -Path '$(pwd)/releases/${{ matrix.archive }}' -DestinationPath '$clean' -Force"
          else
            unzip -q "releases/${{ matrix.archive }}" -d "$clean"
          fi
          cd "$clean/${{ matrix.folder }}"
          test ! -d node_modules
          npm ci --no-audit --no-fund
          node scripts/package-smoke.mjs .
          node_modules/.bin/vite --version
          if [ "${{ matrix.platform }}" = "windows" ]; then node scripts/windows-runtime.mjs describe; else node scripts/portable-runtime.mjs describe; fi
      - name: Create SHA-256 checksum
        shell: bash
        run: |
          cd releases
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"; else shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: plotpickle-${{ matrix.platform }}-${{ github.sha }}
          path: |
            releases/${{ matrix.archive }}
            releases/${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish-tag:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build combined checksum manifest
        run: |
          cd artifacts
          sha256sum PlotPickle-Windows.zip PlotPickle-macOS.zip PlotPickle-Linux.zip > SHA256SUMS.txt
      - name: Publish stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/PlotPickle-Windows.zip artifacts/PlotPickle-macOS.zip artifacts/PlotPickle-Linux.zip artifacts/SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --title "PlotPickle ${GITHUB_REF_NAME}" --generate-notes
