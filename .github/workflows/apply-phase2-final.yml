name: Apply Phase 2 final delta

on:
  pull_request:
    branches: [main]
    paths:
      - ".phase2-final/**"
      - ".github/workflows/apply-phase2-final.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/184-google-desktop-oauth'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/184-google-desktop-oauth
          fetch-depth: 0

      - name: Restore final reviewed delta
        shell: bash
        run: |
          set -euo pipefail
          cat .phase2-final/chunk-00a.b64 .phase2-final/chunk-00b.b64 .phase2-final/chunk-01.b64 .phase2-final/chunk-02.b64 | base64 --decode > /tmp/phase2-final.tar.gz
          echo "2b4a15be7c35a0e69441371e4c3d3fa775b18eb1fa6611da9148027e6a0d19fd  /tmp/phase2-final.tar.gz" | sha256sum -c -
          tar -xzf /tmp/phase2-final.tar.gz

      - name: Validate Phase 2 foundation
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/issue-120-settings-connections.test.mjs tests/issue-144-connection-trust.test.mjs tests/issue-182-collab-workspace.test.mjs tests/issue-184-google-desktop-oauth.test.mjs
          rm -rf releases/stage/PlotPickle-Linux
          package_path="$(node scripts/package-platform.mjs linux)"
          node scripts/package-smoke.mjs "$package_path"

      - name: Commit final Phase 2 foundation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .phase2-final
          rm -f .github/workflows/apply-phase2-final.yml
          git config user.name "PlotPickle Build Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize inactive Google OAuth foundation"
          git push origin HEAD:agent/184-google-desktop-oauth
