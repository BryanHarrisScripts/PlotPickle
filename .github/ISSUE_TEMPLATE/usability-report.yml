name: Usability or design report
description: Report confusing language, navigation, layout or workflow friction without including private story material or credentials.
title: "[Usability]: "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Remove API keys, tokens, personal information, unpublished story text, and private repository details before submitting.
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options: [Dashboard, Learn, Plan, Storyboard, Write, Graphic Novel, Build, Feedback, Refine, Reports, Collaboration, Settings, Packaging, Documentation, Other]
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What is confusing or difficult?
      description: Describe the language, navigation, layout or workflow friction you encountered.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would feel clearer?
      description: Describe the smallest useful improvement.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, personal information and unpublished story material.
          required: true
