name: Issue 2460 Pre-PR Verification

on:
  push:
    branches:
      - verify-issue-2460-prepr

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verification head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Diff hygiene
        run: git diff --check origin/main...HEAD

      - name: Focused regressions
        run: >-
          node --test
          tests/issue-2460-oss-adoption.test.mjs
          tests/agent-skills-foundation.test.mjs
          tests/issue-1079-managed-desktop-harness.test.mjs
          tests/issue-651-pi-cline-uat-repair.test.mjs

      - name: Agent Skill self-test
        run: node scripts/agent-skills.mjs --self-test

      - name: Development convergence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFile } from "node:fs/promises";
          import { evaluateDevelopmentConvergence } from "./scripts/run-development-convergence.mjs";
          const mergeBase = execFileSync("git", ["merge-base", "HEAD", "origin/main"], { encoding: "utf8" }).trim();
          const changedFiles = execFileSync("git", ["diff", "--name-only", mergeBase + "..HEAD"], { encoding: "utf8" })
            .split(/\r?\n/u)
            .map((value) => value.trim())
            .filter(Boolean)
            .filter((value) => value !== ".github/workflows/issue-2460-prepr.yml");
          const manifest = JSON.parse(await readFile("config/development-convergence/2460.json", "utf8"));
          const report = await evaluateDevelopmentConvergence({
            manifest,
            manifestPath: "config/development-convergence/2460.json",
            root: process.cwd(),
            changedFiles,
          });
          console.log(JSON.stringify({ status: report.status, remaining: report.remaining }, null, 2));
          if (report.status !== "CONVERGED") process.exit(1);
          NODE

      - name: Architecture health delta against main
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp/main" origin/main
          set +e
          node scripts/architecture-health-audit.mjs > "$tmp/branch-health.txt" 2>&1
          branch_status=$?
          (
            cd "$tmp/main"
            node scripts/architecture-health-audit.mjs > "$tmp/main-health.txt" 2>&1
          )
          main_status=$?
          set -e
          grep '^- FAIL —' "$tmp/branch-health.txt" | sort -u > "$tmp/branch-failures.txt" || true
          grep '^- FAIL —' "$tmp/main-health.txt" | sort -u > "$tmp/main-failures.txt" || true
          comm -23 "$tmp/branch-failures.txt" "$tmp/main-failures.txt" > "$tmp/new-failures.txt"
          cat "$tmp/branch-health.txt"
          if [ -s "$tmp/new-failures.txt" ]; then
            echo "New architecture-health failures introduced by #2460:"
            cat "$tmp/new-failures.txt"
            exit 1
          fi
          if [ "$branch_status" -ne 0 ] && [ "$main_status" -eq 0 ]; then
            echo "Branch architecture health regressed from green main."
            exit 1
          fi
          echo "No new architecture-health violations relative to main."
          git worktree remove --force "$tmp/main"

      - name: Architecture shadow — Agent and Skill Mesh
        run: >-
          node scripts/verification-shadow.mjs agent-runtime
          --base-ref origin/main
          --commit-sha "$(git rev-parse HEAD)"
          --platform linux
          --allow-network false

      - name: Architecture shadow — Provider Runtime
        run: >-
          node scripts/verification-shadow.mjs provider-runtime
          --base-ref origin/main
          --commit-sha "$(git rev-parse HEAD)"
          --platform linux
          --allow-network false

      - name: Architecture shadow — Validation and Operations
        run: >-
          node scripts/verification-shadow.mjs verification
          --base-ref origin/main
          --commit-sha "$(git rev-parse HEAD)"
          --platform linux
          --allow-network false

      - name: Production build
        run: npm run build
