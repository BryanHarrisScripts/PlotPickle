name: Phase 3 test contract repair

on:
  push:
    branches:
      - agent/phase-3-git-native-project-sync
    paths:
      - .github/workflows/phase-3-test-contract-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3-git-native-project-sync
          fetch-depth: 0

      - name: Correct behavioral assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path("tests/issue-150-git-native-project-sync.test.mjs")
          source = test.read_text()
          replacements = {
              '"Remote divergence detected",': '"approved GitHub version changed",',
              'assert.match(gateway, /tree:\\s+treeEntries/);': 'assert.match(gateway, /body:\\s*\\{\\s*base_tree:\\s*branch\\.treeSha,\\s*tree:\\s*entries\\s*\\}/s);',
              'assert.match(gateway, /parents:\\s+\\[remote\\.commitSha\\]/);': 'assert.match(gateway, /parents:\\s*\\[branch\\.commitSha\\]/);\\n  assert.match(gateway, /body:\\s*\\{\\s*sha:\\s*commitSha,\\s*force:\\s*false\\s*\\}/s);',
              '    ".github/workflows/phase-3-source-integrate.yml",': '    ".github/workflows/phase-3-source-integrate.yml",\\n    ".github/workflows/phase-3-gateway-contract-fix.yml",\\n    ".github/workflows/phase-3-test-contract-fix.yml",',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"Missing expected assertion: {old}")
              source = source.replace(old, new, 1)
          test.write_text(source)
          Path(".github/workflows/phase-3-test-contract-fix.yml").unlink()
          PY

          git config user.name "PlotPickle Build"
          git config user.email "actions@users.noreply.github.com"
          git add tests/issue-150-git-native-project-sync.test.mjs .github/workflows/phase-3-test-contract-fix.yml
          git commit -m "Align Phase 3 tests with atomic sync behavior"
          git push origin HEAD:agent/phase-3-git-native-project-sync
