name: Story Council

on:
  pull_request:
    paths:
      - "core/story-workflow/story-council-*.mjs"
      - "core/story-workflow/story-council-*.d.ts"
      - "modules/story-workflow/story-council*.ts"
      - "modules/story-workflow/**/story-council*.ts"
      - "modules/story-workflow/**/story-council*.tsx"
      - "build/mastra-agent-runtime.ts"
      - "tests/issue-1417-story-council*.test.mjs"
      - ".github/workflows/story-council.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  story-council-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Validate Story Council responsibility, provenance, runtime, Afterglow and disagreement contracts
        run: >-
          node --test
          tests/issue-1417-story-council.test.mjs
          tests/issue-1417-story-council-runtime.test.mjs
          tests/issue-1417-story-council-afterglow.test.mjs
