name: Fix PR 373 UI gates

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - "scripts/fix-pr373-ui-gates.mjs"
      - ".github/workflows/fix-pr373-ui-gates.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/367-storyboard-creative-director'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/367-storyboard-creative-director
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
      - name: Apply focused UI gate fixes
        run: node scripts/fix-pr373-ui-gates.mjs
      - name: Run focused regression suites
        run: node --test tests/issue-367-creative-director-actions.test.mjs tests/issue-349-common-overlays-ux.test.mjs tests/issue-337-ui-ux-consistency-foundation.test.mjs
      - name: Check whitespace
        run: git diff --check
      - name: Publish tested fixes
        shell: bash
        run: |
          git rm scripts/fix-pr373-ui-gates.mjs
          git add app/visual-storyboard.tsx config/overlay-confirmation-inventory.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clarify Storyboard semantics and confirmation inventory"
          git push origin HEAD:agent/367-storyboard-creative-director
