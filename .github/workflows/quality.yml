name: PlotPickle Quality

# CI refresh: force a clean workflow run after Actions availability was restored.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: plotpickle-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Verify committed licence and generated navigation
        run: |
          test -f LICENSE
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          grep -q 'id: "overview", code: "OV", label: "Project Overview"' app/page.tsx
          grep -q 'id: "structureMap", code: "ST", label: "Structure Map"' app/page.tsx

      - name: Install dependencies
        run: npm ci

      - name: Validate developer diagnostics registry
        run: npm run diagnostics:validate

      - name: Validate PR 239 regression subject
        run: node --test tests/issue-240-pr-239-regression.test.mjs

      - name: Lint
        run: npm run lint

      - name: Validate Windows interaction smoke syntax
        run: node --check scripts/windows-interaction-smoke.mjs

      - name: Build and test with structured diagnostics
        run: npm run test:ci

      - name: Upload developer diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: developer-diagnostics-${{ github.sha }}
          path: reports/developer-diagnostics/
          if-no-files-found: ignore
          retention-days: 5
