name: Product Gate

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      command:
        required: false
        type: boolean
        default: false
      pi:
        required: false
        type: boolean
        default: false
      story:
        required: false
        type: boolean
        default: false
      media:
        required: false
        type: boolean
        default: false
      voice:
        required: false
        type: boolean
        default: false
      build:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: product-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settings-command-windows:
    if: github.event_name == 'workflow_dispatch' || inputs.command
    name: Settings Command Windows proof
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js 24.19
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install PlotPickle dependencies
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund
      - name: Prepare reviewed Hunk for isolated Windows proof
        shell: pwsh
        run: |
          & npm @('ci', '--prefix', 'tools/hunk-review', '--ignore-scripts', '--no-audit', '--no-fund')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE\tools\hunk-review\node_modules\.bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prove Settings Command, OpenPencil GUI contract, locked Pi install and native Hunk on Windows
        shell: pwsh
        env:
          PLOTPICKLE_PROOF_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --test tests/issue-2717-settings-command.test.mjs tests/issue-2717-command-gateway.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/issue-2780-openpencil-command-mcp.test.mjs tests/issue-2782-openpencil-profile-startup.test.mjs tests/issue-2787-openpencil-gui-review.test.mjs tests/issue-2793-openpencil-timeline-snapshot.test.mjs tests/issue-2800-openpencil-auto-design-review.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/settings-command-product-proof.mjs
      - name: Upload Settings Command evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-command-${{ github.run_id }}
          path: |
            .artifacts/settings-command-2717/proof.json
            .artifacts/settings-command-2717/failure.json
            .artifacts/settings-command-2717/host.log
            .artifacts/settings-command-2717/command.png
            .artifacts/settings-command-2717/failure.png
          if-no-files-found: warn
          retention-days: 5

  pi-runtime-windows:
    if: github.event_name == 'workflow_dispatch' || inputs.pi
    name: Pi runtime Windows proof
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js 24.19
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install PlotPickle dependencies
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate current Skin V1 startup boundary and DSDD owned Edge
        shell: pwsh
        run: node --test tests/issue-341-windows-startup-ui-ux.test.mjs tests/issue-2341-dsdd-zero-config.test.mjs
      - name: Validate current security closeout
        shell: pwsh
        run: node --test tests/issue-1228-security-closeout.test.mjs tests/issue-1827-codeql-second-pass.test.mjs tests/issue-1833-codeql-data-flow-closeout.test.mjs tests/issue-1837-codeql-zero-closeout.test.mjs tests/issue-1840-codeql-casebook-text-boundary.test.mjs tests/issue-503-windows-mcp-spawn.test.mjs tests/issue-1185-pi-managed-install.test.mjs tests/issue-104-windows-paths.test.mjs tests/issue-483-feedback-studio.test.mjs tests/issue-88-visual-board-navigation.test.mjs
      - name: Evaluate managed Pi compatibility
        shell: pwsh
        env:
          PLOTPICKLE_PI_COMPATIBILITY_CONTRACT: config/pi-101-compatibility.json
        run: node scripts/evaluate-pi-099-compatibility.mjs
      - name: Evaluate optional Pi Durable adapter
        shell: pwsh
        run: node scripts/evaluate-pi-durable-adapter.mjs
      - name: Prove active-default Pi Durable runtime on Windows
        shell: pwsh
        run: node --test tests/issue-2696-pi-durable-active-default.test.mjs
      - name: Prove Pi native MCP registration and stdio on Windows
        shell: pwsh
        run: node --test tests/issue-2591-pi-native-mcp.test.mjs
      - name: Prove governed Codemode and nested evidence on Windows
        shell: pwsh
        run: node --test tests/issue-2592-pi-codemode-evidence.test.mjs
      - name: Prove governed Pi virtual routing and classifier boundaries on Windows
        shell: pwsh
        run: node --test tests/issue-2593-pi-virtual-routing.test.mjs
      - name: Prove governed development delivery, exact-head recovery and claims on Windows
        shell: pwsh
        run: node --test tests/issue-2594-governed-development-delivery.test.mjs
      - name: Verify Pi Draft prompt transport through a Windows batch shim
        shell: pwsh
        run: node --test tests/issue-2359-pi-draft-stdin.test.mjs

  story-architect-windows:
    if: github.event_name == 'workflow_dispatch' || inputs.story
    name: Story Architect Windows proof
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js 24.19
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install PlotPickle dependencies
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund
      - name: Prove real Mastra Story Architect against a synthetic provider on Windows
        shell: pwsh
        env:
          PLOTPICKLE_PROOF_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --test tests/issue-2711-outline-local-auth.test.mjs tests/issue-2711-outline-durable-input.test.mjs tests/issue-2711-outline-task-controller.test.mjs tests/issue-2711-outline-task-gateway.test.mjs tests/issue-outline-agent-assessment.test.mjs tests/issue-2440-story-architect-structured-execution.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/pi/durable/story-architect-proof.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/pi/durable/outline-product-proof.mjs
      - name: Upload Story Architect fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-architect-${{ github.run_id }}
          path: |
            .artifacts/story-architect-2711/proof.json
            .artifacts/outline-product-2711/
            .artifacts/browser-verification/
          if-no-files-found: warn
          retention-days: 5
      - name: Prove scoped agent checkpoints and real JSONL recovery on Windows
        shell: pwsh
        env:
          PLOTPICKLE_CHECKPOINT_PROOF_HOME: ${{ runner.temp }}\plotpickle-checkpoint-proof
          PLOTPICKLE_PROOF_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --test tests/issue-2709-agent-checkpoint-task.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/pi/durable/checkpoint-proof.mjs
      - name: Upload agent checkpoint product evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-checkpoint-${{ github.run_id }}
          path: .artifacts/agent-checkpoint-2709/proof.json
          if-no-files-found: warn
          retention-days: 5

  media-windows:
    if: github.event_name == 'workflow_dispatch' || inputs.media
    name: Media / FFrames Windows proof
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install media proof dependencies
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate bundled local video setup
        run: node --test tests/ltx-bundled-default.test.mjs
      - name: Prepare pinned LGPL FFmpeg for proof only
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-proof.zip'
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-03-18-14/ffmpeg-n9.0.2-22-g46d8f462ee-win64-lgpl-shared-9.0.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'dcd3a8ec5a45cfbf59dfc9336f5ebcb26db28b572c17c77d048bcebf9354add7') { throw 'FFmpeg proof archive identity changed.' }
          Expand-Archive $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'ffmpeg-proof')
          $ffmpeg = Join-Path $env:RUNNER_TEMP 'ffmpeg-proof\ffmpeg-n9.0.2-22-g46d8f462ee-win64-lgpl-shared-9.0'
          "FFMPEG_DIR=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$ffmpeg\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Select reviewed Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Prove lru security backports on reviewed Rust toolchain
        shell: pwsh
        run: cargo +1.99.0 test --manifest-path tools/fframes-bridge/vendor/lru-0.14.0-patched/Cargo.toml --test security_backports
      - name: Build locked optional bridge on Windows
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: '2'
        run: cargo +1.99.0 build --release --locked --manifest-path tools/fframes-bridge/Cargo.toml
      - name: Decode and verify every rendered frame
        shell: pwsh
        env:
          PLOTPICKLE_PROOF_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/fframes-product-proof.mjs
      - name: Upload native media proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fframes-${{ github.run_id }}
          path: .artifacts/fframes-2717/
          if-no-files-found: warn
          retention-days: 5

  local-voice-windows:
    if: github.event_name == 'workflow_dispatch' || inputs.voice
    name: Local voice Windows proof
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate local whisper.cpp dictation fixture
        shell: pwsh
        env:
          PLOTPICKLE_HOME: ${{ runner.temp }}\plotpickle-voice
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install-whisper-cpp.ps1 -Mode Smoke -Approved

  windows-build-installer:
    if: github.event_name == 'workflow_dispatch' || inputs.build
    name: Windows build / installer proof
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js 24.19
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install PlotPickle dependencies
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate braces security provenance and runtime transport
        shell: pwsh
        run: node --test tests/issue-2706-security-closeout.test.mjs tests/issue-2789-windows-runtime-transport.test.mjs
      - name: Prove empty persistent runtime install is Git-free
        shell: pwsh
        run: node tests/issue-2789-windows-cold-runtime.mjs
      - name: Production web build on Windows
        shell: pwsh
        run: npm run build
      - name: Validate Windows installer source contract
        shell: pwsh
        run: node --test tests/issue-1456-windows-installer.test.mjs
      - name: Upload cold runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cold-runtime-${{ github.run_id }}
          path: .artifacts/runtime-2789/windows-cold-runtime.json
          if-no-files-found: warn
          retention-days: 5
