name: Issue 117 provider choice

on:
  push:
    branches:
      - agent/issue-117-ai-human-review

permissions:
  contents: write

concurrency:
  group: issue-117-provider-choice
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-117-ai-human-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Apply guarded provider choice patch
        run: node scripts/issue-117-provider-choice.mjs
      - name: Verify focused issue 117 contracts
        run: node --test tests/issue-117-ai-human-review.test.mjs
      - name: Commit permanent choice and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/issue-117-provider-choice.mjs .github/workflows/issue-117-provider-choice.yml
          git add app/review-workflows-panel.tsx
          git commit -m "Require explicit AI review provider choice"
          git push origin HEAD:agent/issue-117-ai-human-review
