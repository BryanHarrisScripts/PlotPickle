name: Phase 7 Generate Living Architecture

on:
  push:
    branches:
      - ci/1951-retire-legacy-gates

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Phase 7 branch
        uses: actions/checkout@v4
        with:
          ref: ci/1951-retire-legacy-gates
          fetch-depth: 0

      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Refresh canonical living architecture outputs
        run: node architecture/generate-living-architecture.mjs --refresh-update

      - name: Commit generated projections when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md architecture/plotpickle-architecture.svg architecture/plotpickle-architecture-overview.svg architecture/plotpickle-c4.md docs/architecture/agent-context.md docs/updates/documentation-drift.md docs/updates/README.md docs/updates/archive
          if git diff --cached --quiet; then
            echo "Living architecture already synchronized."
            exit 0
          fi
          git commit -m "Phase 7: regenerate living architecture projections"
          git push origin HEAD:ci/1951-retire-legacy-gates
