name: Issue 1462 Retire ComfyUI Diagnostics Bridge

on:
  push:
    branches:
      - arch/1462-retire-comfyui-diagnostics-bridge
    paths:
      - ".github/workflows/issue-1462-retire-comfyui-diagnostics-bridge.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire-comfyui-diagnostics-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/1462-retire-comfyui-diagnostics-bridge
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - run: npm ci --include=dev --no-audit --no-fund

      - name: Apply bounded bridge retirement
        run: python .github/scripts/issue-1462-retire-comfyui-diagnostics-bridge.py

      - name: Focused diagnostics regressions
        run: node --test tests/issue-1462-comfyui-diagnostics-kernel-move.test.mjs tests/issue-353-ai-routing-diagnostics.test.mjs tests/issue-374-comfyui-local-connection.test.mjs tests/issue-1083-comfy-mcp-management-adapter.test.mjs tests/issue-1461-repository-architecture-inventory.test.mjs

      - name: Diff hygiene
        run: git diff --check

      - name: Commit permanent bridge retirement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/issue-1462-retire-comfyui-diagnostics-bridge.py
          git add -A
          git commit -m "refactor(#1462): retire ComfyUI diagnostics root bridge"
          git push origin HEAD:arch/1462-retire-comfyui-diagnostics-bridge
