name: Issue 2093 pre-PR verification

on:
  push:
    branches:
      - issue-2093-library-bbs-directory

permissions:
  contents: read

jobs:
  focused-library-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Type-check repository
        run: npx tsc --noEmit --pretty false
      - name: Run focused Library regressions
        run: >-
          node --test
          tests/issue-2072-library-navigation.test.mjs
          tests/issue-2080-library-matrix-bbs-presentation.test.mjs
          tests/issue-2093-library-bbs-directory.test.mjs
