name: Apply issue 108 Lighthouse log readiness

on:
  push:
    branches:
      - agent/issue-108-lighthouse-log-stream

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-108-lighthouse-log-stream
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply permanent fix and remove migration
        run: |
          node scripts/issue-108-apply.mjs
          rm scripts/issue-108-apply.mjs
          rm .github/workflows/issue-108-apply.yml
      - name: Commit permanent files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Lighthouse log stream readiness"
          git push origin HEAD:agent/issue-108-lighthouse-log-stream
