name: Fix Phase B diagnostic syntax

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-b-diagnostic-craft-014
          fetch-depth: 0
      - name: Correct diagnostic ordering expression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/craft-diagnostics.ts')
          source = path.read_text(encoding='utf-8')
          old = '    .sort((left, right) => ({ problem: 0, watch: 1, healthy: 2 }[left.severity] - ({ problem: 0, watch: 1, healthy: 2 }[right.severity]));'
          new = '    .sort((left, right) => ({ problem: 0, watch: 1, healthy: 2 }[left.severity]) - ({ problem: 0, watch: 1, healthy: 2 }[right.severity]));'
          if source.count(old) != 1:
              raise RuntimeError('Expected one diagnostic sort expression')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-phase-b-syntax.yml').unlink()
          PY
      - name: Commit syntax correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Phase B diagnostic syntax"
          git push origin HEAD:agent/phase-b-diagnostic-craft-014
