name: Apply proposed primary menu

on:
  push:
    branches:
      - agent/proposed-primary-menu

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply navigation update
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          function replaceOnce(path, before, after) {
            const source = readFileSync(path, "utf8");
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${path}: expected one match, found ${count}`);
            writeFileSync(path, source.replace(before, after));
          }

          function appendOnce(path, marker, content) {
            const source = readFileSync(path, "utf8");
            if (source.includes(marker)) return;
            writeFileSync(path, `${source.trimEnd()}\n\n${content.trim()}\n`);
          }

          replaceOnce(
            "app/page.tsx",
            'import { synchronizeScreenplaySceneReferences } from "@/lib/scene-management";',
            'import { synchronizeScreenplaySceneReferences } from "@/lib/scene-management";\nimport { PRODUCT_NAVIGATION, type ProductNavigationId } from "@/lib/product-direction";',
          );

          replaceOnce(
            "app/page.tsx",
            'type MainTab = "instructions" | "learn" | "planner" | "script" | "visuals" | "engines" | "reports" | "settings";',
            'type MainTab = ProductNavigationId;',
          );

          replaceOnce(
            "app/page.tsx",
            `const mainTabs: { id: MainTab; label: string; description: string }[] = [
  { id: "instructions", label: "Instructions", description: "Learn the method" },
  { id: "learn", label: "Read & Learn", description: "Study the craft" },
  { id: "planner", label: "Story Planner", description: "Build the story" },
  { id: "script", label: "Screenplay", description: "Outline & write" },
  { id: "visuals", label: "Visual Board", description: "See the film" },
  { id: "engines", label: "Engines", description: "Refine the story" },
  { id: "reports", label: "Reports", description: "Measure the script" },
  { id: "settings", label: "Settings", description: "Setup & preferences" },
];`,
            `const mainTabs = PRODUCT_NAVIGATION;`,
          );

          replaceOnce(
            "app/page.tsx",
            'const [activeTab, setActiveTab] = useState<MainTab>("planner");',
            'const [activeTab, setActiveTab] = useState<MainTab>("dashboard");',
          );

          replaceOnce(
            "app/page.tsx",
            '<button type="button" className="brand-lockup home-trigger" onClick={() => { setActiveTab("planner"); setActiveSection("overview"); }} aria-label="Open the PlotPickle project dashboard">',
            '<button type="button" className="brand-lockup home-trigger" onClick={() => setShowLanding(true)} aria-label="Open the PlotPickle marketing page">',
          );

          replaceOnce(
            "app/page.tsx",
            `              className={activeTab === tab.id ? "active" : ""}
              key={tab.id}
              onClick={() => setActiveTab(tab.id)}
            >
              <span>{tab.label}</span>
              <small>{tab.description}</small>`,
            `              className={activeTab === tab.id ? "active" : ""}
              key={tab.id}
              title={tab.description}
              onClick={() => setActiveTab(tab.id)}
            >
              <span>{tab.label}</span>`,
          );

          replaceOnce(
            "app/page.tsx",
            `
        <div className="project-actions">
          <input ref={fileInputRef} className="visually-hidden" type="file" accept="application/json,.json,.txt,.fountain,.spmd,.fdx,text/plain,text/xml,application/xml" onChange={importFile} />
          <button type="button" className="text-button" onClick={createNewProject}>New</button>
          <button type="button" className="text-button" onClick={() => fileInputRef.current?.click()}>Import</button>
          <button type="button" className="text-button" onClick={exportProject}>Export</button>
          <button type="button" className="primary-button compact" onClick={loadAfterglow}>Load Afterglow</button>
        </div>`,
            "",
          );

          replaceOnce(
            "app/page.tsx",
            `      <main className="workspace">
        {activeTab === "instructions" ? (`,
            `      <main className="workspace">
        {activeTab === "dashboard" ? (
          <>
            <section className="dashboard-actions" aria-label="Project actions">
              <input ref={fileInputRef} className="visually-hidden" type="file" accept="application/json,.json,.txt,.fountain,.spmd,.fdx,text/plain,text/xml,application/xml" onChange={importFile} />
              <button type="button" className="text-button" onClick={createNewProject}>New project</button>
              <button type="button" className="text-button" onClick={() => fileInputRef.current?.click()}>Import</button>
              <button type="button" className="text-button" onClick={exportProject}>Export</button>
              <button type="button" className="primary-button compact" onClick={loadAfterglow}>Load Afterglow</button>
            </section>
            <ProjectOverview
              project={project}
              onOpenSection={(section) => { setActiveTab("planner"); setActiveSection(section as StorySection); }}
              onOpenEngines={() => setActiveTab("engines")}
              onOpenBlock={(number) => openBlock(number, "planner")}
            />
          </>
        ) : null}

        {activeTab === "instructions" ? (`,
          );

          const navigationLabels = new Map([
            ['label: "Read & Learn"', 'label: "Learn"'],
            ['label: "Story Planner"', 'label: "Plan"'],
            ['label: "Screenplay"', 'label: "Write"'],
            ['label: "Visual Board"', 'label: "Storyboard"'],
            ['label: "Engines"', 'label: "Refine"'],
          ]);
          for (const [before, after] of navigationLabels) replaceOnce("lib/product-direction.ts", before, after);

          replaceOnce(
            "README.md",
            `- **Dashboard** opens local and recent projects and reports verified storage, backup, GitHub and synchronization state.
- **Instructions** explains the 24 Blocks method, Project Overview and every story column.
- **Read & Learn** contains the complete 81-module learning system, terminology and contextual craft guidance.
- **Story Planner** contains optional Simple Start, story foundations, world, characters, structure and notes.
- **Screenplay** connects treatment, screenplay writing, import, revision and the complete script view.
- **Visual Board** connects character identity locks, visual language, 24 Blocks, 96 frames, pitch images and diagnostics.
- **Engines** opens focused structure, resonance, voice, page, draft, craft and specialist tools.
- **Reports** measures screenplay, character, scene, production and schema coverage from the active project.
- **Settings** contains preferences and Setup for GitHub, AI, music and future optional providers.`,
            `- **Dashboard** opens the active project overview and provides New, Import, Export and Afterglow actions.
- **Instructions** explains the 24 Blocks method, Project Overview and every story column.
- **Learn** opens Read & Learn with the complete 81-module learning system, terminology and contextual craft guidance.
- **Plan** opens Story Planner with optional Simple Start, story foundations, world, characters, structure and notes.
- **Write** opens the Screenplay workspace for treatment, screenplay writing, import, revision and the complete script view.
- **Storyboard** opens Visual Board for character identity locks, visual language, 24 Blocks, 96 frames, pitch images and diagnostics.
- **Refine** opens the Engines workspace for structure, resonance, voice, page, draft, craft and specialist tools.
- **Reports** measures screenplay, character, scene, production and schema coverage from the active project.
- **Settings** contains preferences and Setup for GitHub, AI, music and future optional providers.`,
          );
          replaceOnce(
            "README.md",
            '**Load a screenplay** in Read & Learn and **Import** in the top bar use the same ingestion pipeline.',
            '**Load a screenplay** in Learn and **Import** on the Dashboard use the same ingestion pipeline.',
          );

          replaceOnce(
            "docs/issue-85-product-direction.md",
            `1. Dashboard
2. Instructions
3. Read & Learn
4. Story Planner
5. Screenplay
6. Visual Board
7. Engines
8. Reports
9. Settings`,
            `1. Dashboard
2. Instructions
3. Learn
4. Plan
5. Write
6. Storyboard
7. Refine
8. Reports
9. Settings`,
          );
          replaceOnce(
            "docs/issue-85-product-direction.md",
            'Terminology belongs in Read & Learn. Reports belongs in the primary working navigation.',
            'Terminology belongs in Learn (the Read & Learn workspace). Reports belongs in the primary working navigation.',
          );

          replaceOnce(
            "tests/issue-85-product-direction.test.mjs",
            'const expected = ["Dashboard", "Instructions", "Read & Learn", "Story Planner", "Screenplay", "Visual Board", "Engines", "Reports", "Settings"];',
            'const expected = ["Dashboard", "Instructions", "Learn", "Plan", "Write", "Storyboard", "Refine", "Reports", "Settings"];',
          );

          writeFileSync("tests/issue-87-navigation-cleanup.test.mjs", `import assert from "node:assert/strict";
import { readFile } from "node:fs/promises";
import test from "node:test";

const root = new URL("..", import.meta.url);
const source = (path) => readFile(new URL(path, root), "utf8");

test("issue #87 opens the Dashboard directly and keeps Simple Start optional", async () => {
  const [page, middleware] = await Promise.all([source("app/page.tsx"), source("middleware.ts")]);
  assert.match(page, /useState<MainTab>\\("dashboard"\\)/);
  assert.match(page, /useState\\(false\\)/);
  assert.match(page, /id: "simpleStart"[\\s\\S]*label: "Simple Start"/);
  assert.match(page, /<SimpleStart/);
  assert.match(page, /setShowLanding\\(true\\)/);
  assert.match(page, /Open the PlotPickle marketing page/);
  assert.doesNotMatch(middleware, /NextResponse\\.redirect/);
  assert.doesNotMatch(middleware, /plotpickle-open-last/);
});

test("issue #87 places Reports in core navigation and Terminology in learning", async () => {
  const [page, contract] = await Promise.all([source("app/page.tsx"), source("lib/product-direction.ts")]);
  assert.match(contract, /id: "reports", label: "Reports"/);
  assert.match(page, /activeTab === "reports"[\\s\\S]*ScreenplayReports/);
  assert.match(page, /Screenplay terminology[\\s\\S]*TerminologyIndex/);
});

test("issue #87 groups GitHub, AI and Music under Settings Setup", async () => {
  const settings = await source("app/settings-panel.tsx");
  assert.match(settings, /Settings · Setup/);
  assert.match(settings, /GitHub setup/);
  assert.match(settings, /AI setup/);
  assert.match(settings, /Music setup/);
  assert.doesNotMatch(settings, /<b>Reports<\\/b>/);
  assert.doesNotMatch(settings, /<b>Terminology Index<\\/b>/);
});

test("issue #87 preserves the Welcome deep link as optional Simple Start", async () => {
  const welcome = await source("app/welcome/page.tsx");
  assert.match(welcome, /Simple Start · optional guided entry/);
  assert.match(welcome, /Open main workspace/);
  assert.match(welcome, /\\/\\?workspace=1/);
  assert.doesNotMatch(welcome, /plotpickle-open-last/);
  assert.doesNotMatch(welcome, /Open my last project directly/);
});
`);

          writeFileSync("tests/proposed-primary-menu.test.mjs", `import assert from "node:assert/strict";
import { readFile } from "node:fs/promises";
import test from "node:test";

const root = new URL("..", import.meta.url);
const source = (path) => readFile(new URL(path, root), "utf8");

test("the primary menu uses the approved short labels in order", async () => {
  const contract = await source("lib/product-direction.ts");
  const labels = ["Dashboard", "Instructions", "Learn", "Plan", "Write", "Storyboard", "Refine", "Reports", "Settings"];
  let lastIndex = -1;
  for (const label of labels) {
    const index = contract.indexOf(\`label: "\${label}"\`);
    assert.ok(index > lastIndex, \`Missing or out-of-order menu label: \${label}\`);
    lastIndex = index;
  }
});

test("the application renders the shared menu and opens on Dashboard", async () => {
  const page = await source("app/page.tsx");
  assert.match(page, /PRODUCT_NAVIGATION/);
  assert.match(page, /type MainTab = ProductNavigationId/);
  assert.match(page, /useState<MainTab>\\("dashboard"\\)/);
  assert.match(page, /activeTab === "dashboard"[\\s\\S]*ProjectOverview/);
  assert.match(page, /className="dashboard-actions"/);
  assert.doesNotMatch(page, /<small>{tab\\.description}<\\/small>/);
});

test("the brand opens the marketing splash and the top bar stays navigation-only", async () => {
  const page = await source("app/page.tsx");
  const topbar = page.match(/<header className="topbar">([\\s\\S]*?)<\\/header>/)?.[1] ?? "";
  assert.match(topbar, /setShowLanding\\(true\\)/);
  assert.match(topbar, /Open the PlotPickle marketing page/);
  assert.doesNotMatch(topbar, /project-actions/);
  assert.doesNotMatch(topbar, />New</);
});

test("the proposed menu has responsive styling and Dashboard actions", async () => {
  const css = await source("app/ui-ux-cleanup.css");
  assert.match(css, /Proposed simplified primary menu/);
  assert.match(css, /grid-template-columns: minmax\\(220px, 0\\.9fr\\) minmax\\(0, 4fr\\)/);
  assert.match(css, /min-height: 64px/);
  assert.match(css, /\\.dashboard-actions/);
  assert.match(css, /@media \\(max-width: 600px\\)/);
});
`);

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          if (!packageJson.scripts.test.includes("tests/proposed-primary-menu.test.mjs")) {
            packageJson.scripts.test = packageJson.scripts.test.replace(
              "tests/issue-90-front-page-collaboration.test.mjs",
              "tests/issue-90-front-page-collaboration.test.mjs tests/proposed-primary-menu.test.mjs",
            );
          }
          packageJson.scripts["test:primary-menu"] = "node --test tests/proposed-primary-menu.test.mjs";
          writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);

          appendOnce("app/ui-ux-cleanup.css", "Proposed simplified primary menu", `/* Proposed simplified primary menu */
.topbar {
  grid-template-columns: minmax(220px, 0.9fr) minmax(0, 4fr);
  gap: 18px;
  min-height: 64px;
  padding-inline: 20px;
}

.home-trigger {
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
}

.brand-icon {
  width: 38px;
  height: 38px;
  flex-basis: 38px;
}

.main-tabs {
  justify-content: space-between;
}

.main-tabs button {
  flex: 1 0 auto;
  min-width: max-content;
  min-height: 64px;
  padding: 9px clamp(10px, 1.3vw, 20px);
}

.main-tabs span {
  font-size: 14px;
  font-weight: 500;
}

.project-strip {
  top: 64px;
}

.dashboard-actions {
  display: flex;
  max-width: 1320px;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  margin: 0 auto;
  padding: 22px clamp(24px, 4vw, 52px) 0;
}

.dashboard-actions .text-button {
  min-height: 40px;
  padding: 9px 14px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: #fff;
  color: var(--pickle-dark);
}

.dashboard-actions .text-button:hover {
  border-color: var(--pickle);
  background: var(--pickle-pale);
  color: var(--pickle-dark);
}

.dashboard-actions .primary-button {
  min-height: 40px;
}

@media (max-width: 1120px) {
  .topbar {
    grid-template-columns: 56px minmax(0, 1fr);
    gap: 8px;
  }

  .main-tabs button {
    min-width: 88px;
    padding-inline: 11px;
  }
}

@media (max-width: 960px) {
  .topbar {
    position: static;
    grid-template-columns: 48px minmax(0, 1fr);
    padding: 10px 12px 0;
  }

  .main-tabs {
    grid-column: 1 / -1;
    grid-row: 2;
    margin-top: 6px;
  }

  .project-strip {
    position: static;
  }
}

@media (max-width: 820px) {
  .topbar {
    grid-template-columns: 44px minmax(0, 1fr);
  }

  .brand-icon {
    width: 36px;
    height: 36px;
  }

  .main-tabs button {
    min-width: 84px;
    padding-inline: 10px;
  }

  .dashboard-actions {
    padding-inline: 16px;
  }
}

@media (max-width: 600px) {
  .main-tabs {
    justify-content: flex-start;
  }

  .main-tabs button {
    flex: 0 0 auto;
    min-width: 88px;
  }

  .dashboard-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .dashboard-actions button {
    width: 100%;
  }
}`);
          NODE

      - name: Commit navigation update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/ui-ux-cleanup.css lib/product-direction.ts README.md docs/issue-85-product-direction.md package.json tests/issue-85-product-direction.test.mjs tests/issue-87-navigation-cleanup.test.mjs tests/proposed-primary-menu.test.mjs
          git commit -m "Implement proposed primary menu"
          git push
