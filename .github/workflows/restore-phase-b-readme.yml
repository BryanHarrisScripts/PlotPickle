name: Restore Phase B README

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-b-diagnostic-craft-014
          fetch-depth: 0
      - name: Restore full README and apply 0.14 notes
        run: |
          git show origin/main:README.md > README.md
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          source = path.read_text(encoding='utf-8')
          source = source.replace('Current application version: `0.13.0`', 'Current application version: `0.14.0`', 1)
          release = '''\n## PlotPickle 0.14 — Diagnostic Craft Layer\n\nPlotPickle now diagnoses story function rather than only storing story description. Open `/diagnostics` for Act I Launch, Opening Move, Scene Pulse, Story Thread overlays, the Setup/Payoff/Reflection Ledger, Character Arc checkpoints, and chronology-versus-presentation views. The same focused findings appear inside Structure, Writer and DraftLens.\n'''
          marker = '# PlotPickle Playhouse\n'
          source = source.replace(marker, marker + release, 1)
          source = source.replace('- **DraftLens Engine** converts reader experience into evidence, root diagnosis, and revision questions.', '- **DraftLens Engine** converts reader experience into evidence, root diagnosis, and revision questions, supported by computed Scene Pulse, thread, ledger, arc, and timeline findings.')
          source = source.replace('The suggested order is not mandatory. Writers may enter whichever engine addresses the current story problem.', 'The suggested order is not mandatory. Writers may enter whichever engine addresses the current story problem. The complete Diagnostic Craft workspace is available at `/diagnostics`.')
          migration = '- `lib/structure.ts`\n'
          future = '''- `lib/structure.ts`\n- `lib/craft-diagnostics.ts`\n\nA future portable `.ppf` project package and optional GitHub collaboration layer are tracked in issue #22. They will build on schema 1.7 revisions and provenance without changing local-only use.\n'''
          source = source.replace(migration, future, 1)
          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/restore-phase-b-readme.yml').unlink()
          PY
      - name: Commit restored release documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore complete PlotPickle 0.14 documentation"
          git push origin HEAD:agent/phase-b-diagnostic-craft-014
