name: Phase 2 source snapshot

on:
  push:
    branches: [agent/phase-2-dynamic-scenes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package source
        run: |
          zip -qr plotpickle-phase-two-source.zip . \
            -x '.git/*' 'node_modules/*' '.next/*' 'dist/*'

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: plotpickle-phase-two-source
          path: plotpickle-phase-two-source.zip
          retention-days: 1
