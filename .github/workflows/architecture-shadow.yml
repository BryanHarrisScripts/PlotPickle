name: Architecture Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-verification:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: experience-skins
            name: Layer 1 Experience Skins
            allow_network: true
          - id: experience-contract
            name: Layer 2 Experience Contract
            allow_network: false
          - id: production-harness
            name: Layer 3 Production Orchestration
            allow_network: false
          - id: agent-runtime
            name: Layer 4 Agent & Skill Mesh
            allow_network: false
          - id: story-canon
            name: Layer 5 Story / Canon / Evidence
            allow_network: false
          - id: provider-runtime
            name: Layer 6 Provider Runtime
            allow_network: false
          - id: verification
            name: Layer 7 Validation & Operations
            allow_network: false

    steps:
      - name: Checkout exact head with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Run BEN deterministic AI-slop/code-quality delta
        if: matrix.id == 'verification'
        run: >-
          node scripts/run-ben-code-quality.mjs
          --base-ref "${{ github.event.pull_request.base.sha || 'main' }}"

      - name: Run architecture verification
        run: >-
          node scripts/verification-shadow.mjs "${{ matrix.id }}"
          --base-ref "${{ github.event.pull_request.base.sha || 'main' }}"
          --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --platform linux
          --allow-network "${{ matrix.allow_network }}"

      - name: Upload architecture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-${{ matrix.id }}-${{ github.run_id }}
          path: |
            .artifacts/verification-shadow/${{ matrix.id }}.json
            .artifacts/verification-shadow/${{ matrix.id }}.summary.json
            .artifacts/verification-shadow/${{ matrix.id }}.comparison.json
            .artifacts/ben-code-quality/
            .artifacts/verification-live/webmcp-live.json
            .artifacts/verification-live/webmcp-app-server.log
            .artifacts/webmcp-startup/summary.json
            .artifacts/webmcp-startup/uat-findings.json
            .artifacts/webmcp-acceptance/**/*.json
            .artifacts/visual-readiness/*.png
            .artifacts/visual-readiness/visual-director-report.json
          if-no-files-found: warn
          retention-days: 7

  pi-windows-scope:
    name: Detect Pi Windows proof scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(scripts/(pi-managed-install|pi-durable-managed-install|pi-worker-runtime|pi-version|evaluate-pi-087-dsdd-session|evaluate-pi-099-compatibility|evaluate-pi-durable-adapter|dsdd-pi-session|dsdd-pi-draft|run-uat-repair-agent|setup-developer-agent-stack)\.mjs|scripts/pi/|config/(pi-087-dsdd-session-evaluation|pi-099-compatibility|pi-durable-adapter|pi-tool-exposure-policy|pi-codemode-policy|developer-agent-stack)\.json|core/sidecars/(durable-execution-contract|pi-durable-adapter)\.mjs|scripts/sidecars/pi-durable-service\.mjs|tests/issue-(2672-pi-durable-adapter|2696-pi-durable-active-default)\.test\.mjs|lib/agents/(developer-tool-authorization|pi-codemode-governance|pi-nested-call-evidence|agent-runtime-vocabulary)\.mjs|\.pi/(npm/|settings\.json|extensions/))'; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

  pi-windows-proof:
    name: Pi Windows proof
    needs: pi-windows-scope
    if: needs.pi-windows-scope.outputs.required == 'true'
    uses: ./.github/workflows/product-gate.yml

  voice-windows-scope:
    name: Detect local voice Windows proof scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(Start-PlotPickle\.bat|scripts/install-whisper-cpp\.ps1|config/local-voice-input\.json|build/voice/|runtime/whisper/|tests/issue-(1910|2341|2350)-)'; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

  voice-windows-proof:
    name: Local voice Windows proof
    needs: voice-windows-scope
    if: needs.voice-windows-scope.outputs.required == 'true'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Smoke reviewed whisper.cpp and base.en
        shell: pwsh
        env:
          PLOTPICKLE_HOME: ${{ runner.temp }}\plotpickle-voice
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install-whisper-cpp.ps1 -Mode Smoke -Approved

  modular-runtime-windows-scope:
    name: Detect modular runtime Windows proof scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(scripts/sidecars/|scripts/runtime-sidecar-supervisor\.mjs|config/runtime-sidecars\.json|core/sidecars/runtime/|tests/issue-2697-)'; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

  modular-runtime-windows-proof:
    name: Modular runtime Windows proof
    needs: modular-runtime-windows-scope
    if: needs.modular-runtime-windows-scope.outputs.required == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned dependencies for Windows production build
        shell: pwsh
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate production build on the supported Windows host
        shell: pwsh
        run: npm run build
      - name: Prove modular child-process lifecycle and media contract on Windows
        shell: pwsh
        run: node --experimental-strip-types --test tests/issue-2694-live-runtime-supervisor.test.mjs tests/issue-2695-live-dsdd-browser-services.test.mjs tests/issue-2696-pi-durable-active-default.test.mjs tests/issue-2697-live-modular-runtimes.test.mjs tests/issue-2665-timeline-rough-cut-media.test.mjs tests/issue-2666-screening-fframes-hardening.test.mjs
