name: Phase 2 diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture build and tests
        shell: bash
        run: |
          set +e
          npm run build > phase-2-build.log 2>&1
          build_status=$?
          node --test tests/issue-144-connection-trust.test.mjs tests/issue-146-github-app-connection.test.mjs tests/issue-148-automatic-story-project-setup.test.mjs > phase-2-focused-tests.log 2>&1
          focused_status=$?
          npm test > phase-2-full-tests.log 2>&1
          full_status=$?
          printf 'build_status=%s\nfocused_status=%s\nfull_status=%s\n' "$build_status" "$focused_status" "$full_status" > phase-2-status.txt
          if [ "$build_status" -ne 0 ] || [ "$focused_status" -ne 0 ] || [ "$full_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-diagnostic
          path: |
            phase-2-build.log
            phase-2-focused-tests.log
            phase-2-full-tests.log
            phase-2-status.txt
          if-no-files-found: error
          retention-days: 1
