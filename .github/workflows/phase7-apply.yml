name: Apply Phase 7 Graphic Novel Viewer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/graphic-novel-viewer'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Phase 7 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/graphic-novel-viewer

      - name: Stop after a diagnostic has been captured
        shell: bash
        run: test ! -f phase7-diagnostic.txt

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply and validate focused Phase 7 implementation
        shell: bash
        run: |
          set +e
          : > phase7-diagnostic.txt
          python scripts/phase7-apply.py >> phase7-diagnostic.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python - <<'PY' >> phase7-diagnostic.txt 2>&1
          from pathlib import Path
          path = Path('tests/issue-283-graphic-novel-viewer.test.mjs')
          value = path.read_text(encoding='utf-8')
          old = 'assert.match(workspace, /Replace image \\/ open versions/);'
          new = 'assert.match(viewer, /Replace image \\/ open versions/);'
          if old not in value:
              raise SystemExit('The stale Phase 7 assertion was not found.')
          path.write_text(value.replace(old, new, 1), encoding='utf-8')
          PY
            status=$?
          fi
          if [ "$status" -eq 0 ]; then npm ci >> phase7-diagnostic.txt 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then npm run test:graphic-novel-viewer >> phase7-diagnostic.txt 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then npm run lint >> phase7-diagnostic.txt 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then npm run build >> phase7-diagnostic.txt 2>&1; status=$?; fi
          if [ "$status" -ne 0 ]; then
            tail -n 400 phase7-diagnostic.txt > phase7-diagnostic-tail.txt
            mv phase7-diagnostic-tail.txt phase7-diagnostic.txt
            git config user.name "PlotPickle Phase 7 Diagnostics"
            git config user.email "actions@users.noreply.github.com"
            git add phase7-diagnostic.txt
            git commit -m "chore: capture Phase 7 failure"
            git push origin HEAD:agent/graphic-novel-viewer
            exit "$status"
          fi
          rm phase7-diagnostic.txt

      - name: Commit implementation and remove temporary applicator
        shell: bash
        run: |
          git config user.name "PlotPickle Phase 7 Builder"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/phase7-apply.py .github/workflows/phase7-apply.yml
          git add app/ai-pitch-deck-workspace.tsx app/ai-pitch-deck-workspace-base.tsx app/use-graphic-novel-queue.ts app/graphic-novel-viewer.tsx app/graphic-novel-viewer.module.css lib/graphic-novel-dialogue.ts lib/graphic-novel-viewer.ts tests/issue-283-graphic-novel-viewer.test.mjs package.json
          git commit -m "Add Graphic Novel bubble editor and complete viewer"
          git push origin HEAD:agent/graphic-novel-viewer
