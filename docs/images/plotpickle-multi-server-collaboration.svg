<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Complete PlotPickle installations collaborating through one owner-controlled GitHub film repository</title>
<desc id="desc">Local and private web PlotPickle installations all run the complete product. People hold Writer, Director, Producer, Actor and Reviewer roles inside PlotPickle. Local work stays private until proposed through a branch and pull request. The repository owner or maintainer decides what becomes the canonical project every connected installation can pull.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28786e"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#214d47" flood-opacity=".14"/></filter>
</defs>
<rect width="1400" height="900" rx="34" fill="#f1faf8"/>
<image href="../../public/brand/plotpickle-header-horizontal-600.png" x="48" y="34" width="300" height="100" preserveAspectRatio="xMinYMid meet"/>
<text x="700" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#173b37">Complete PlotPickle installations. One canonical film project.</text>
<text x="700" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#53726d">Roles belong to people inside PlotPickle—not to separate server editions.</text>

<g filter="url(#shadow)">
  <g transform="translate(55 185)">
    <rect width="330" height="200" rx="22" fill="#fff" stroke="#b7d8d1"/>
    <image href="../../public/brand/favicon/plotpickle-icon-128.png" x="22" y="22" width="62" height="62"/>
    <text x="102" y="48" font-family="Arial" font-size="13" font-weight="700" fill="#3d867c">COMPLETE PRODUCT</text>
    <text x="102" y="75" font-family="Arial" font-size="21" font-weight="700" fill="#214f49">Local PlotPickle — Alex</text>
    <text x="24" y="112" font-family="Arial" font-size="14" fill="#617d78">Private work on Alex’s computer</text>
    <rect x="24" y="132" width="72" height="30" rx="15" fill="#e4f3ef"/><text x="60" y="152" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#32675f">Writer</text>
    <rect x="104" y="132" width="82" height="30" rx="15" fill="#e4f3ef"/><text x="145" y="152" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#32675f">Director</text>
    <text x="24" y="184" font-family="Arial" font-size="12" fill="#6b847f">One person may hold multiple roles</text>
  </g>

  <g transform="translate(55 515)">
    <rect width="330" height="200" rx="22" fill="#fff" stroke="#b7d8d1"/>
    <image href="../../public/brand/favicon/plotpickle-icon-128.png" x="22" y="22" width="62" height="62"/>
    <text x="102" y="48" font-family="Arial" font-size="13" font-weight="700" fill="#3d867c">COMPLETE PRODUCT</text>
    <text x="102" y="75" font-family="Arial" font-size="21" font-weight="700" fill="#214f49">Private web PlotPickle</text>
    <text x="24" y="112" font-family="Arial" font-size="14" fill="#617d78">Restricted production-team installation</text>
    <rect x="24" y="132" width="82" height="30" rx="15" fill="#e4f3ef"/><text x="65" y="152" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#32675f">Producer</text>
    <rect x="114" y="132" width="82" height="30" rx="15" fill="#e4f3ef"/><text x="155" y="152" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#32675f">Reviewer</text>
    <text x="24" y="184" font-family="Arial" font-size="12" fill="#6b847f">Same screenplay, visual and production tools</text>
  </g>

  <g transform="translate(1015 185)">
    <rect width="330" height="200" rx="22" fill="#fff" stroke="#b7d8d1"/>
    <image href="../../public/brand/favicon/plotpickle-icon-128.png" x="22" y="22" width="62" height="62"/>
    <text x="102" y="48" font-family="Arial" font-size="13" font-weight="700" fill="#3d867c">COMPLETE PRODUCT</text>
    <text x="102" y="75" font-family="Arial" font-size="21" font-weight="700" fill="#214f49">Local PlotPickle — Sam</text>
    <text x="24" y="112" font-family="Arial" font-size="14" fill="#617d78">Performance and dialogue review</text>
    <rect x="24" y="132" width="64" height="30" rx="15" fill="#e4f3ef"/><text x="56" y="152" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#32675f">Actor</text>
    <rect x="96" y="132" width="82" height="30" rx="15" fill="#e4f3ef"/><text x="137" y="152" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#32675f">Reviewer</text>
    <text x="24" y="184" font-family="Arial" font-size="12" fill="#6b847f">Local notes remain local until proposed</text>
  </g>

  <g transform="translate(1015 515)">
    <rect width="330" height="200" rx="22" fill="#fff" stroke="#b7d8d1"/>
    <image href="../../public/brand/favicon/plotpickle-icon-128.png" x="22" y="22" width="62" height="62"/>
    <text x="102" y="48" font-family="Arial" font-size="13" font-weight="700" fill="#3d867c">COMPLETE PRODUCT</text>
    <text x="102" y="75" font-family="Arial" font-size="21" font-weight="700" fill="#214f49">Local PlotPickle — Lee</text>
    <text x="24" y="112" font-family="Arial" font-size="14" fill="#617d78">Visual and production contribution</text>
    <rect x="24" y="132" width="82" height="30" rx="15" fill="#e4f3ef"/><text x="65" y="152" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#32675f">Director</text>
    <rect x="114" y="132" width="82" height="30" rx="15" fill="#e4f3ef"/><text x="155" y="152" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#32675f">Producer</text>
    <text x="24" y="184" font-family="Arial" font-size="12" fill="#6b847f">Controlled visual and planning proposals</text>
  </g>

  <g transform="translate(470 235)">
    <rect width="460" height="410" rx="28" fill="#fff" stroke="#86bcb1" stroke-width="2"/>
    <path d="M68 40a43 43 0 0 0-14 84c2 .4 3-1 3-2v-8c-13 3-16-6-16-6-2-5-5-7-5-7-4-3 0-3 0-3 5 0 8 5 8 5 4 7 11 5 14 4 0-3 2-5 3-6-11-1-22-5-22-23 0-5 2-9 5-12-1-1-2-6 0-12 0 0 4-1 13 5a44 44 0 0 1 24 0c9-6 13-5 13-5 2 6 1 11 0 12 3 3 5 7 5 12 0 18-11 22-22 23 2 2 3 5 3 9v12c0 1 1 3 3 2A43 43 0 0 0 68 40Z" fill="#245d55"/>
    <text x="130" y="70" font-family="Arial" font-size="25" font-weight="700" fill="#1b514a">GitHub film repository</text>
    <text x="130" y="100" font-family="Arial" font-size="15" fill="#5d7a75">Owner-controlled source of truth and proposal layer</text>
    <rect x="38" y="138" width="384" height="76" rx="14" fill="#eaf7f4"/>
    <text x="56" y="168" font-family="Arial" font-size="15" font-weight="700" fill="#2a625b">Canonical branch</text>
    <text x="56" y="194" font-family="monospace" font-size="13" fill="#52726c">main / stories/film-title.ppf</text>
    <rect x="38" y="232" width="384" height="92" rx="14" fill="#fff7df"/>
    <text x="56" y="262" font-family="Arial" font-size="15" font-weight="700" fill="#725813">Proposal branches and pull requests</text>
    <text x="56" y="286" font-family="Arial" font-size="13" fill="#7d6d40">Script edits · character notes · visual updates</text>
    <text x="56" y="308" font-family="Arial" font-size="13" fill="#7d6d40">Production plans · review discussion</text>
    <rect x="38" y="342" width="384" height="44" rx="12" fill="#edf4f3"/>
    <text x="230" y="370" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#416a65">Owner / maintainer: review · merge · close</text>
  </g>
</g>

<g fill="none" stroke="#28786e" stroke-width="4" marker-end="url(#arrow)">
  <path d="M385 285C435 285 425 340 470 340"/>
  <path d="M385 615C435 615 425 545 470 545"/>
  <path d="M1015 285C965 285 975 340 930 340"/>
  <path d="M1015 615C965 615 975 545 930 545"/>
</g>
<text x="424" y="270" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#28786e">Pull / Sync</text>
<text x="424" y="630" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#28786e">Proposal PR</text>
<text x="976" y="270" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#28786e">Pull / Sync</text>
<text x="976" y="630" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#28786e">Proposal PR</text>

<path d="M700 645L700 748" stroke="#28786e" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="430" y="748" width="540" height="105" rx="20" fill="#dff3ee" stroke="#8fc2b7"/>
<text x="700" y="782" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#22564f">Approved canonical version</text>
<text x="700" y="808" text-anchor="middle" font-family="Arial" font-size="14" fill="#54756f">Only a repository owner or maintainer merge changes the canonical .ppf.</text>
<text x="700" y="832" text-anchor="middle" font-family="Arial" font-size="14" fill="#54756f">Every connected PlotPickle installation can then pull the approved work.</text>
</svg>
