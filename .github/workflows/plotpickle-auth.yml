name: PlotPickle Auth Full Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plotpickle-auth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-full-verification:
    name: ${{ matrix.label }} Auth, package and build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            package: package:windows
          - label: Linux x64
            os: ubuntu-latest
            package: package:linux
          - label: macOS arm64
            os: macos-14
            package: package:macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Run complete PlotPickle Auth regression suite
        run: npm run test:plotpickle-auth
      - name: Audit credential boundaries
        run: npm run audit:credentials
      - name: Production build
        run: npm run build
      - name: Stage platform release package and audit archive
        run: npm run ${{ matrix.package }}
