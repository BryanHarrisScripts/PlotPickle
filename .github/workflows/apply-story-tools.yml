name: Temporary Story Tools Apply

on:
  push:
    branches:
      - agent/story-tools-reports-readme-tabs
    paths:
      - .github/story-tools-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-tools-reports-readme-tabs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Apply coordinated PlotPickle update
        shell: bash
        run: |
          set -euo pipefail
          cat .github/story-tools-payload.part* | base64 --decode | gunzip > /tmp/apply-story-tools.py
          python /tmp/apply-story-tools.py
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          rm -f .github/story-tools-payload.part* .github/story-tools-trigger.txt .github/workflows/apply-story-tools.yml
      - name: Commit permanent source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PlotPickle Release Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add story dialectic, role reports, Canon attachments, and README tabs"
          git push origin HEAD:agent/story-tools-reports-readme-tabs
