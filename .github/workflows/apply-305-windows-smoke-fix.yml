name: Apply PR 305 Windows smoke correction

on:
  push:
    branches:
      - agent/298-settings-sitemap

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/298-settings-sitemap
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
      - name: Apply asserted smoke-script corrections
        run: |
          node --check scripts/apply-305-windows-smoke-fix.mjs
          node scripts/apply-305-windows-smoke-fix.mjs
          node --check scripts/windows-interaction-smoke.mjs
          node --check scripts/windows-release-smoke.mjs
          node --check scripts/windows-issue-208-smoke.mjs
      - name: Remove one-use staging files and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-305-windows-smoke-fix.mjs .github/workflows/apply-305-windows-smoke-fix.yml docs/.issue-305-windows-smoke-trigger
          git add scripts/windows-interaction-smoke.mjs scripts/windows-release-smoke.mjs scripts/windows-issue-208-smoke.mjs
          git commit -m "Harden Windows smoke navigation for Settings sitemap"
          git push origin HEAD:agent/298-settings-sitemap
