name: PlotPickle Auth Full Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/auth/**"
      - "app/profile-access/**"
      - "core/auth/**"
      - "core/storage/profile-private/**"
      - "core/storage/profile-private-browser.ts"
      - "config/credential-boundary.registry.json"
      - "docs/architecture/PLOTPICKLE-AUTH-*.md"
      - "docs/architecture/PLOTPICKLE-PROFILE-*.md"
      - "scripts/credential-boundary-audit.mjs"
      - "scripts/full-verification-graph.mjs"
      - "scripts/package-platform.mjs"
      - "tests/issue-1138-*.test.mjs"
      - "tests/issue-1139-*.test.mjs"
      - "tests/issue-1140-*.test.mjs"
      - "tests/issue-1141-*.test.mjs"
      - "tests/issue-1142-*.test.mjs"
      - "tests/issue-1143-*.test.mjs"
      - "tests/issue-1144-*.test.mjs"
      - "tests/issue-1145-*.test.mjs"
      - "tests/issue-1146-*.test.mjs"
      - "tests/issue-299-credential-boundary-audit.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/plotpickle-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plotpickle-auth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-full-verification:
    name: ${{ matrix.label }} Auth, package and build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            package: package:windows
          - label: Linux x64
            os: ubuntu-latest
            package: package:linux
          - label: macOS arm64
            os: macos-14
            package: package:macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22.13
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Run complete PlotPickle Auth regression suite
        run: npm run test:plotpickle-auth
      - name: Audit credential boundaries
        run: npm run audit:credentials
      - name: Production build
        run: npm run build
      - name: Stage platform release package and audit archive
        run: npm run ${{ matrix.package }}
