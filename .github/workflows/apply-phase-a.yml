name: Apply Phase A source migration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-a-core-model-013
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase A
        run: |
          set +e
          python scripts/continue-phase-a.py > docs/phase-a-migration.log 2>&1
          echo $? > docs/phase-a-migration.exit
          exit 0
      - name: Commit generated implementation or diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Phase A core model migration"
          git push origin HEAD:agent/phase-a-core-model-013
