name: PlotPickle Visual Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: plotpickle-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    name: Visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Find changed visual files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            base="$(git rev-parse HEAD^)"
            head="HEAD"
          fi
          files="$(git diff --name-only --diff-filter=ACMRT "$base" "$head" | grep -E '^(app|public|docs/design)/|\.(html|css|scss|jsx|tsx|vue)$|^config/(ui-ux-screen-registry|visual-capture-registry)\.json$|^scripts/(visual-capture|ui-ux-code-audit)\.mjs$|^\.github/workflows/visual\.yml$' || true)"
          {
            echo 'files<<PLOTPICKLE_VISUAL_FILES'
            printf '%s\n' "$files"
            echo 'PLOTPICKLE_VISUAL_FILES'
            if [[ -n "$files" ]]; then echo 'has_visual=true'; else echo 'has_visual=false'; fi
          } >> "$GITHUB_OUTPUT"
      - name: Set up Node
        if: steps.changed.outputs.has_visual == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Install dependencies
        if: steps.changed.outputs.has_visual == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci
      - name: Run deterministic visual contracts
        if: steps.changed.outputs.has_visual == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          node --test \
            tests/issue-59-about-origins-principles.test.mjs \
            tests/issue-301-splash-readme-refresh.test.mjs \
            tests/issue-337-ui-ux-consistency-foundation.test.mjs \
            tests/issue-339-application-shell-ui-ux.test.mjs \
            tests/issue-341-windows-startup-ui-ux.test.mjs \
            tests/issue-343-marketing-splash-ux.test.mjs \
            tests/issue-347-ai-provider-routing.test.mjs \
            tests/issue-349-common-overlays-ux.test.mjs \
            tests/issue-351-build-health-map.test.mjs \
            tests/issue-353-ai-routing-diagnostics.test.mjs \
            tests/issue-113-dashboard-command-centre.test.mjs \
            tests/issue-256-setup-connections-dashboard.test.mjs \
            tests/issue-355-dashboard-command-centre-ux.test.mjs \
            tests/issue-358-companion-inventory-ollama-bootstrap.test.mjs \
            tests/issue-360-dark-compute-hub-dashboard.test.mjs \
            tests/issue-367-creative-director-actions.test.mjs \
            tests/issue-371-visual-capture-ci.test.mjs \
            tests/issue-540-uat-continuity.test.mjs \
            tests/issue-544-ui-continuity-agent.test.mjs \
            tests/issue-546-complete-visual-migration.test.mjs \
            tests/issue-548-persistent-agent-windows.test.mjs \
            tests/ui-ux-code-audit-workflow.test.mjs \
            tests/ui-ux-code-audit-required-check.test.mjs \
            tests/windows-native-runtime.test.mjs
      - name: Locate Chrome
        if: steps.changed.outputs.has_visual == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser" ]]; then echo "Chrome/Chromium is unavailable on this runner." >&2; exit 1; fi
          echo "CHROME_PATH=$browser" >> "$GITHUB_ENV"
      - name: Capture rendered visual inventory
        if: steps.changed.outputs.has_visual == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/visual-capture.mjs
      - name: Run exact 30-stage Creative Writer UAT
        if: steps.changed.outputs.has_visual == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/creative-writer-uat
          npm run dev:local -- --host 127.0.0.1 --port 4173 > reports/creative-writer-uat/app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:4173 >/dev/null; then break; fi
            if [[ "$attempt" -eq 90 ]]; then cat reports/creative-writer-uat/app.log; exit 1; fi
            sleep 1
          done
          TMPDIR="$RUNNER_TEMP" node scripts/run-creative-writer-uat.mjs \
            --base-url http://127.0.0.1:4173 \
            --artifact-root reports/creative-writer-uat
          TMPDIR="$RUNNER_TEMP" node scripts/ui-continuity-agent.mjs \
            --server http://127.0.0.1:4173 \
            --report reports/ui-continuity-agent/ui-continuity-report.md
      - name: Upload rendered visual artifact
        if: always() && (steps.changed.outputs.has_visual == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plotpickle-rendered-visuals-${{ github.sha }}
          path: |
            reports/visual-capture/
            reports/creative-writer-uat/
            reports/ui-continuity-agent/
          if-no-files-found: error
          retention-days: 14
      - name: Run advisory AI design review
        if: steps.changed.outputs.has_visual == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_UI_AUDIT_MODEL: ${{ vars.OPENAI_UI_AUDIT_MODEL || 'gpt-4o' }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: node scripts/ui-ux-code-audit.mjs
      - name: Report no visual work required
        if: steps.changed.outputs.has_visual != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No visual files changed; the Visual gate passed without browser setup."

  full-visual-inventory:
    name: Post-merge full visual inventory
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - name: Validate full visual-capture contracts
        run: node --test tests/issue-371-visual-audit-capture.test.mjs tests/issue-371-visual-audit-retry.test.mjs
      - name: Check full visual-capture syntax
        run: |
          node --check scripts/visual-audit-capture.mjs
          node --check scripts/visual-audit-supervisor.mjs
          node --check scripts/visual-audit-validate.mjs
      - name: Capture every registered screen with isolated recovery
        shell: pwsh
        env:
          EDGE_PATH: "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"
          PLOTPICKLE_VISUAL_BATCH_SIZE: "6"
          PLOTPICKLE_VISUAL_BATCH_RETRY_COUNT: "1"
          PLOTPICKLE_VISUAL_BATCH_RETRY_SETTLE_MS: "8000"
          PLOTPICKLE_VISUAL_RETRY_BATCH_SIZE: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          node scripts/visual-audit-supervisor.mjs . reports/visual-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/visual-audit-validate.mjs config/visual-audit-captures.json reports/visual-audit/visual-audit-manifest.json
          $initialValidation = $LASTEXITCODE
          if ($initialValidation -ne 0) {
            Write-Host "Initial visual identity validation failed. Recapturing each requested screen in its own browser/server batch."
            Remove-Item -Recurse -Force reports/visual-audit -ErrorAction SilentlyContinue
            $env:PLOTPICKLE_VISUAL_BATCH_SIZE = $env:PLOTPICKLE_VISUAL_RETRY_BATCH_SIZE
            node scripts/visual-audit-supervisor.mjs . reports/visual-audit
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/visual-audit-validate.mjs config/visual-audit-captures.json reports/visual-audit/visual-audit-manifest.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node scripts/visual-audit-validate.mjs config/visual-audit-captures.json reports/visual-audit/visual-audit-manifest.json
      - name: Upload complete visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plotpickle-visual-audit-${{ github.sha }}
          path: reports/visual-audit/
          if-no-files-found: error
          retention-days: 5
