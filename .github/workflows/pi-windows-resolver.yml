name: Windows Pi Executable Resolution

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/pi-worker-runtime.mjs"
      - "scripts/run-uat-repair-agent.mjs"
      - "tests/issue-1185-pi-windows-resolver.test.mjs"
      - "tests/issue-651-pi-cline-uat-repair.test.mjs"
      - "tests/issue-1119-pi-required-worker.test.mjs"
      - ".github/workflows/pi-windows-resolver.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-windows-resolver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pi-resolver:
    name: ${{ matrix.label }} Pi resolver and build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
          - label: Linux x64
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22.19
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate Pi executable resolution and repair integration
        run: node --test tests/issue-1185-pi-windows-resolver.test.mjs tests/issue-651-pi-cline-uat-repair.test.mjs tests/issue-1119-pi-required-worker.test.mjs
      - name: Production build
        run: npm run build
