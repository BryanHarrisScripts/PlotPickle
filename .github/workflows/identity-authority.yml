name: Identity Authority Architecture

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/architecture/IDENTITY-AUTHORITY.md"
      - "build/studio-identity.ts"
      - "build/playhouse-federation.ts"
      - "lib/plotpickle-node-topology-core.mjs"
      - "tests/issue-1072-identity-authority.test.mjs"
      - "tests/issue-927-studio-identity.test.mjs"
      - "tests/issue-928-playhouse-federation.test.mjs"
      - "tests/issue-1013-plotpickle-node-topology.test.mjs"
      - ".github/workflows/identity-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase-a-contract:
    name: Identity authority compatibility and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate Phase A identity authority contract
        run: node --test tests/issue-1072-identity-authority.test.mjs

      - name: Validate existing Studio, BUZZ and Node compatibility
        run: node --test tests/issue-927-studio-identity.test.mjs tests/issue-928-playhouse-federation.test.mjs tests/issue-1013-plotpickle-node-topology.test.mjs

      - name: Production build
        run: npm run build
