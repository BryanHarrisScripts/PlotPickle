name: Phase 1 validation

on:
  push:
    branches: [agent/phase-1-core-schema]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Lint
        run: npm run lint

      - name: Build and test
        shell: bash
        run: |
          set +e
          npm test > phase-one-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Phase 1 validation failed. Final test output:"
            tail -n 180 phase-one-test.log
          else
            echo "Phase 1 validation passed. Final test output:"
            tail -n 40 phase-one-test.log
          fi
          exit "$status"
