name: Phase 1 diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture build and focused tests
        id: diagnostic
        shell: bash
        run: |
          set +e
          npm run build > phase-1-build.log 2>&1
          build_status=$?
          node --test tests/issue-144-connection-trust.test.mjs tests/issue-146-github-app-connection.test.mjs > phase-1-tests.log 2>&1
          test_status=$?
          printf 'build_status=%s\ntest_status=%s\n' "$build_status" "$test_status" > phase-1-status.txt
          if [ "$build_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-diagnostic
          path: |
            phase-1-build.log
            phase-1-tests.log
            phase-1-status.txt
          if-no-files-found: error
          retention-days: 1
