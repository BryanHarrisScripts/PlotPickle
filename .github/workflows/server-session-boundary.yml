name: Server Session Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - "core/auth/**"
      - "core/storage/profile-private/**"
      - "config/uat-autopilot-registry.json"
      - "docs/architecture/PLOTPICKLE-SERVER-SESSION-BOUNDARY.md"
      - "docs/architecture/PLOTPICKLE-PROFILE-PRIVATE-STORAGE.md"
      - "tests/issue-1138-auth-crypto-contract.test.mjs"
      - "tests/issue-1139-auth-core.test.mjs"
      - "tests/issue-1140-profile-master-key-vault.test.mjs"
      - "tests/issue-1141-profile-private-storage.test.mjs"
      - "tests/issue-1142-server-session-boundary.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/server-session-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-session-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server-session-boundary:
    name: ${{ matrix.label }} session security and build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
          - label: Linux x64
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate server sessions
        run: npm run test:server-session
      - name: Validate Auth, PMK and storage dependencies
        run: npm run test:auth-core && npm run test:profile-vault && npm run test:profile-storage && npm run test:auth-crypto
      - name: Production build
        run: npm run build
