name: LEARN Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learn-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  learn-validation:
    name: Focused Product Validation
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate the bundled LEARN curriculum
        run: npm run validate:learn

      - name: Validate Visual Writer progression contracts
        run: node --test tests/guided-progression-engine.test.mjs tests/issue-1030-visual-writer-progression.test.mjs

      - name: Validate Foundations Visual Narrative Wireframe
        run: node --test tests/foundations-build-visual-workshop.test.mjs tests/issue-1030b-foundations-wireframe.test.mjs

      - name: Validate World Visual Writer vertical slice
        run: node --test tests/issue-1030c-world-vertical-slice.test.mjs

      - name: Validate lorebound agent avatars
        run: node --test tests/issue-1056-lorebound-agent-avatars.test.mjs tests/issue-594-local-learn-rag-and-brand.test.mjs

      - name: Validate Agent Skills migration
        run: node --test tests/issue-913-agent-skills-migration.test.mjs

      - name: Validate BEN coding-agent quality contract
        run: node --test tests/issue-1005-ben-code-quality.test.mjs tests/issue-976-agent-skill-trust-runtime.test.mjs

      - name: Validate host-owned Agent Profile authority
        run: node --test tests/issue-962-agent-profiles.test.mjs tests/community-agent-roster.test.mjs

      - name: Validate task-scoped Context Engine trust and provenance
        run: node --test tests/issue-963-context-engine.test.mjs

      - name: Validate revision-aware PPF proposals and provenance
        run: node --test tests/issue-964-revision-aware-ppf.test.mjs

      - name: Validate connector, federation and egress trust policy
        run: node --test tests/issue-965-connector-trust-policy.test.mjs

      - name: Validate PlotPickle Node topology and network trust boundaries
        run: node --test tests/issue-1013-plotpickle-node-topology.test.mjs

      - name: Validate local Lazy Frames animatic integration
        run: node --test tests/issue-1016-lazy-frames-animatic.test.mjs

      - name: Validate bounded Responsibility Runs
        run: node --test tests/issue-966-responsibility-runs.test.mjs

      - name: Validate safe graph workflow primitives
        run: node --test tests/issue-967-safe-graph-workflows.test.mjs

      - name: Validate graph-based Full Verification and confirmed-finding repair gate
        run: node --test tests/issue-989-verification-execution-graph.test.mjs

      - name: Validate derived Story Knowledge Graph provenance and evals
        run: node --test tests/issue-999-story-knowledge-graph.test.mjs

      - name: Validate unified Run telemetry and portability evals
        run: node --test tests/issue-968-run-telemetry-evals.test.mjs

      - name: Validate local backup, restore, retention and trust architecture
        run: node --test tests/issue-969-local-backup-trust-docs.test.mjs

      - name: Validate BUZZ specialist agents, private context and signed room bridge
        run: node --test tests/issue-971-buzz-specialist-agents.test.mjs tests/issue-677-buzz-guildhall-settings.test.mjs

      - name: Validate full-verification Agent Skills architecture pair
        run: node --test tests/sage-brinewick-agent-skill.test.mjs tests/issue-913-agent-skills-migration.test.mjs

      - name: Validate creative UAT MCP compatibility and Community Terminal
        run: node --test tests/creative-uat-mcp-runtime.test.mjs tests/exhaustive-ui-harness-boundary.test.mjs tests/issues-940-941-community-observable-actions.test.mjs tests/issue-1010-community-backdoor-terminal.test.mjs tests/issue-1044-verification-community-bbs.test.mjs

      - name: Validate global navigation order and grouping
        run: node --test tests/workspace-navigation-contract.test.mjs tests/issue-544-ui-continuity-agent.test.mjs

      - name: Validate Windows startup Agent Skills contract
        run: node --test tests/startup-agent-skills-contract.test.mjs tests/issue-341-windows-startup-ui-ux.test.mjs tests/issue-974-startup-health-contract.test.mjs

      - name: Validate ComfyUI Windows API and managed-instance readiness contracts
        run: node --test tests/comfyui-live-verification.test.mjs tests/issue-961-auto-local-comfyui-sketch.test.mjs tests/issue-973-comfyui-api-readiness.test.mjs tests/issue-1012-comfyui-managed-instance-readiness.test.mjs

      - name: Validate one-click Full Verification, persistent Inbox, and role-safe orchestration
        run: node --test tests/full-verification-runner.test.mjs tests/full-verification-log-review.test.mjs tests/issue-930-verification-inbox.test.mjs tests/issue-931-verification-orchestration.test.mjs

      - name: Validate Windows verification resilience, progress, and outer watchdog
        run: node --test tests/issue-1008-windows-verification-resilience.test.mjs tests/issue-1031-full-verification-watchdog.test.mjs

      - name: Parse changed Windows verification and maintenance scripts
        shell: pwsh
        run: |
          foreach ($path in @(
            "scripts/run-plotpickle-full-check.ps1",
            "scripts/windows-companion-software.ps1",
            "scripts/install-local-ai-tool.ps1",
            "scripts/install-buzz-desktop.ps1",
            "scripts/start-comfyui-background.ps1",
            "scripts/comfyui-managed-instance-core.ps1",
            "scripts/configure-hardware-aware-local-ai.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              exit 1
            }
          }

      - name: Validate focused UAT registry contract
        run: node --test tests/issue-622-uat-autopilot.test.mjs

      - name: Validate README core direction
        run: node --test tests/core-readme-direction.test.mjs

      - name: Validate Afterglow revision PPF
        run: node --test tests/afterglow-revision-ppf.test.mjs

      - name: Test Startup, Settings, Foundations/LEARN, PLAN, and Wyrmwood
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/uat-focused
          node scripts/run-uat-autopilot.mjs --contracts-only --artifact-root .artifacts/uat-focused 2>&1 | tee .artifacts/uat-focused/contracts-console.log

      - name: Upload focused UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-uat-${{ github.run_id }}
          path: .artifacts/uat-focused
          if-no-files-found: error
          retention-days: 5

      - name: Production build
        run: npm run build

# Live local closed-loop UAT is run with scripts/run-uat-closed-loop.mjs.
# Add future product areas by extending config/uat-autopilot-registry.json with their focused tests and rendered expectations.
