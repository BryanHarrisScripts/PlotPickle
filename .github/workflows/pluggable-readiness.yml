name: Pluggable Readiness Architecture

on:
  pull_request:
    branches: [main]
    paths:
      - "build/extension-identity.ts"
      - "docs/architecture/PLUGGABLE-READINESS-IDENTITY.md"
      - "tests/issue-1072-extension-identity.test.mjs"
      - ".github/workflows/pluggable-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pluggable-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase-a-contract:
    name: Extension identity contract and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate extension identity and target contracts
        run: node --test tests/issue-1072-extension-identity.test.mjs

      - name: Validate existing Studio identity compatibility
        run: node --test tests/issue-927-studio-identity.test.mjs

      - name: Production build
        run: npm run build
