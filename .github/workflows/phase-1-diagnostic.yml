name: Phase 1 diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture complete test suite
        id: diagnostic
        shell: bash
        run: |
          set +e
          npm test > phase-1-full-test.log 2>&1
          test_status=$?
          printf 'test_status=%s\n' "$test_status" > phase-1-status.txt
          exit "$test_status"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-diagnostic
          path: |
            phase-1-full-test.log
            phase-1-status.txt
          if-no-files-found: error
          retention-days: 1
