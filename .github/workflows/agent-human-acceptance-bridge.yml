name: Trigger agent human acceptance

on:
  workflow_run:
    workflows:
      - PlotPickle Quality
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  dispatch-uat:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch smoke UAT
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/agent-human-acceptance.yml/dispatches" \
            --data '{"ref":"main","inputs":{"scope":"smoke"}}'
          echo "Dispatched Agent human acceptance smoke UAT from successful PlotPickle Quality run ${{ github.event.workflow_run.id }}."
