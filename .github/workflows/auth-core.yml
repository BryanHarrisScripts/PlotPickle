name: Auth Core

on:
  pull_request:
    branches: [main]
    paths:
      - "core/auth/**"
      - "docs/architecture/PLOTPICKLE-AUTH-*.md"
      - "docs/architecture/PLOTPICKLE-PROFILE-VAULT.md"
      - "tests/issue-1138-auth-crypto-contract.test.mjs"
      - "tests/issue-1139-auth-core.test.mjs"
      - "tests/issue-1140-profile-master-key-vault.test.mjs"
      - "config/uat-autopilot-registry.json"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "SECURITY.md"
      - ".github/workflows/auth-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-core:
    name: ${{ matrix.label }} Auth Core, regressions and build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
          - label: Linux x64
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate Auth Core
        run: npm run test:auth-core
      - name: Validate profile vault lifecycle
        run: npm run test:profile-vault
      - name: Validate Auth crypto dependency
        run: npm run test:auth-crypto
      - name: Validate canonical Node and BUZZ identity boundary
        run: node --test tests/issue-1135-canonical-node-buzz-boundary.test.mjs tests/issue-1072-identity-authority.test.mjs
      - name: Audit source credential boundaries
        run: npm run audit:credentials
      - name: Production build
        run: npm run build
