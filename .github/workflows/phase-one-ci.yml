name: Phase 1 validation

on:
  push:
    branches: [agent/phase-1-core-schema]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Lint
        run: npm run lint

      - name: Build and test
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          npm test > phase-one-test.log 2>&1

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-one-test-output
          path: phase-one-test.log
          retention-days: 3

      - name: Report validation result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.validation.outcome }}" != "success" ]; then
            echo "Phase 1 validation failed. Final test output:"
            tail -n 120 phase-one-test.log
            exit 1
          fi
          echo "Phase 1 validation passed."
          tail -n 40 phase-one-test.log
