name: Apply Phase D pitch and review

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-d-pitch-review-016
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply permanent Phase D integration
        run: python scripts/apply-phase-d.py
      - name: Remove one-time integration helpers
        run: rm -f scripts/apply-phase-d.py .github/workflows/apply-phase-d.yml
      - name: Commit permanent Phase D candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete PlotPickle 0.16 pitch and review workflows"
          git push origin HEAD:agent/phase-d-pitch-review-016
      - name: Install dependencies
        run: npm ci
      - name: Validate Phase D candidate
        run: |
          npm run lint
          npm test
