name: UI/UX Code Audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-ux-code-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-ux-ai-audit:
    name: Audit UI/UX against Design Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find changed UI files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            git fetch origin main --no-tags
            base="$(git merge-base HEAD origin/main)"
            head="HEAD"
          fi

          files="$(git diff --name-only --diff-filter=ACMRT "$base" "$head" | grep -E '\.(html|css|scss|jsx|tsx|vue)$' || true)"
          {
            echo 'files<<PLOTPICKLE_UI_FILES'
            printf '%s\n' "$files"
            echo 'PLOTPICKLE_UI_FILES'
            if [[ -n "$files" ]]; then echo 'has_ui=true'; else echo 'has_ui=false'; fi
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.changed.outputs.has_ui == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      - name: Run advisory UI/UX audit
        if: steps.changed.outputs.has_ui == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_UI_AUDIT_MODEL: ${{ vars.OPENAI_UI_AUDIT_MODEL || 'gpt-4o' }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        shell: bash
        run: |
          echo "Running one advisory UI/UX review pass. Deterministic tests own merge blocking."
          node scripts/ui-ux-code-audit.mjs

      - name: Publish audit summary
        if: always() && steps.changed.outputs.has_ui == 'true'
        shell: bash
        run: |
          if [[ -f audit-report.md ]]; then cat audit-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Update pull request audit comment
        if: always() && github.event_name == 'pull_request' && steps.changed.outputs.has_ui == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -f audit-report.md ]] || exit 0
          marker='<!-- plotpickle-ui-ux-audit -->'
          comment_id="$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1 || true)"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" -F body=@audit-report.md >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -F body=@audit-report.md >/dev/null
          fi

      - name: Complete required UI/UX status
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.changed.outputs.has_ui }}" != "true" ]]; then
            echo "No UI files changed; required UI/UX status passed without an AI call."
            exit 0
          fi

          if [[ ! -f audit-result.json ]]; then
            echo "::warning::Advisory UI/UX provider did not return a result. Deterministic UI tests remain authoritative."
            exit 0
          fi

          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync("audit-result.json", "utf8"));
            const issues = Number(result.issueCount || 0);
            if (result.verdict !== "pass" || issues > 0) {
              console.log(`::warning::Advisory UI/UX review reported ${issues} issue(s): ${result.summary || "Review the PR comment."}`);
              console.log("AI review is advisory; deterministic accessibility and product-contract checks own merge blocking.");
            } else {
              console.log("Advisory UI/UX review found no issues.");
            }
          '
