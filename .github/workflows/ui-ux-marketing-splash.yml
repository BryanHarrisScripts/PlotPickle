name: UI/UX marketing splash

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-ux-marketing-splash-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  marketing-splash-contract:
    name: Marketing splash UX contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: node --test tests/issue-343-marketing-splash-ux.test.mjs tests/issue-301-splash-readme-refresh.test.mjs
