name: Companion inventory and Ollama bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Start-PlotPickle.bat"
      - "scripts/windows-companion-software.ps1"
      - "scripts/install-local-ai-tool.ps1"
      - "scripts/install-buzz-desktop.ps1"
      - "config/ollama-starter-model.json"
      - "build/ollama-bootstrap-gateway.ts"
      - "build/local-ai-gateway.ts"
      - "build/local-ai-installation-gateway.ts"
      - "build/local-ai-installation-status.ts"
      - "app/writing-assistant-console.tsx"
      - "app/writing-assistant-console.module.css"
      - "docs/ISSUE-358-COMPANION-SOFTWARE.md"
      - "tests/issue-358-companion-inventory-ollama-bootstrap.test.mjs"
      - "tests/issue-369-windows-companion-registry-values.test.ps1"
      - ".github/workflows/companion-inventory-ollama-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-inventory-ollama-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  companion-contract:
    name: Companion inventory and Ollama bootstrap contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
      - run: node --test tests/issue-358-companion-inventory-ollama-bootstrap.test.mjs tests/issue-258-creative-compute-paths.test.mjs tests/issue-341-windows-startup-ui-ux.test.mjs
      - run: node --check tests/issue-358-companion-inventory-ollama-bootstrap.test.mjs

  powershell-parse:
    name: Windows companion PowerShell parse
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse companion scripts without running installers
        shell: pwsh
        run: |
          $errors = @()
          foreach ($path in @(
            "scripts/windows-companion-software.ps1",
            "scripts/install-local-ai-tool.ps1",
            "scripts/install-buzz-desktop.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) {
              $errors += $parseErrors | ForEach-Object { "${path}: $($_.Message)" }
            }
          }
          if ($errors.Count) { throw ($errors -join [Environment]::NewLine) }
      - name: Test malformed registry property handling
        shell: pwsh
        run: '& "./tests/issue-369-windows-companion-registry-values.test.ps1"'
