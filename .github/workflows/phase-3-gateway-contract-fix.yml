name: Phase 3 gateway contract repair

on:
  push:
    branches:
      - agent/phase-3-git-native-project-sync
    paths:
      - .github/workflows/phase-3-gateway-contract-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-3-git-native-project-sync
          fetch-depth: 0

      - name: Repair the Phase 2 compatibility path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          gateway = Path("build/github-app-gateway.ts")
          source = gateway.read_text()
          old = "manifest.canonicalProject.path"
          count = source.count(old)
          if count != 2:
              raise SystemExit(f"Expected two stale canonicalProject.path references, found {count}")
          source = source.replace(old, "manifest.portableProject.path")
          gateway.write_text(source)

          workflow = Path(".github/workflows/phase-3-gateway-contract-fix.yml")
          workflow.unlink()
          PY

          git config user.name "PlotPickle Build"
          git config user.email "actions@users.noreply.github.com"
          git add build/github-app-gateway.ts .github/workflows/phase-3-gateway-contract-fix.yml
          git commit -m "Repair GitHub App gateway for the 1.1 story manifest"
          git push origin HEAD:agent/phase-3-git-native-project-sync
