name: Issue 333 Dashboard Settings build

on:
  push:
    branches:
      - agent/333-dashboard-settings-separation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/333-dashboard-settings-separation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply coordinated migration
        run: |
          python scripts/issue-333-dashboard-settings.py
          python scripts/issue-333-followup.py
          python scripts/issue-333-followup-tests.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Remove temporary build helpers
        run: rm .github/workflows/issue-333-build.yml scripts/issue-333-dashboard-settings.py scripts/issue-333-followup.py scripts/issue-333-followup-tests.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app config tests .github scripts
          git commit -m "Separate Dashboard status from component Settings"
          git push origin HEAD:agent/333-dashboard-settings-separation
