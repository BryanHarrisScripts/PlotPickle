<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Settings relic</title>
  <desc id="desc">A transparent fantasy compass-and-gear relic with gold metalwork and a teal centre gem.</desc>
  <defs>
