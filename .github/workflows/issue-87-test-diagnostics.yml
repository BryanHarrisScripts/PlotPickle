name: Issue 87 test diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/issue-87-test-diagnostics.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Issue 87 contract
        run: node --test tests/issue-87-navigation-cleanup.test.mjs
      - name: Settings compatibility
        if: always()
        run: node --test tests/settings-menu.test.mjs
      - name: New-writer compatibility
        if: always()
        run: node --test tests/issue-63-new-writer-path.test.mjs
      - name: Project navigation compatibility
        if: always()
        run: node --test tests/project-navigation-licensing.test.mjs
      - name: Rendered HTML compatibility
        if: always()
        run: node --test tests/rendered-html.test.mjs
      - name: Reports and terminology compatibility
        if: always()
        run: node --test tests/issue-26-reports-terms-collaboration.test.mjs
