name: Apply workspace introduction cards

on:
  push:
    branches:
      - agent/unified-workspace-intros

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Add missing workspace introduction cards') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-workspace-intros

      - name: Add introductions to Screenplay, Visual Board, and Settings
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}")
              file.write_text(text.replace(old, new))

          replace_exact(
              "app/script-workspace.tsx",
              'import TreatmentEditor from "./treatment-editor";\nimport styles from "./script-workspace.module.css";',
              'import TreatmentEditor from "./treatment-editor";\nimport WorkspaceIntro from "./workspace-intro";\nimport styles from "./script-workspace.module.css";',
          )

          screenplay_intro = '''      <div className={styles.workspaceShell}>\n        <WorkspaceIntro\n          id="screenplay-workspace-title"\n          eyebrow="Screenplay workspace"\n          title="Turn the plan into a complete, scrollable screenplay."\n          description="Develop the treatment and formatted screenplay in one connected writing flow. Every scene, action line, character cue, and line of dialogue stays linked to the active 24 Blocks and 96 mini-blocks."\n          sideEyebrow="Write with context"\n          sideTitle="Plan, draft, review, and export without losing your place."\n          sideDescription="Switch between Treatment and Screenplay, use optional AI only when useful, and export the active draft to Fountain, Final Draft, or PDF."\n        />\n        <div className={styles.modeBar}>'''
          replace_exact(
              "app/script-workspace.tsx",
              '      <div className={styles.workspaceShell}>\n        <div className={styles.modeBar}>',
              screenplay_intro,
              expected=2,
          )

          replace_exact(
              "app/visual-storyboard.tsx",
              'import { createStoryboardFrame, type MiniBlock, type PlotPickleProject, type StoryBlock, type StoryScene, type VisualFrame } from "@/lib/project";\nimport styles from "./visual-storyboard.module.css";',
              'import { createStoryboardFrame, type MiniBlock, type PlotPickleProject, type StoryBlock, type StoryScene, type VisualFrame } from "@/lib/project";\nimport WorkspaceIntro from "./workspace-intro";\nimport styles from "./visual-storyboard.module.css";',
          )

          visual_intro = '''    <div className={styles.page}>\n      <WorkspaceIntro\n        embedded\n        id="visual-board-workspace-title"\n        eyebrow="Visual Board workspace"\n        title="See the complete film before every frame is finished."\n        description="Move from the 24-block overview into all 96 mini-block visuals. Each frame stays connected to the story movement, characters, locations, screenplay evidence, camera direction, and continuity that created it."\n        sideEyebrow="One continuous film"\n        sideTitle="Keep every image tied to the dramatic turn it must communicate."\n        sideDescription="Review approved frames, refine prompts, generate new images locally, and return to the matching Block plan whenever the visual story needs clarification."\n      />\n      <header className={styles.header}>'''
          replace_exact(
              "app/visual-storyboard.tsx",
              '    <div className={styles.page}>\n      <header className={styles.header}>',
              visual_intro,
          )
          replace_exact(
              "app/visual-storyboard.tsx",
              '<div><span>Visual Storyboard</span><h1>Put the entire movie in front of you.</h1><p>Move from the 24-block overview into all 96 mini-block visuals. PlotPickle builds each prompt from the story you have already developed.</p></div>',
              '<div><span>Board controls</span><h1>Review and develop the active visual sequence.</h1><p>Switch between the 24-block overview and all 96 mini-block frames, then inspect, prompt, generate, or revise the selected visual.</p></div>',
          )

          replace_exact(
              "app/settings-panel.tsx",
              'import { ScreenplayReports, TerminologyIndex } from "./settings-project-tools";',
              'import { ScreenplayReports, TerminologyIndex } from "./settings-project-tools";\nimport WorkspaceIntro from "./workspace-intro";',
          )

          settings_intro = '''    <div className={styles.page}>\n      <WorkspaceIntro\n        embedded\n        id="settings-workspace-title"\n        eyebrow="Settings workspace"\n        title="Control project tools and optional connections."\n        description="Review screenplay reports and terminology, then choose whether to connect AI, music services, or future plugins. PlotPickle remains fully usable without an external account or creative service."\n        sideEyebrow="Local by default"\n        sideTitle="Connect only what you choose."\n        sideDescription="Your project files stay on this device. API keys are handled by the private local server and are never stored in the screenplay or exported project."\n      />\n      <header className={styles.heading}>'''
          replace_exact(
              "app/settings-panel.tsx",
              '    <div className={styles.page}>\n      <header className={styles.heading}>',
              settings_intro,
          )
          replace_exact(
              "app/settings-panel.tsx",
              '<p>Settings</p>\n          <h1>Project tools and connections</h1>\n          <span>Review the active screenplay, learn industry language, and set up optional creative services.</span>',
              '<p>Settings tools</p>\n          <h1>Choose a settings tool.</h1>\n          <span>Reports and terminology work without AI; every service connection remains optional.</span>',
          )
          PY

      - name: Commit the workspace introductions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/script-workspace.tsx app/visual-storyboard.tsx app/settings-panel.tsx
          git commit -m "Add missing workspace introduction cards"
          git push origin HEAD:agent/unified-workspace-intros
