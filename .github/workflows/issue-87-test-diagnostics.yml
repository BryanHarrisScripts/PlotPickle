name: Issue 87 test diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/issue-87-test-diagnostics.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Print failing test files only
        shell: bash
        run: |
          set +e
          failed=0
          for file in tests/*.test.mjs; do
            node --test "$file" > /tmp/one-test.log 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              failed=1
              echo "FAIL: $file"
              tail -n 45 /tmp/one-test.log
            fi
          done
          exit "$failed"
