      <stop offset="0.52" stop-color="#8d652b"/>
      <stop offset="0.76" stop-color="#e5bd67"/>
      <stop offset="1" stop-color="#5b3e1b"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35413d"/>
      <stop offset="0.48" stop-color="#111817"/>
      <stop offset="1" stop-color="#52615b"/>
