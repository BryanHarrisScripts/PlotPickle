name: Apply issue 100 premium UI

on:
  push:
    branches:
      - agent/issue-100-premium-ui-ux
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'agent/issue-100-premium-ui-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-100-premium-ui-ux
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply premium UI migration
        run: |
          node scripts/issue-100-shell.mjs
          node scripts/issue-100-reports-tests.mjs
          rm scripts/issue-100-shell.mjs
          rm scripts/issue-100-reports-tests.mjs
          rm .github/workflows/issue-100-apply.yml
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build premium UI UX consistency pass"
          git push origin HEAD:agent/issue-100-premium-ui-ux
