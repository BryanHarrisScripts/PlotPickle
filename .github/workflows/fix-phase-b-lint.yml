name: Fix Phase B lint

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-b-diagnostic-craft-014
          fetch-depth: 0
      - name: Remove unused diagnostic type import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/craft-diagnostics.ts')
          source = path.read_text(encoding='utf-8')
          source = source.replace('import type { Character, PlotPickleProject, StoryBlock } from "./project";', 'import type { Character, PlotPickleProject } from "./project";')
          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/fix-phase-b-lint.yml').unlink()
          PY
      - name: Commit lint correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Phase B diagnostic lint"
          git push origin HEAD:agent/phase-b-diagnostic-craft-014
