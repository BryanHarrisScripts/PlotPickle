name: Story Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - "core/buzz/nostr-event-verification.mjs"
      - "core/buzz/nostr-event-verification.d.ts"
      - "core/story-workflow/buzz/**"
      - "core/story-workflow/buzz/buzz-story-bridge-core.mjs"
      - "core/story-workflow/buzz/buzz-story-bridge-core.d.ts"
      - "core/story-workflow/story-workflow-core.mjs"
      - "core/story-workflow/story-workflow-core.d.ts"
      - "modules/story-workflow/**"
      - "lib/agents/**"
      - "lib/buzz/**"
      - "app/buzz-live-health-card.tsx"
      - "app/buzz-live-health-card.module.css"
      - "build/profile-request-context.ts"
      - "build/buzz/buzz-agent-identity-binding-loader.ts"
      - "build/story-workflow-buzz-bridge-gateway.ts"
      - "build/responsibility-run-gateway.ts"
      - "build/buzz-gateway.ts"
      - "config/agent-profiles.json"
      - "config/agent-profile-extensions/public.json"
      - "Utilities/Sync-PlotPickle-BUZZ.ps1"
      - "tests/issue-1416-story-workflow-engine.test.mjs"
      - "tests/issue-1422-buzz-story-bridge*.test.mjs"
      - "tests/issue-1422-buzz-agent-identity-binding.test.mjs"
      - "vite.config.ts"
      - ".github/workflows/story-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  story-bridge:
    name: Bounded BUZZ Story Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate Story Workflow and Story Bridge contracts
        run: node --test tests/issue-1416-story-workflow-engine.test.mjs tests/issue-1422-buzz-story-bridge.test.mjs tests/issue-1422-buzz-story-bridge-hardening.test.mjs tests/issue-1422-buzz-story-bridge-preflight.test.mjs tests/issue-1422-buzz-story-bridge-session-diagnostics.test.mjs tests/issue-1422-buzz-agent-identity-binding.test.mjs

      - name: Validate existing Agent and connector authority boundaries
        run: node --test tests/issue-962-agent-profiles.test.mjs tests/issue-963-context-engine.test.mjs tests/issue-965-connector-trust-policy.test.mjs tests/issue-966-responsibility-runs.test.mjs

      - name: Validate existing BUZZ identity and Community boundaries
        run: node --test tests/issue-1067-buzz-conversation-mirror.test.mjs tests/issue-1129-buzz-native-community.test.mjs tests/buzz-story-room-access-agents.test.mjs

      - name: Production build
        run: npm run build
