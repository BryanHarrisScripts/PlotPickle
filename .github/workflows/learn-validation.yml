name: LEARN Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learn-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  learn-validation:
    name: LEARN Validation
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate LEARN foundation, storage recovery, current local startup, PLAN handoff, Mastra readiness, and startup UAT contract
        run: node --test tests/foundation-architecture.test.mjs tests/issue-341-windows-startup-ui-ux.test.mjs tests/issue-580-mastra-runtime-readiness.test.mjs tests/issue-581-learn-uat-startup.test.mjs tests/issue-583-foundations-lessons-formatting.test.mjs tests/issue-584-foundations-learning-plan-handoff.test.mjs tests/issue-585-learn-stale-project-recovery.test.mjs tests/issue-586-stale-local-session.test.mjs

      - name: Production build
        run: npm run build

# Validation workflow intentionally kept small for the LEARN-first modular reset.
