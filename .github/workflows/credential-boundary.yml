name: Credential boundary audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "43 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Credential boundary audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
      - name: Audit source and credential registry
        run: node scripts/credential-boundary-audit.mjs --mode source
      - name: Verify value-free local audit on an empty home
        run: node scripts/local-credential-audit.mjs --root . --home "$RUNNER_TEMP/plotpickle-empty-home" --strict
      - name: Run credential-boundary contracts
        run: node --test tests/issue-299-credential-boundary-audit.test.mjs tests/issue-299-local-credential-audit.test.mjs tests/issue-300-native-h3-credential-registry.test.mjs
