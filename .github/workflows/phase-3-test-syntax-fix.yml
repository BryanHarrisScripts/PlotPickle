name: Phase 3 test syntax repair

on:
  push:
    branches:
      - agent/phase-3-git-native-project-sync
    paths:
      - .github/workflows/phase-3-test-syntax-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3-git-native-project-sync
          fetch-depth: 0

      - name: Replace literal newline escapes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path("tests/issue-150-git-native-project-sync.test.mjs")
          source = test.read_text()

          old_assertions = r'''  assert.match(gateway, /parents:\s*\[branch\.commitSha\]/);\n  assert.match(gateway, /body:\s*\{\s*sha:\s*commitSha,\s*force:\s*false\s*\}/s);'''
          new_assertions = '''  assert.match(gateway, /parents:\\s*\\[branch\\.commitSha\\]/);
  assert.match(gateway, /body:\\s*\\{\\s*sha:\\s*commitSha,\\s*force:\\s*false\\s*\\}/s);'''
          if old_assertions not in source:
              raise SystemExit("The literal assertion newline was not found")
          source = source.replace(old_assertions, new_assertions, 1)

          old_workflows = r'''    ".github/workflows/phase-3-source-integrate.yml",\n    ".github/workflows/phase-3-gateway-contract-fix.yml",\n    ".github/workflows/phase-3-test-contract-fix.yml",'''
          new_workflows = '''    ".github/workflows/phase-3-source-integrate.yml",
    ".github/workflows/phase-3-gateway-contract-fix.yml",
    ".github/workflows/phase-3-test-contract-fix.yml",
    ".github/workflows/phase-3-test-syntax-fix.yml",'''
          if old_workflows not in source:
              raise SystemExit("The literal workflow-list newlines were not found")
          source = source.replace(old_workflows, new_workflows, 1)

          test.write_text(source)
          Path(".github/workflows/phase-3-test-syntax-fix.yml").unlink()
          PY

          git config user.name "PlotPickle Build"
          git config user.email "actions@users.noreply.github.com"
          git add tests/issue-150-git-native-project-sync.test.mjs .github/workflows/phase-3-test-syntax-fix.yml
          git commit -m "Repair Phase 3 test syntax"
          git push origin HEAD:agent/phase-3-git-native-project-sync
