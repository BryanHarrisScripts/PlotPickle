name: Hardware-Aware Local AI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-ai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-ai-validation:
    name: Local AI Architecture, Providers and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Validate Agent Skills authority boundary
        run: node --test tests/issue-913-agent-skills-migration.test.mjs
      - name: Validate hardware-aware local AI contracts
        run: node --test tests/hardware-aware-local-ai-runtime.test.mjs tests/automatic-local-model-capabilities.test.mjs tests/issue-1001-hardware-model-catalog.test.mjs tests/foundation-architecture.test.mjs tests/issue-1012-comfyui-managed-instance-readiness.test.mjs tests/issue-1018-rag-python-comfy-repair-order.test.mjs tests/issue-1020-python-probe-native-stderr.test.mjs tests/issue-1022-sdxl-starter-checkpoint.test.mjs
      - name: Parse hardware-aware Windows scripts
        shell: pwsh
        run: |
          foreach ($script in @("./scripts/configure-hardware-aware-local-ai.ps1", "./scripts/install-comfyui-sdxl-starter.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script :: $($_.Message)" }
              throw "$script contains PowerShell parse errors."
            }
          }
      - name: Exercise managed ComfyUI fixture and Pascal stack inspection
        shell: pwsh
        run: |
          . ./scripts/comfyui-managed-instance-core.ps1
          $root = Join-Path $env:RUNNER_TEMP "plotpickle-comfy-managed"
          $engine = Join-Path $root "Demo/ComfyUI"
          $venv = Join-Path $engine ".venv"
          $site = Join-Path $venv "Lib/site-packages"
          New-Item -ItemType Directory -Force -Path $site, (Join-Path $venv "bin") | Out-Null
          Set-Content -LiteralPath (Join-Path $engine "main.py") -Value "# fixture"
          Set-Content -LiteralPath (Join-Path $venv "bin/python") -Value "fixture"
          Set-Content -LiteralPath (Join-Path $venv "pyvenv.cfg") -Value "version = 3.13.12"
          foreach ($name in @("torch-2.10.0+cu126.dist-info", "torchvision-0.25.0+cu126.dist-info", "torchaudio-2.10.0+cu126.dist-info")) {
            New-Item -ItemType Directory -Force -Path (Join-Path $site $name) | Out-Null
          }
          $instances = @(Get-ComfyManagedInstances -Roots @($root))
          if ($instances.Count -ne 1 -or $instances[0].State -ne "installed") { throw "Managed fixture was not recognized as installed." }
          $stack = Get-ComfyManagedEnvironmentStack -Instance $instances[0]
          if (-not (Test-ComfyPascalCu126Stack -Stack $stack)) { throw "Reviewed Pascal cu126 stack was not recognized." }
          $provisionRoot = Join-Path $env:RUNNER_TEMP "plotpickle-comfy-provisioning"
          New-Item -ItemType Directory -Force -Path (Join-Path $provisionRoot "Half/ComfyUI") | Out-Null
          $partial = @(Get-ComfyManagedInstances -Roots @($provisionRoot))
          if ($partial.Count -ne 1 -or $partial[0].State -ne "provisioning") { throw "Incomplete managed fixture was not recognized as provisioning." }
      - name: Validate exhaustive UAT targeting and baseline repair contracts
        run: node --test tests/exhaustive-ui-harness-boundary.test.mjs tests/pi-local-model-exhaustive-uat.test.mjs tests/issue-972-exhaustive-uat-baseline.test.mjs
      - name: Validate provider, creative-compute, and companion updater contracts
        run: node --test tests/ai-architecture.test.mjs tests/issue-258-creative-compute-paths.test.mjs tests/issue-83-character-visual-identity.test.mjs tests/issue-512-buzz-version-maintenance.test.mjs tests/issue-620-buzz-startup-updater.test.mjs
      - name: Validate automatic local ComfyUI, Comfy MCP management, and permission-based recovery
        run: node --test tests/comfyui-desktop-onboarding.test.mjs tests/issue-946-comfyui-settings-onboarding.test.mjs tests/issue-961-auto-local-comfyui-sketch.test.mjs tests/issue-1012-comfyui-managed-instance-readiness.test.mjs tests/issue-1022-sdxl-starter-checkpoint.test.mjs tests/issue-1083-comfy-mcp-management-adapter.test.mjs
      - name: Validate permanent PlotPickle Studio identity
        run: node --test tests/issue-927-studio-identity.test.mjs
      - name: Validate outbound Playhouse federation boundary
        run: node --test tests/issue-928-playhouse-federation.test.mjs
      - name: Validate Connected Studios discovery and moderation
        run: node --test tests/issue-929-connected-studios.test.mjs
      - name: Production build
        run: npm run build

# Runtime model downloads and live third-party installer downloads are intentionally excluded from CI.
# Live capability probes, /models, ComfyUI, Buzz release checks, and curriculum-RAG health checks run on the user's detected hardware.
