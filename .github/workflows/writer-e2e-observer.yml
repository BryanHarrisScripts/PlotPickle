name: Writer End-to-End Observer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-state-contract:
    name: Completion journey and final-state contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Validate Writer end-to-end final-state contract
        run: npm run test:writer-observer
      - name: Validate Full Verification closeout contract
        run: node --test tests/issue-1230-full-verification-closeout.test.mjs
      - name: Parse Writer acceptance scripts
        run: |
          node --check scripts/run-writer-in-residence.mjs
          node --check scripts/run-writer-in-residence-e2e.mjs
          node --check scripts/writer-app-runtime.mjs
          node --check scripts/writer-e2e-acceptance-policy.mjs
          node --check scripts/writer-sage-acceptance.mjs
          node --check scripts/writer-snapshot-normalizer.mjs
          node --check scripts/writer-visible-controls.mjs
          node --check scripts/writer-in-residence-runtime-recovery.mjs
          node --check scripts/writer-journey-completion.mjs
          node --check scripts/writer-journey-final-state.mjs
      - name: Production build
        run: npm run build

  windows-payload-contract:
    name: Windows browser-evaluate payload contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Execute the shared Writer observer transport fixture
        run: node --test tests/issue-1170-writer-observer-stabilization.test.mjs tests/issue-1230-full-verification-closeout.test.mjs
      - name: Parse the live Writer boundary
        run: |
          node --check scripts/run-writer-in-residence.mjs
          node --check scripts/run-writer-in-residence-e2e.mjs
          node --check scripts/writer-journey-final-state.mjs
