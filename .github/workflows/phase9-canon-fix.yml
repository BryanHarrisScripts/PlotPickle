name: Temporary Phase 9 canonical-order correction

on:
  push:
    branches:
      - issue-2094-phase-9

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-2094-phase-9
          fetch-depth: 0

      - name: Correct Phase 9 audit order and expectations
        shell: python
        run: |
          import json
          import pathlib
          import re

          root = pathlib.Path('.')
          baseline = 'dd3867465e3e745b675ed0d8d5f73a82910969c8'

          ledger_path = root / 'docs/learn/lesson-integration-2094.json'
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          old = ledger['lessons']
          corrected = {str(n): old[str(n)] for n in range(1, 83)}
          corrected['83'] = {
              'presentationOrder': 83,
              'lessonId': 'professional-pitching-and-representation',
              'topic': 'industry',
              'title': 'Professional Practice: Pitching and Representation',
              'sourceIds': [],
              'learnerSufficientBefore': True,
              'decisions': [
                  {
                      'concept': 'Purpose-specific pitch, query, submission, follow-up and representation conversations; truthful project status; story-promise communication; representation as a defined professional relationship',
                      'action': 'ALREADY_CLEAR',
                      'evidence': 'Know what conversation you are having; Build the pitch around the story promise; A query is a truthful doorway; Representation is a working relationship',
                  },
                  {
                      'concept': 'Current submission policies, guild or agency rules, contract terms, credits, options, compensation and jurisdiction-specific requirements',
                      'action': 'DO_NOT_FREEZE',
                      'evidence': 'Verify current official rules and the actual agreement when they apply',
                  },
                  {
                      'concept': 'Inflating attachments, financing, rights or interest; assuming every representative title has the same scope; treating access or representation as a measure of artistic worth',
                      'action': 'REJECT',
                      'evidence': 'Truthful claims, explicit scope and a career system built around controllable actions',
                  },
              ],
              'learnerSufficientAfter': True,
              'sufficiencyNote': 'This independently authored enrichment lesson is already learner-sufficient and keeps mutable industry rules outside frozen curriculum authority.',
              'reviewedAtCommit': baseline,
          }
          for order in range(84, 91):
              record = dict(old[str(order - 1)])
              record['presentationOrder'] = order
              corrected[str(order)] = record
          ledger['lessons'] = corrected
          ledger_path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          catalog_path = root / 'adapters/curriculum/current-catalog-integrated.ts'
          catalog = catalog_path.read_text(encoding='utf-8')
          old_sentence = 'Major film organizations are not interchangeable. WGA, DGA and SAG-AFTRA are labour organizations for writers, directors/directorial teams and performers/media professionals; IATSE represents many technicians, artisans and craftspeople. The Producers Guild of America is a professional trade association for producers rather than the labour-union equivalent of those guilds.'
          new_sentence = 'Major film organizations are not interchangeable. The Writers Guild of America (WGA), Directors Guild of America (DGA) and SAG-AFTRA are labour organizations for writers, directors/directorial teams and performers/media professionals; the International Alliance of Theatrical Stage Employees (IATSE) represents many technicians, artisans and craftspeople. The Producers Guild of America (PGA) is a professional trade association for producers rather than the labour-union equivalent of those guilds.'
          if old_sentence not in catalog:
              raise SystemExit('Expected Film Industry organization sentence not found')
          catalog_path.write_text(catalog.replace(old_sentence, new_sentence, 1), encoding='utf-8')

          test_path = root / 'tests/issue-2094-lesson-integration.test.mjs'
          test = test_path.read_text(encoding='utf-8')
          map_pattern = re.compile(r'  const expected = new Map\(\[\n.*?\n  \]\);', re.S)
          replacement = '''  const expected = new Map([\n    [81, ["What the major organizations actually do", "Writers Guild of America", "Producers Guild of America", "Professional society or academy"]],\n    [82, ["Ownership and licences answer different questions", "Choose access, publication and reuse separately"]],\n    [83, ["Know what conversation you are having", "A query is a truthful doorway", "Representation is a working relationship"]],\n    [84, ["Begin with the creative relationship", "Name the canonical project", "Choose only what the project needs"]],\n    [85, ["Define roles and decision ownership", "Propose rather than overwrite"]],\n    [86, ["Choose by purpose, not familiarity", "Plan for round trips"]],\n    [87, ["The operating agreement"]],\n    [88, ["creative authority", "technical permission"]],\n    [89, ["acceptance criteria"]],\n    [90, ["approved", "stale"]],\n  ]);'''
          test, count = map_pattern.subn(replacement, test, count=1)
          if count != 1:
              raise SystemExit('Expected Phase 9 concept map not found')
          old_tail = '''  assert.equal(lessons[80].title, "The Film Industry");\n  assert.equal(lessons[89].title, "Submit a Reviewable Proposal");\n  assert.equal(lessons[90].title, "Review the Change, Not the Person");'''
          new_tail = '''  assert.equal(lessons[80].title, "The Film Industry");\n  assert.equal(lessons[89].title, "Start From the Approved Story");\n  assert.equal(lessons[90].title, "Submit a Reviewable Proposal");'''
          if old_tail not in test:
              raise SystemExit('Expected Phase 9 endpoint assertions not found')
          test_path.write_text(test.replace(old_tail, new_tail, 1), encoding='utf-8')

          checkpoint = '''# #2094 Phase 9 checkpoint — Lessons 81–90\n\n## Baseline\n\nPhase 9 started from merged `main` commit `dd3867465e3e745b675ed0d8d5f73a82910969c8` on branch `issue-2094-phase-9`. Scope is presentation Lessons 81–90 only.\n\n## Reviewed lessons\n\n81. The Film Industry\n82. Ownership, Licences and Sharing Choices\n83. Professional Practice: Pitching and Representation\n84. Choose Your PlotPickle Workflow\n85. Collaborate Without Losing the Source of Truth\n86. Formats That Travel\n87. Choose the Collaboration Model\n88. Define Roles and Decision Authority\n89. Create a Contribution Brief\n90. Start From the Approved Story\n\n## Result\n\nNine Phase 9 lessons were learner-sufficient before changes. Lesson 81 had one source-dependent gap: the normal lesson named major film organizations but did not explain enough of their distinct stable functions without opening the source viewer.\n\n### Lesson 81 — The Film Industry\n\nPhase 9 adds `What the major organizations actually do`, plus definitions for `Trade association` and `Professional society or academy`. The learner-facing teaching now spells out the Writers Guild of America (WGA), Directors Guild of America (DGA), SAG-AFTRA, International Alliance of Theatrical Stage Employees (IATSE) and Producers Guild of America (PGA), while distinguishing labour organizations, trade associations, academies/societies, cultural institutions and business-sector associations.\n\nThe integration deliberately does **not** freeze membership counts, current rosters, rates, eligibility, benefits, agreement terms or other live organizational facts. Those require current authoritative verification.\n\n### Lesson 82 — Ownership, Licences and Sharing Choices\n\nAlready learner-sufficient. It separates ownership, licences, access, publication, reuse, credit, provenance and third-party rights, while leaving jurisdiction-specific legal outcomes to current authoritative information and professional review.\n\n### Lesson 83 — Professional Practice: Pitching and Representation\n\nAlready learner-sufficient. This independently authored enrichment lesson distinguishes pitch, query, submission and representation conversations; requires truthful project-status claims; treats representation as a defined working relationship; and routes mutable guild, agency, contract, credit, option and compensation rules to current verification rather than frozen curriculum authority.\n\n### Lessons 84–88\n\n`Choose Your PlotPickle Workflow`, `Collaborate Without Losing the Source of Truth`, `Formats That Travel`, `Choose the Collaboration Model` and `Define Roles and Decision Authority` already contain the durable learner-facing teaching from their attached sources. Historical GitHub/product instructions, obsolete interchange workarounds and unsupported open-source outcome claims remain provenance or are rejected rather than promoted into current authority.\n\n### Lessons 89–90\n\n`Create a Contribution Brief` and `Start From the Approved Story` are source-free and already teach bounded contribution scope, acceptance criteria, approved-base handling and stale-base reconsideration. No learner-facing rewrite is justified.\n\n## Preserved boundaries\n\nThe 96-lesson presentation order and 95 unique bundled source records remain unchanged. Learner-facing Journey/Explore source-viewer retirement remains deferred until all 96 lessons pass. Underlying source content, IDs and provenance remain retained internally. Phase 9 makes no navigation, agent, provider, model, PPF or production-architecture changes.\n\n## Verification contract\n\nFocused #2094 verification extends through presentation Lesson 90 and follows the actual canonical presentation order. It verifies exact lesson identity/source routing, the Lesson 81 organization-role integration, learner sufficiency for Lessons 82–90, unchanged global presentation/source fingerprints and the Phase 10 restart boundary.\n\n## Stop boundary\n\nPhase 9 stops after presentation Lesson 90, `Start From the Approved Story`.\n\nPhase 10 must restart at presentation Lesson 91, `Submit a Reviewable Proposal`, from merged/current `main`. Phase 10 owns Lessons 91–96 and the final source-viewer retirement decision only after all 96 lessons pass.\n'''
          (root / 'docs/learn/lesson-integration-2094-phase-9.md').write_text(checkpoint, encoding='utf-8')

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase9-canon-fix.yml
          git add adapters/curriculum/current-catalog-integrated.ts docs/learn/lesson-integration-2094.json docs/learn/lesson-integration-2094-phase-9.md tests/issue-2094-lesson-integration.test.mjs
          git commit -m "fix: align Phase 9 audit with canonical lesson order"
          git push origin HEAD:issue-2094-phase-9
