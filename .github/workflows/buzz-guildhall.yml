permissions:
  contents: read

jobs:
  guildhall-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check Guildhall scripts
        run: |
          node --check scripts/agent-skills.mjs
          node --check scripts/agent-skill-procedures.mjs
          node --check scripts/bootstrap-buzz-guildhall.mjs
          node --check build/post-buzz-guildhall-event.mjs
          node --check scripts/buzz-live-activity.mjs
          node --check scripts/verify-buzz-live-activity.mjs
          node --check scripts/writer-in-residence-runtime-recovery.mjs
          node --check scripts/report-writer-in-residence.mjs
          node --check scripts/report-uat-findings.mjs
          node --check scripts/run-uat-closed-loop.mjs
          node --check scripts/run-semantic-uat-repair.mjs
      - name: Validate Agent Skills and Agent Contract authority boundaries
        run: node --test tests/issue-913-agent-skills-migration.test.mjs tests/issue-962-agent-profiles.test.mjs tests/issue-1028-settings-help.test.mjs
      - name: Validate Buzz release and updater policy
        run: node --test tests/issue-512-buzz-version-maintenance.test.mjs tests/issue-620-buzz-startup-updater.test.mjs
      - name: Validate Guildhall, local backbone, BUZZ-native Community, Profile identity, mirror, Moderator, Story Room, README, and live BUZZ contracts
        run: node --test tests/core-readme-direction.test.mjs tests/issue-675-buzz-guildhall.test.mjs tests/issue-677-buzz-guildhall-settings.test.mjs tests/issue-1222-buzz-real-machine-regression.test.mjs tests/issue-1130-buzz-local-backbone.test.mjs tests/issue-672-global-navigation.test.mjs tests/issue-1067-buzz-conversation-mirror.test.mjs tests/issue-1129-buzz-native-community.test.mjs tests/community-workspace.test.mjs tests/community-agent-roster.test.mjs tests/buzz-live-roundtrip.test.mjs tests/buzz-story-room-access-agents.test.mjs tests/issue-1444-story-room-identity.test.mjs tests/issue-1065-bbs-moderator.test.mjs tests/issue-1081-merrin-room-aware-moderation.test.mjs tests/live-buzz-guildhall-activity.test.mjs
