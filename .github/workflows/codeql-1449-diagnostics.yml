name: PR 1449 CodeQL diagnostics

on:
  pull_request:
    paths:
      - "Utilities/DeveloperWorkbench/**"
      - "scripts/pi-worker-runtime.mjs"
      - "tests/issue-1448-developer-workbench-local-reviewers.test.mjs"
      - ".github/workflows/developer-workbench.yml"
      - ".github/workflows/codeql-1449-diagnostics.yml"

permissions:
  contents: read

jobs:
  sarif:
    name: Raw SARIF (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, csharp]

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze without uploading
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          output: codeql-sarif
          upload: false

      - name: Upload raw SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-1449-${{ matrix.language }}-${{ github.sha }}
          path: codeql-sarif/
          retention-days: 1
          if-no-files-found: error
