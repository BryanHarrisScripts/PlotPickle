name: Issue 100 test diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/issue-100-premium-ui-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-100-premium-ui-ux
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Capture failing test output
        run: |
          set +e
          npm test > .issue-100-test.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Tests passed" > .issue-100-test.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .issue-100-test.log
          git commit -m "Record issue 100 test diagnostic" || true
          git push origin HEAD:agent/issue-100-premium-ui-ux
          exit "$status"
