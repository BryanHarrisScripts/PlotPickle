name: Agent human acceptance

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: PlotPickle local URL used by the browser agent
        required: false
        default: http://127.0.0.1:4173
      scope:
        description: Acceptance scope
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
  push:
    branches:
      - main
    paths:
      - .github/workflows/agent-human-acceptance.yml

permissions:
  contents: read

concurrency:
  group: agent-human-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  human-acceptance:
    name: Human-like PlotPickle workflow
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PLOTPICKLE_ACCEPTANCE_URL: ${{ inputs.base_url || 'http://127.0.0.1:4173' }}
      PLOTPICKLE_ACCEPTANCE_SCOPE: ${{ inputs.scope || 'smoke' }}
      CODEX_HOME: ${{ runner.temp }}/plotpickle-codex-home
      PLOTPICKLE_AGENT_PLUGIN_DATA: ${{ runner.temp }}/plotpickle-agent-plugin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require agent credential
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is required for the Codex human-acceptance agent." >&2
            exit 1
          fi

      - name: Install PlotPickle dependencies
        run: npm ci

      - name: Validate portable Agent Plugin package
        run: node --test tests/issue-488-agent-plugin-workflow-tester.test.mjs

      - name: Install Codex CLI
        run: npm install --global @openai/codex

      - name: Prepare Agent Plugins adapter for Codex
        run: node scripts/prepare-agent-plugin-runner.mjs

      - name: Start PlotPickle locally
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/plotpickle-agent-run"
          npm run dev:local -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/plotpickle-agent-run/app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/plotpickle-agent-run/app.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$PLOTPICKLE_ACCEPTANCE_URL" >/dev/null; then
              echo "PlotPickle is ready at $PLOTPICKLE_ACCEPTANCE_URL"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/plotpickle-agent-run/app.log" || true
          exit 1

      - name: Run Codex human acceptance agent
        shell: bash
        run: |
          mkdir -p "$PLOTPICKLE_AGENT_PLUGIN_DATA/artifacts"
          SKILL="tools/agent-plugins/plotpickle-workflow-tester/skills/plotpickle-human-acceptance/SKILL.md"
          CHECKLIST="tools/agent-plugins/plotpickle-workflow-tester/skills/plotpickle-human-acceptance/references/workflow-checklist.md"
          CONTRACT="tools/agent-plugins/plotpickle-workflow-tester/skills/plotpickle-human-acceptance/references/visual-continuity-contract.md"
          PROMPT=$(cat <<EOF
          Act as PlotPickle's human acceptance tester. Read and follow $SKILL, $CHECKLIST, and $CONTRACT.

          Test the rendered application at $PLOTPICKLE_ACCEPTANCE_URL using the configured Playwright MCP browser server. Use visible UI controls as a human user would. Do not edit repository files, do not call internal app functions, do not use real credentials, do not spend money, and do not perform external writes.

          Acceptance scope: $PLOTPICKLE_ACCEPTANCE_SCOPE.
          For smoke scope, complete splash/dashboard, project safety, Plan → Storyboard → Write → Edit → Graphic Novel → Build context continuity, then verify Feedback can be reached. For full scope, follow the complete checklist through Reports/Export plus the available local-integration recovery states.

          Take screenshots at major screens and on every WARN or FAIL. Judge usability as well as technical function. End with a structured PASS/WARN/FAIL report including reproduction steps, story position, screenshot names and console/runtime errors. Do not fix issues during this run.
          EOF
          )
          set -o pipefail
          codex exec --json --sandbox read-only \
            --output-last-message "$PLOTPICKLE_AGENT_PLUGIN_DATA/artifacts/acceptance-report.md" \
            "$PROMPT" | tee "$PLOTPICKLE_AGENT_PLUGIN_DATA/artifacts/codex-trace.jsonl"

      - name: Collect app log
        if: always()
        shell: bash
        run: |
          mkdir -p "$PLOTPICKLE_AGENT_PLUGIN_DATA/artifacts"
          cp "$RUNNER_TEMP/plotpickle-agent-run/app.log" "$PLOTPICKLE_AGENT_PLUGIN_DATA/artifacts/plotpickle-app.log" 2>/dev/null || true

      - name: Upload human acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plotpickle-human-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/plotpickle-agent-plugin/artifacts
            tools/agent-plugins/plotpickle-workflow-tester/*.png
            tools/agent-plugins/plotpickle-workflow-tester/*.webp
          if-no-files-found: warn
          retention-days: 14
