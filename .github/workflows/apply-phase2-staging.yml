name: Apply Phase 2 staging

on:
  push:
    branches: [agent/184-google-desktop-oauth]
    paths:
      - ".phase2-staging/READY"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/184-google-desktop-oauth
          fetch-depth: 0

      - name: Restore reviewed Phase 2 files
        shell: bash
        run: |
          set -euo pipefail
          cat .phase2-staging/chunk-*.b64 | base64 --decode > /tmp/phase2-files.tar.gz
          echo "0385a5e18fd5b25730443dcd75c0a34c60fb8f2d2614e5dda8fa60512f81cdd2  /tmp/phase2-files.tar.gz" | sha256sum -c -
          tar -xzf /tmp/phase2-files.tar.gz

      - name: Validate focused Phase 2 contracts
        run: node --test tests/issue-120-settings-connections.test.mjs tests/issue-144-connection-trust.test.mjs tests/issue-182-collab-workspace.test.mjs tests/issue-184-google-desktop-oauth.test.mjs

      - name: Commit consolidated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .phase2-staging
          rm -f .github/workflows/apply-phase2-staging.yml
          git config user.name "PlotPickle Build Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement Google desktop OAuth and encrypted credentials"
          git push origin HEAD:agent/184-google-desktop-oauth
