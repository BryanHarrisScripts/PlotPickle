name: Agent Skill Trust

on:
  pull_request:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - "config/agent-profiles.json"
      - "lib/agents/agent-profiles.ts"
      - "lib/agent-skill-trust.ts"
      - "tests/issue-962-agent-profiles.test.mjs"
      - "tests/issue-1174-agent-skill-trust.test.mjs"
      - "docs/agent-skill-trust.md"
      - ".github/workflows/agent-skill-trust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-skill-trust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Agent Skill trust boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate Agent Profile contracts
        run: node --test tests/issue-962-agent-profiles.test.mjs

      - name: Validate Agent Skill trust boundaries
        run: node --test tests/issue-1174-agent-skill-trust.test.mjs
