name: Issue 113 integration patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Apply, validate and commit issue 113 integration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch "$GITHUB_HEAD_REF" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python scripts/apply-issue-113.py
          npm ci --silent >/dev/null 2>&1
          if ! npm run test:dashboard-command-centre > /tmp/issue-113-tests.log 2>&1; then
            echo "::error title=Issue 113 targeted test failure::"
            cat /tmp/issue-113-tests.log
            exit 1
          fi
          if ! npm run lint > /tmp/issue-113-lint.log 2>&1; then
            echo "::error title=Issue 113 lint failure::"
            tail -n 120 /tmp/issue-113-lint.log
            exit 1
          fi
          echo "Issue #113 targeted tests and lint passed."
          if git diff --quiet; then
            echo "Issue #113 integration already present."
            exit 0
          fi
          git config user.name "PlotPickle Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/settings-panel.tsx lib/dashboard-command-centre.ts tests/proposed-primary-menu.test.mjs
          git commit -m "[issue-113-apply] Wire dashboard command centre"
          git push origin HEAD:${GITHUB_HEAD_REF}
