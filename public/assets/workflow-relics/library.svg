    <circle cx="48" cy="48" r="27" stroke="#86632d" stroke-width="1.5" opacity=".82"/>
    <path d="M24 34c8-3 15-2 24 4v31c-8-6-16-8-24-5Z" fill="url(#page)" stroke="url(#gold)" stroke-width="2.3"/>
    <path d="M72 34c-8-3-15-2-24 4v31c8-6 16-8 24-5Z" fill="url(#page)" stroke="url(#gold)" stroke-width="2.3"/>
