name: Temporary Issue 26 Test Capture

on:
  push:
    branches:
      - agent/issue-26-reports-terms-collaboration
    paths:
      - .github/workflows/capture-issue26-test.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-26-reports-terms-collaboration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capture build and test output
        shell: bash
        run: |
          set +e
          npm test > docs/issue26-test.log 2>&1
          echo $? > docs/issue26-test.exit
          set -e
          rm -f .github/workflows/capture-issue26-test.yml
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "PlotPickle Diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Temporary: capture Issue 26 test diagnostics"
          git push origin HEAD:agent/issue-26-reports-terms-collaboration
