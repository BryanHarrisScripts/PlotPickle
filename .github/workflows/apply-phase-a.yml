name: Apply Phase A source migration

on:
  push:
    branches:
      - agent/phase-a-core-model-013
    paths:
      - scripts/apply-phase-a.py
      - .github/workflows/apply-phase-a.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-a-core-model-013
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase A
        run: python scripts/apply-phase-a.py
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate the canonical Phase A core model"
          git push origin HEAD:agent/phase-a-core-model-013
