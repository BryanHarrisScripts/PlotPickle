    <path d="M29 43c5-1 9 0 14 3M29 50c5-1 9 0 14 3M29 57c5-1 9 0 14 3M53 46c5-3 9-4 14-3M53 53c5-3 9-4 14-3M53 60c5-3 9-4 14-3" stroke="#5d563f" stroke-width="1.5" opacity=".82"/>
